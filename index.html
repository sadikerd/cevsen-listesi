<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cevşen Listesi</title>
<link rel="icon" type="image/png" href="favicon.png">

<!-- PWA: telefonun ana ekranına eklenebilmesi için -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1E4D3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cevşen Listesi">

<!-- Open Graph / WhatsApp link preview — requires og-image.png uploaded in the same folder as this file -->
<meta property="og:title" content="Cevşen Listesi — Bâb Dağılımı">
<meta property="og:description" content="Boş bir bâba dokun, ismini yaz, senin olsun.">
<meta property="og:image" content="og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Cevşen Listesi — Bâb Dağılımı">
<meta name="twitter:description" content="Boş bir bâba dokun, ismini yaz, senin olsun.">
<meta name="twitter:image" content="og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://db.onlinewebfonts.com/c/545e2d6eac66c6985c113d4656797e49?family=Shaikh+Hamdullah+Mushaf" rel="stylesheet">
<style>
  :root {
    --paper: #F5EFE1;
    --paper-deep: #ECE3CC;
    --ink: #26301F;
    --ink-soft: #5B6350;
    --emerald: #1E4D3B;
    --emerald-deep: #143327;
    --gold: #B08A2E;
    --gold-soft: #D9C68F;
    --line: #D8CBA8;
    --white: #FFFDF8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  header .logo {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    margin-bottom: 6px;
    border: 2px solid var(--gold-soft);
    box-shadow: 0 3px 10px rgba(38, 48, 31, 0.25);
  }

  header .kicker {
    font-family: 'Amiri', serif;
    font-size: 26px;
    color: var(--emerald-deep);
    letter-spacing: 0.5px;
    margin: 0 0 4px;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .info-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 4px;
  }

  .info-item {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }

  .info-item + .info-item {
    padding-left: 12px;
    border-left: 1px solid var(--line);
  }

  .info-label {
    font-size: 10.5px;
    color: var(--ink-soft);
  }

  .info-value {
    font-size: 14px;
    font-weight: 500;
    color: var(--emerald-deep);
  }

  .info-editable {
    cursor: pointer;
    text-decoration: underline dotted var(--gold-soft);
    text-underline-offset: 3px;
  }

  .countdown-banner {
    text-align: center;
    font-size: 13px;
    color: var(--emerald-deep);
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    margin: 10px 0 0;
    font-weight: 500;
  }

  .countdown-banner.empty {
    color: var(--ink-soft);
    font-weight: 400;
    cursor: pointer;
  }

  .countdown-banner.overdue {
    color: #A6432D;
    background: #F3E2DC;
    border-color: #E0B7AC;
  }

  .countdown-banner.soon {
    color: #A6432D;
    background: #F7E4DC;
    border-color: #E0B7AC;
    font-weight: 700;
  }

  .help-banner {
    text-align: center;
    font-size: 12.5px;
    color: #A6432D;
    background: #F3E2DC;
    border: 1px solid #E0B7AC;
    border-radius: 8px;
    padding: 7px 10px;
    margin-top: 8px;
    font-weight: 500;
    display: none;
  }

  .help-banner.show { display: block; }

  .actions-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .action-btn {
    flex: 1;
    min-width: 90px;
    background: var(--white);
    border: 1px solid var(--line);
    color: var(--emerald-deep);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 9px 6px;
    border-radius: 8px;
    cursor: pointer;
    white-space: normal;
    line-height: 1.3;
    text-align: center;
  }

  .view-toggle {
    display: flex;
    gap: 6px;
    margin-top: 14px;
  }

  .view-toggle-btn {
    background: var(--white);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
  }

  .view-toggle-btn.active {
    background: var(--emerald);
    border-color: var(--emerald);
    color: var(--white);
  }

  .who-took-list {
    list-style: none;
    margin: 0 0 14px;
    padding: 0;
    max-height: 260px;
    overflow-y: auto;
  }

  .who-bar-list {
    list-style: none;
    margin: 0 0 14px;
    padding: 0;
    max-height: 320px;
    overflow-y: auto;
  }

  .who-bar-row {
    margin-bottom: 12px;
  }

  .who-bar-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
    font-size: 14px;
  }

  .who-bar-label span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    font-weight: 500;
    color: var(--ink);
  }

  .who-bar-count {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .who-bar-track {
    height: 8px;
    background: var(--paper-deep);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--line);
  }

  .who-bar-fill {
    height: 100%;
    background: var(--emerald);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .who-took-list li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }

  .who-took-list li span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .who-took-list li span.count {
    color: var(--ink-soft);
    font-size: 12.5px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .progress-bar {
    height: 6px;
    background: var(--paper-deep);
    border-radius: 4px;
    overflow: hidden;
    margin: 18px 0 6px;
    border: 1px solid var(--line);
  }

  .progress-fill {
    height: 100%;
    background: var(--emerald);
    transition: width 0.4s ease;
  }

  .progress-label {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .grid-wrap {
    position: relative;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 10px;
  }

  .grid.blurred {
    filter: blur(7px);
    pointer-events: none;
    user-select: none;
  }

  .tur-lock-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }

  .tur-lock-overlay.show {
    display: flex;
  }

  .tur-lock-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 10px 26px rgba(38, 48, 31, 0.25);
    max-width: 260px;
    width: 100%;
  }

  .tur-lock-card p {
    font-weight: 600;
    color: var(--emerald-deep);
    margin: 0 0 12px;
  }

  .tur-lock-card input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 10px;
    background: var(--paper);
    color: var(--ink);
  }

  @media (min-width: 480px) {
    .grid { grid-template-columns: repeat(8, 1fr); }
  }

  .grid.list-mode {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  .grid.list-mode .tile {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
    padding: 10px 14px;
    gap: 12px;
  }

  .grid.list-mode .tile .num {
    flex-shrink: 0;
    min-width: 34px;
    font-size: 16px;
  }

  .grid.list-mode .tile .status {
    margin-top: 0;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tile {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 4px 6px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
    position: relative;
  }

  .tile:active { transform: scale(0.94); }

  .tile.available {
    border-color: var(--emerald);
  }

  .tile.pending {
    background: var(--paper-deep);
    border-color: var(--gold-soft);
  }

  .tile.completed {
    background: var(--emerald-deep);
    border-color: var(--emerald-deep);
  }

  .tile .num {
    font-family: 'Amiri', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--emerald-deep);
    display: block;
    line-height: 1;
  }

  .tile.pending .num {
    color: #9C8654;
  }

  .tile.completed .num,
  .tile.completed .status {
    color: var(--white);
  }

  .tile .status {
    display: block;
    margin-top: 3px;
    font-size: 8.5px;
    color: var(--ink-soft);
    line-height: 1.2;
    word-break: break-word;
  }

  .tile.available .status {
    color: var(--emerald);
    font-weight: 500;
  }

  .tile.pending.help {
    border-color: #C0523A;
    box-shadow: 0 0 0 1px #C0523A inset;
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(38,48,31,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 800;
  }

  .overlay.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: 14px;
    padding: 22px 20px;
    width: 100%;
    max-width: 320px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
  }

  .modal h2 {
    font-family: 'Amiri', serif;
    color: var(--emerald-deep);
    margin: 0 0 4px;
    font-size: 24px;
  }

  .modal .sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .modal input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 12px;
    background: var(--paper);
    color: var(--ink);
  }

  .modal input:focus {
    outline: none;
    border-color: var(--emerald);
  }

  .modal-actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--emerald);
    color: var(--white);
  }

  .btn-primary:disabled {
    background: var(--gold-soft);
    cursor: not-allowed;
  }

  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }

  .btn-danger {
    background: transparent;
    color: #A6432D;
    border: 1px solid #E0B7AC;
  }

  .btn-help {
    background: #A6432D;
    color: var(--white);
  }

  .btn-read {
    background: var(--gold);
    color: var(--white);
  }

  .pin-hint {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
    margin: -4px 0 12px;
    cursor: pointer;
    text-decoration: underline dotted var(--gold-soft);
    text-underline-offset: 2px;
  }

  .taken-info {
    background: var(--paper);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 14px;
  }

  .name-hint {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: -4px 0 14px;
  }

  /* Tam ekran okuma ekranı */
  .reader-screen {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 700;
    display: none;
    flex-direction: column;
  }

  .reader-screen.open {
    display: flex;
  }

  .reader-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px 10px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .reader-close-btn {
    background: var(--white);
    border: 1px solid var(--line);
    color: var(--emerald-deep);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .reader-titles {
    display: flex;
    flex-direction: column;
    min-width: 0;
    flex: 1;
  }

  .reader-title {
    font-family: 'Amiri', serif;
    font-size: 20px;
    color: var(--emerald-deep);
    line-height: 1.2;
  }

  .reader-meta {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .reader-nav-btn {
    background: var(--white);
    border: 1px solid var(--line);
    color: var(--emerald-deep);
    font-size: 18px;
    font-weight: 700;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .reader-nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .reader-tabs {
    display: flex;
    gap: 6px;
    padding: 12px 18px;
    flex-shrink: 0;
  }

  .reader-tab-btn {
    flex: 1;
    background: var(--white);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 0;
    border-radius: 8px;
    cursor: pointer;
  }

  .reader-tab-btn.active {
    background: var(--emerald);
    border-color: var(--emerald);
    color: var(--white);
  }

  .reader-font-btn {
    background: var(--white);
    border: 1px solid var(--line);
    color: var(--emerald-deep);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    flex: 0 0 32px;
    padding: 9px 0;
    border-radius: 8px;
    cursor: pointer;
  }

  .reader-content {
    flex: 1;
    overflow-y: auto;
    padding: 8px 22px 22px;
    --font-scale: 1;
  }

  .reader-text {
    font-size: calc(16px * var(--font-scale, 1));
    line-height: 1.8;
    color: var(--ink);
    margin: 0 0 2px;
    padding: 2px 12px;
    border-radius: 8px;
  }

  .reader-text:last-child {
    margin-bottom: 0;
  }

  .reader-text:nth-child(odd) {
    background: var(--paper-deep);
  }

  .reader-arabic {
    font-family: 'Shaikh Hamdullah Mushaf', 'Amiri', serif;
    font-size: calc(26px * var(--font-scale, 1));
    line-height: 1.4;
    color: var(--emerald-deep);
    text-align: right;
    margin-bottom: 8px;
  }

  .reader-meal,
  .reader-okunus {
    font-size: calc(16.5px * var(--font-scale, 1));
  }

  .reader-footer {
    padding: 14px 18px 20px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }

  .reader-done {
    text-align: center;
    color: var(--emerald);
    font-weight: 600;
    font-size: 15px;
    margin: 0;
  }

  .note {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 24px;
    line-height: 1.5;
  }

  .loading-screen {
    position: fixed;
    inset: 0;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 500;
    transition: opacity 0.35s ease;
  }

  .loading-screen.hide {
    opacity: 0;
    pointer-events: none;
  }

  .loading-logo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid var(--gold-soft);
    box-shadow: 0 3px 10px rgba(38, 48, 31, 0.2);
  }

  .spinner-ring {
    width: 34px;
    height: 34px;
    border: 4px solid var(--paper-deep);
    border-top-color: var(--emerald);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-screen p {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0;
  }

  @keyframes confettiFall {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0.95; }
    100% { transform: translate(var(--drift), 100vh) rotate(360deg); opacity: 0.3; }
  }
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
  <img class="loading-logo" src="logo.png" alt="Harmonie31">
  <div class="spinner-ring"></div>
  <p>Yükleniyor…</p>
</div>
<div class="wrap">
  <header>
    <img class="logo" src="logo.png" alt="Harmonie31">
    <p class="kicker">Cevşen Listesi</p>
    <p class="info-editable" id="descriptionText">Boş bir bâba dokunup ismini yaz, senin olsun.</p>
  </header>

  <div class="info-bar">
    <div class="info-item" id="roundItem">
      <span class="info-label">Tur Adı</span>
      <span class="info-value info-editable" id="roundValue">—</span>
    </div>
    <div class="info-item" id="startItem">
      <span class="info-label">Açılma tarihi</span>
      <span class="info-value info-editable" id="startValue">—</span>
    </div>
    <div class="info-item" id="targetDateItem">
      <span class="info-label">Son okuma tarihi</span>
      <span class="info-value info-editable" id="targetDateValue">—</span>
    </div>
  </div>

  <div class="countdown-banner" id="countdownBanner"></div>

  <div class="actions-row">
    <button class="action-btn" id="menuBtn">☰ Menü</button>
  </div>

  <div class="view-toggle">
    <button class="view-toggle-btn" id="viewGridBtn">▦ Kare</button>
    <button class="view-toggle-btn" id="viewListBtn">☰ Liste</button>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">Yükleniyor…</div>

  <div class="grid-wrap" id="gridWrap">
    <div id="grid" class="grid"></div>
    <div class="tur-lock-overlay" id="turLockOverlay"></div>
  </div>

  <p class="note" id="footNote"></p>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="reader-screen" id="readerScreen">
  <div class="reader-topbar">
    <button class="reader-close-btn" id="readerCloseBtn">← Kapat</button>
    <div class="reader-titles">
      <span class="reader-title" id="readerTitle"></span>
      <span class="reader-meta" id="readerMeta"></span>
    </div>
    <button class="reader-nav-btn" id="readerPrevBtn" title="Önceki bâb">‹</button>
    <button class="reader-nav-btn" id="readerNextBtn" title="Sonraki bâb">›</button>
  </div>
  <div class="reader-tabs">
    <button class="reader-tab-btn" id="readerTab_arabic">Arapça</button>
    <button class="reader-tab-btn" id="readerTab_meal">Meal</button>
    <button class="reader-tab-btn" id="readerTab_okunus">Türkçe</button>
    <button class="reader-font-btn" id="readerFontDec">A−</button>
    <button class="reader-font-btn" id="readerFontInc">A+</button>
  </div>
  <div class="reader-content" id="readerContent"></div>
  <div class="reader-footer" id="readerFooter"></div>
</div>

<script type="module">

const CEVSEN_DATA = {1:{a:'اَللّٰهُمَّ اِنِّٓى اَسْئَلُكَ بِاَسْمَٓائِكَ ● َيَا اَللّٰهُ ● يَا رَحْمٰنُ ● يَا رَحِيمُ ● يَا عَلِيمُ ● يَا حَلِيمُ ● يَا عَظِيمُ ● يَا حَكِيمُ ● يَا قَدِيمُ ● يَا مُقِيمُ ● يَا كَرِيمُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١﴾',o:'1) Allâhümme innî es\'elüke biesmâike 2) Ya Allah 3) Ya Rahman 4) Ya Rahîm 5) Ya Alîm 6) Ya Halîm 7) Ya Azîm 8) Ya Hakîm 9) Ya Kadîm 10) Ya Mukîm 11) Ya Kerîm 12) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nar.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: 2) Ey her şeyin gerçek Mâbudu olan Allah, 3) Ey ayırt etmeden bütün mahlûkatı rızıklandıran Rahman, 4) Ey itaatkar kullarına hususi rahmet eden Rahîm, 5) Ey her şeyi bilen Alîm, 6) Ey yumuşak muamele eden Halîm, 7) Ey sonsuz büyüklük ve yücelik sahibi olan Azîm, 8) Ey her şeyi hikmetle yaratan Hakîm, 9) Ey varlığının başlangıcı olmayan Kadîm, 10) Ey her şeyi ayakta tutan Mukîm, 11) Ey iyilik ve ikramı bol olan Kerîm, 12) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},2:{a:'يَا سَيِّدَ السَّادَاتِ ● يَا مُجِيبَ الدَّعَوَاتِ ● يَا وَلِىَّ الْحَسَنَاتِ ● يَا رَفِيعَ الدَّرَجَاتِ ● يَا عَظِيمَ الْبَرَكَاتِ ● يَا غَافِرَ الْخَطِيئَاتِ ● يَا دَافِعَ الْبَلِيَّاتِ ● يَا سَامِعَ الْاَصْوَاتِ ● يَا مُعْطِىَ الْمَسْئوُلَاتِ ● يَا عَالِمَ السِّرِّ وَ الْخَفِيَّاتِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢﴾',o:'1) Yâ Seyyide\'s-sâdât 2) Yâ Mucîbe\'d-de\'avât 3) Yâ Veliyye\'l-hasenât 4) Yâ Refıa\'d-deracât 5) Yâ Azîme\'l-berakât 6) Yâ Ğafıra\'l-hatîât 7) Yâ Dâfî\'a\'l-beliyyât 8) Yâ Sâmi\'a\'l-esvât 9) Yâ Mu\'tıye\'l-mesûlât 10) Yâ \'Alime\'s-sirri ve\'l-hafiyyât 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey efendilerin efendisi, 2) Ey dualara cevap veren, 3) Ey iyiliklerin sahibi, 4) Ey dereceleri yükselten, 5) Ey bereketleri büyük olan, 6) Ey hataları bağışlayan, 7) Ey belaları def eden, 8) Ey sesleri işiten, 9) Ey dilekleri veren, 10) Ey sır ve gizlilikleri bilen, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},3:{a:'يَا خَيْرَ الْغَافِرِينَ ● يَا خَيْرَ النَّاصِرِينَ ● يَا خَيْرَ الْحَاكِمِينَ ● يَا خَيْرَ الْفَاتِحِينَ ● يَا خَيْرَ الذَّاكِرِينَ ● يَا خَيْرَ الْوَارِثِينَ ● يَا خَيْرَ الْحَامِدِينَ ● يَا خَيْرَ الرَّازِقِينَ ● يَا خَيْرَ الْفَاصِلِينَ ● يَا خَيْرَ الْمُحْسِنِينَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٣﴾',o:'1) Ya Hayra\'l-ğâfirîn 2) Ya Hayra\'n-nâsırîn 3) Ya Hayra\'l-hâkimîn 4) Ya Hayra\'l-fatihîn 5) Yâ Hayra\'z-zâkirîn 6) Yâ Hayra\'l-vârişîn 7) Yâ Hayra\'l-hâmidîn 8) Yâ Hayra\'r-râzikîn 9) Yâ Hayra\'l-fâsilîn 10) Yâ Hayra\'l-muhsinîn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey bağışlayanların en hayırlısı, 2) Ey yardım edenlerin en hayırlısı, 3) Ey hükmedenlerin en hayırlısı, 4) Ey her şeyi açan ve fethedenlerin en hayırlısı, 5) Ey zikredenlerin ve zikredenleri mükafatlandıranların en hayırlısı, 6) Ey vârislerin en hayırlısı, 7) Ey övenlerin ve övenleri mükafatlandıranların en hayırlısı, 8) Ey rızık verenlerin en hayırlısı, 9) Ey zor işleri halledenlerin en hayırlısı, 10) Ey ihsan edenlerin en hayırlısı, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},4:{a:'يَا مَنْ لَهُ الْعِزُّ وَ الْجَمَالُ ● يَا مَنْ لَهُ الْمُلْكُ وَ الْجَلَالُ ● يَا مَنْ لَهُ الْقُدْرَةُ وَ الْكَمَالُ ● يَا مَنْ هُوَ الْكَبِيرُ الْمُتَعَالِ ● يَا مَنْ هُوَ شَدِيدُ الْمِحَالِ ● يَا مَنْ هُوَ شَدِيدُ الْعِقَابِ ● يَا مَنْ هُوَ سَرِيعُ الْحِسَابِ ● يَا مَنْ هُوَ عِنْدَهُ حُسْنُ الثَّوَابِ ● يَا مَنْ هُوَ عِنْدَهُٓ اُمُّ الْكِتَابِ ● يَا مَنْ هُوَ يُنْشِىُٔ السَّحَابَ الثِّقَالَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٤﴾',o:'1) Yâ Men lehü\'l-\'izzü ve\'l-cemâl 2) Yâ Men lehü\'l-mülkü ve\'l-celâl 3) Yâ Men lehü\'l-kudretü ve\'l-kemâl 4) Yâ Men hüve\'l-kebîru\'l-müte\'âl 5) Yâ Men hüve şedîdü\'l-mihâl 6) Yâ Men hüve şedîdü\'l-\'ikâb 7) Yâ Men hüve serî\'u\'l-hisâb 8) Yâ Men hüve \'indehû hüsnü\'s-şevâb 9) Yâ Men hüve \'indehû ümmü\'l-kitâb 10) Yâ Men hüve yünşiü\'s-sehâbe\'s-sikâl 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey izzet ve güzelliğin gerçek sahibi, 2) Ey mülk ve celâlin gerçek sahibi, 3) Ey kudret ve kemâlin gerçek sahibi, 4) Ey büyük ve yüce olan, 5) Ey şiddetli azap sahibi olan, 6) Ey ikâbı şiddetli olan, 7) Ey hesâbı süratli gören, 8) Ey katında güzel mükafatı bulunan, 9) Ey katında Ümmül-Kitap bulunan, 10) Ey rahmet yüklü bulutları yaratan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},5:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا حَنَّانُ ● يَا مَنَّانُ ● يَا دَيَّانُ ● يَا غُفْرَانُ ● يَا بُرْهَانُ ● يَا سُلْطَانُ ● يَا سُبْحَانُ ● يَا مُسْتَعَانُ ● يَا ذَا الْمَنِّ وَ الْبَيَانِ ● يَا ذَا الْاَمَانِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٥﴾',o:'1) Ve es\'elüke biesmâike Yâ Hannân 2) Yâ Mennân 3) Yâ Deyyân 4) Yâ Gufran 5) Yâ Burhan 6) Yâ Sultân 7) Yâ Subhân 8) Yâ Muste\'ân 9) Yâ Ze\'l-menni ve\'l-beyân 10) Yâ Ze\'l-emâne 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey sonsuz merhamet sahibi olan Hannân, 2) Ey hakiki iyilik ve ihsan sahibi Mennân, 3) Ey kullarının amellerine karşılık veren Deyyân, 4) Ey bağışlaması bol olan Ğufrân, 5) Ey kullarına yol gösteren Burhân, 6) Ey gerçek saltanat sahibi Sultân, 7) Ey bütün kusur ve noksanlardan uzak olan Sübhân, 8) Ey kendinden yardım istenen Müsteân, 9) Ey nîmet ve beyân sahibi, 10) Ey emniyet ve emân sahibi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},6:{a:'يَا مَنْ تَوَاضَعَ كُلُّ شَىْءٍ لِعَظَمَتِهِ ● يَا مَنِ اسْتَسْلَمَ كُلُّ شَىْءٍ لِقُدْرَتِهِ ● يَا مَنْ ذَلَّ كُلُّ شَىْءٍ لِعِزَّتِهِ ● يَا مَنْ خَضَعَ كُلُّ شَىْءٍ لِهَيْبَتِهِ ● يَا مَنِ انْقَادَ كُلُّ شَىْءٍ لِمُلْكَتِهِ ● يَا مَنْ دَانَ كُلُّ شَىْءٍ مِنْ مَخَافَتِهِ ● يَا مَنِ انْشَقَّتِ الْجِبَالُ مِنْ خَشْيَتِهِ ● يَا مَنْ قَامَتِ السَّمٰوَاتُ بِاَمْرِهِ ● يَا مَنِ اسْتَقَرَّتِ الْاَرْضُ بِاِذْنِهِ ● َيَا مَنْ لَا يَعْتَدِى عَلىٰٓ اَهْلِ مَمْلَكَتِهِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٦﴾',o:'1) Yâ Men tevâda\'a küllü şey\'in li\'azametih 2) Yâ Meni\'stesleme küllü şey\'in likudratih 3) Yâ Men zelle küllü şey\'in li\'izzetih 4) Yâ Men hada\'a küllü şey\'in liheybetih 5) Yâ Meni\'nkâde küllü şey\'in limülketih 6) Yâ Men dâne küllü şey\'in min mehâfetih 7) Yâ Meni\'nşakkati\'l-cibâlü min haşyetin 8) Yâ Men kâmeti\'s-semâvâtü bi emrih 9) Yâ Meni\'stekarrati\'l-ardu bi iznih 10) Yâ Men lâ yâ\'tedî \'alâ ehli memleketih 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey azametine her şeyin boyun eğdiği, 2) Ey kudretine her şeyin teslim olduğu, 3) Ey izzetine karşı her şeyin zelîl olduğu, 4) Ey heybetine her şeyin itaat ettiği, 5) Ey saltanatına karşı her şeyin inkıyat ettiği, 6) Ey korkusundan her şeyin kendisine boyun eğdiği, 7) Ey korkusundan dağların yarıldığı ve parçalandığı, 8) Ey emriyle göklerin ayakta durduğu, 9) Ey izniyle yerin karar kıldığı, 10) Ey memleketinin ahâlisine zulmetmeyen, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},7:{a:'يَا غَافِرَ الْخَطَايَا ● يَا كَاشِفَ الْبَلَايَا ● يَا مُنْتَهَى الرَّجَايَا ● يَا مُجْزِلَ الْعَطَايَا ● يَا وَاسِعَ الْهَدَايَا ● يَا رَازِقَ الْبَرَايَا ● يَا قَاضِىَ الْمُنَايَا ● يَا سَامِعَ الشَّكَايَا ● يَا بَاعِثَ السَّرَايَا ● يَا مُطْلِقَ اْلاُسَارٰى ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٧﴾',o:'1) Yâ Ğâfıra\'l-hatâyâ 2) Yâ Kâşife\'l-belâyâ 3) Yâ Muntehe\'r-racâyâ 4) Yâ Muczile\'l-\'atâyâ 5) Yâ Vâsi\'a\'l-hedâyâ 6) Yâ Râzika\'l-berâyâ 7) Yâ Kâdiya\'l-münâyâ 8) Yâ Sâmi\'a\'ş-şekâyâ 9) Yâ Bâ\'ise\'s-serâyâ 10) Yâ Mutlika\'l-üsârâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey hataları mağfiret eden, 2) Ey belaları kaldıran, 3) Ey ümitler kendisinde son bulan, 4) Ey ihsanı bol veren, 5) Ey hediyeleri geniş olan, 6) Ey mahlûkata rızık veren, 7) Ey ölümlere karar veren, 8) Ey şikâyetleri işiten, 9) Ey askerler gönderen, 10) Ey esirleri salıveren, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},8:{a:'يَا ذَا الْحَمْدِ وَ الثَّنَٓاءِ ● يَا ذَا الْمَجْدِ وَ السَّنَٓاءِ ● يَا ذَا الْفَخْرِ وَ الْبَهَٓاءِ ● يَا ذَا الْعَهْدِ وَ الْوَفَٓاءِ ● يَا ذَا الْعَفْوِ وَ الرِّضَٓاءِ ● يَا ذَا الْمَنِّ وَ الْعَطَٓاءِ ● يَا ذَا الْفَصْلِ وَ الْقَضَٓاءِ ● يَا ذَا الْعِزَّةِ وَ الْبَقَٓاءِ ● يَا ذَا الْجُودِ وَ النَّعْمَٓاءِ ● يَا ذَا الْفَضْلِ وَ اْلاٰلَٓاءِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٨﴾',o:'1) Yâ Ze\'l-hamdi ve\'s-senâ 2) Yâ Ze\'l-mecdi ve\'s-senâ 3) Yâ Ze\'l-fahri ve\'l-behâ 4) Yâ Ze\'l-\'ahdi ve\'l-vefâ 5) Yâ Ze\'l-\'afvi ve\'r-ridâ 6) Yâ Ze\'l-menni ve\'l-\'atâ 7) Yâ Ze\'l-fasli ve\'l-kadâ 8) Yâ Ze\'l-\'izzeti ve\'l-bekâ 9) Yâ Ze\'l-cûdi ve\'n-na\'mâ 10) Yâ Ze\'l-fadli ve\'l-\'âlâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey hamd ve senâ sahibi, 2) Ey şeref ve yücelik sahibi, 3) Ey fahir ve bahâ sahibi, 4) Ey ahd ve vefâ sahibi, 5) Ey af ve rızâ sahibi, 6) Ey iyilik ve bağış sahibi, 7) Ey kesin söz ve hüküm sahibi, 8) Ey izzet ve sonsuzluk sahibi, 9) Ey cömertlik ve nimetler sahibi, 10) Ey karşılıksız iyilik ve gizli nimetler sahibi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},9:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ ● يَا مَانِعُ ● يَا دَافِعُ ● يَا نَافِعُ ● يَا سَامِعُ ● يَا رَافِعُ ● يَا صَانِعُ ● يَا شَافِعُ ● يَا جَامِعُ ● يَا وَاسِعُ ● يَا مُوسِعُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩﴾',o:'1) Ve es\'elüke biesmâike 2) Yâ Mâni\' 3) Yâ Dâfi\' 4) Yâ Nâfi\' 5) Yâ Sami\' 6) Yâ Râfi\' 7) Yâ Sâni\' 8) Yâ Şâfi\' 9) Yâ Cami\' 10) Yâ Vâsi\' 11) Yâ Mûsi\' 12) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: 2) Ey olmamasını istediği şeyin meydana gelmesine engel olan Mâni\', 3) Ey zararlı şeyleri ve mânileri defeden Dâfi\', 4) Ey faydalı şeyleri yaratan Nâfi\', 5) Ey bütün sesleri işiten Sâmi\', 6) Ey dilediklerinin mertebesini yükselten Râfi\', 7) Ey her şeyi sanatla yaratan Sâni\', 8) Ey kullarına şefaat eden Şâfi\', 9) Ey istediğini istediği şekilde toplayan Câmi\', 10) Ey ilim ve ihsânı her şeyi içine alan Vâsi\', 11) Ey istediği şeyi istediği şekilde genişletip bollaştıran Mûsi\', 12) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},10:{a:'يَا صَانِعَ كُلِّ مَصْنُوعٍ ● يَا خَالِقَ كُلِّ مَخْلُوقٍ ● يَا رَازِقَ كُلِّ مَرْزُوقٍٍ ● يَا مَالِكَ كُلِّ مَمْلُوكٍ ● يَا كَاشِفَ كُلِّ مَكْرُوبٍ ● يَا فَارِجَ كُلِّ مَغْمُومٍ ● يَا رَاحِمَ كُلِّ مَرْحُومٍ ● يَا نَاصِرَ كُلِّ مَخْذُولٍ ● يَا سَاتِرَ كُلِّ مَعْيُوبٍ ● يَا مَلْجَاءَ كُلِّ مَظْلوُمٍ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١٠﴾',o:'1) Yâ Sâni\'a külli masnû\' 2) Yâ Halika külli mahlûk 3) Yâ Râzika külli merzûk 4) Yâ Mâlike külli memlûk 5) Yâ Kâşife külli mekrûb 6) Yâ Fârice külli mağmum 7) Yâ Râhime külli merhum 8) Yâ Nasıra külli mahzûl 9) Yâ Sâtira külli mâ\'yûb 10) Yâ Melcee külli mazlum 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey bütün sanatların sanatkârı, 2) Ey bütün mahlûkâtın yaratıcısı, 3) Ey bütün rızıklananların rızık vericisi, 4) Ey bütün sahip olunanların sahibi, 5) Ey bütün sıkıntıya düşenlerin ferahlatıcısı, 6) Ey bütün üzüntüye düşenlerin sevindiricisi, 7) Ey bütün merhamet olunanların merhamet edicisi, 8) Ey bütün yardımsız kalanların yardımcısı, 9) Ey bütün ayıplıların ayıplarını örten, 10) Ey bütün zulme uğrayanların sığınağı, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},11:{a:'يَا عُدَّتِى عِنْدَ شِدَّتِى ● يَا رَجَٓائِى عِنْدَ مُصِيبَتِى ● يَا مُونِسِى عِنْدَ وَحْشَتِى ● يَا صَاحِبِى عِنْدَ غُرْبَتِى ● يَا وَلِيِّى عِنْدَ نِعْمَتِى ● يَا كَاشِفِى عِنْدَ كُرْبَتِى ● يَا غِيَاثِى عِنْدَ افْتِقَار۪ى ● يَا مَلْجَائِى عِنْدَ اضْطِرَار۪ى ● يَا مُعِينِى عِنْدَ فَزَعِى ● يَا دَلِيلِى عِنْدَ حَيْرَتِى ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١١﴾',o:'1) Yâ \'Uddetî \'inde şiddeti 2) Yâ Recâî \'inde müsîbeti 3) Yâ Mûnisî \'inde vahşeti 4) Yâ Sâhibî \'inde gurbeti 5) Yâ Veliyyî \'inde ni\'metî 6) Yâ Kâşifi \'inde kürbetî 7) Yâ Ğıyâşî \'inde\'f-tikârî 8) Yâ Melceî \'inde\'d-dırârî 9) Yâ Mu\'înî \'inde feze\'î 10) Yâ Delîlî \'inde hayrati 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey sıkıntım ânında hazırlığım, 2) Ey musîbetim ânında ümidim, 3) Ey yalnızlığım ânında arkadaşım, 4) Ey gurbetliğimde dostum, 5) Ey nîmetlendiğim anda sahibim, 6) Ey kederim ânında ferahlatıcım, 7) Ey ihtiyacım ânında yardımıma koşan, 8) Ey zor durumumda sığınağım, 9) Ey korkum ânında yardımcım, 10) Ey şaşkınlığım ânında yol göstericim, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},12:{a:'يَا عَلَّا مَ الْغُيُوبِ ● يَا غَفَّارَ الذُّنُوبِ ● يَا سَتَّارَ الْعُيُوبِ ● يَا كَشَّافَ الْكُرُوبِ ● يَا مُقَلِّبَ الْقُلُوبِ ● يَا مُزَيِّنَ الْقُلُوبِ ● يَا مُنَوِّرَ الْقُلُوبِ ● يَا طَبِيبَ الْقُلُوبِ ● يَا حَبِيبَ الْقُلُوبِ ● يَٓا اَنِيسَ الْقُلُوبِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١٢﴾',o:'1) Yâ \'Allâme\'l-ğuyûb 2) Yâ Ğaffara\'z-zünûb 3) Yâ Settâra\'l-\'uyûb 4) Yâ Keşşâfe\'l-kürûb 5) Yâ Mukallibe\'l-kulûb 6) Yâ Muzeyyine\'l-kulûb 7) Yâ Munevvira\'l-kulûb 8) Yâ Tabîbe\'l-kulûb 9) Yâ Habîbe\'l-kulûb 10) Yâ Enîse\'l-kulûb 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey gaybları bilen, 2) Ey günahları bağışlayan, 3) Ey ayıpları örten, 4) Ey sıkıntıları kaldıran, 5) Ey kalpleri değiştiren, 6) Ey kalpleri süsleyen, 7) Ey kalpleri nurlandıran, 8) Ey kalplerin tabibi, 9) Ey kalplerin sevgilisi, 10) Ey kalplerin dostu, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},13:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا جَلِيلُ ● يَا جَمِيلُ ● يَا وَكِيلُ ● يَا كَفِيلُ ● يَا دَلِيلُ ● يَا مُقِيلُ ● يَا خَبِيرُ ● يَا لَطِيفُ ● يَا عَزِيزُ ● يَا مَلِيكُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١٣﴾',o:'1) Ve es\'elüke biesmâike Yâ Celîl 2) Yâ Cemîl 3) Yâ Vekîl 4) Yâ Kefîl 5) Yâ Delîl 6) Yâ Mukîl 7) Yâ Habîr 8) Yâ Latîf 9) Yâ Azîz 10) Yâ Melik 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey yücelik ve ululuk sahibi Celîl, 2) Ey gerçek güzellik sahibi Cemîl, 3) Ey kendine güvenen kullarının işini en iyi yoluna koyan Vekîl, 4) Ey kullarının tâkatini aşan işlerini üzerine alan Kefîl, 5) Ey kullarına yol gösteren Delîl, 6) Ey kullarının hatâ ve yanlışlarını bağışlayan Mukîl, 7) Ey her şeyden haberdar olan Habîr, 8) Ey lütuf ve keremi bol olan Latîf, 9) Ey sonsuz izzet sahibi Azîz, 10) Ey bütün mevcudâtın gerçek sahibi ve hükümdarı olan Melik, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},14:{a:'يَا دَلِيلَ الْمُتَحَيِّرِينَ ● يَا غِيَاثَ الْمُسْتَغِيثِينَ ● يَا صَرِيخَ الْمُسْتَصْرِخِينَ ● يَا جَارَ الْمُسْتَجِيرِينَ ● يَا مَلْجَأَ الْعَاصِينَ ● يَا غَافِرَ الْمُذْنِبِينَ ● يَٓا اَمَانَ الْخَٓائِفِينَ ● يَا رَاحِمَ الْمَسَاكِينَ ● يَٓا اَنِيسَ الْمُسْتَوْحِشِينَ ● يَا مُجِيبَ دَعْوَةِ الْمُضْطَرِّينَ ● سُبْحَانَكَ لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١٤﴾',o:'1) Yâ Delîle\'l-mütehayyirîn 2) Yâ Gıyâse\'l-müsteğîsîn 3) Yâ Sarîha\'l-müstesrihîn 4) Yâ Câra\'l-müstecîrîn 5) Yâ Melcee\'l-\'âsîn 6) Yâ Ğâfıra\'l-müznibîn 7) Yâ Emâne\'l-hâifîn 8) Yâ Râhime\'l-mesâkîn 9) Yâ Enîse\'l-müstevhişîn 10) Yâ Mucîbe da\'veti\'l-müdtarrîn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey şaşkınların yol göstericisi, 2) Ey yardım isteyenlerin yardımcısı, 3) Ey medet isteyenlerin imdat edicisi, 4) Ey korunmak isteyenlerin koruyucusu, 5) Ey âsilerin sığınağı, 6) Ey günahkârların bağışlayıcısı, 7) Ey korkanlara emniyet veren, 8) Ey miskinlere merhamet eden, 9) Ey yalnızlık duyanların dostu, 10) Ey darda kalanların duâlarına cevap veren, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},15:{a:'يَا ذَا الْجُودِ وَ اْلاِحْسَانِ ● يَا ذَا الْفَضْلِ وَ اْلاِمْتِنَانِ ● يَا ذَا الْاَمْنِ وَ الْاَمَانِ ● يَا ذَا الْقُدْسِ وَ السُّبْحَانِ ● يَا ذَا الْحِكْمَةِ وَ الْبَيَانِ ● يَا ذَا الرَّحْمَةِ وَ الرِّضْوَانِ ● يَا ذَا الْحُجَّةِ وَ الْبُرْهَانِ ● يَا ذَا الْعَظَمَةِ وَ السُّلْطَانِ ● يَا ذَا الْعَفْوِ وَ الْغُفْرَانِ ● يَا ذَا الرَّأْفَةِ وَ الْمُسْتَعَانِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١٥﴾',o:'1) Yâ Ze\'l-cûdi ve\'l-ihsân 2) Yâ Ze\'l-fadli ve\'l-imtinân 3) Yâ Ze\'l-emni ve\'l-emân 4) Yâ Ze\'l-kudsi ve\'s-sübhân 5) Yâ Ze\'l-hikmeti ve\'l-beyân 6) Yâ Ze\'r-rahmeti ve\'r-rıdvân 7) Yâ Ze\'l-hucceti ve\'l-bürhân 8) Yâ Ze\'l-\'azameti ve\'s-sultân 9) Yâ Ze\'l-\'afvi ve\'l-ğufrân 10) Yâ Ze\'r-ra\'feti ve\'l-müste\'ân 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey cömertlik ve ihsan sahibi, 2) Ey fazıl ve iyilik sahibi, 3) Ey emniyet ve emân sahibi, 4) Ey kudsiyet ve kemalât sahibi, 5) Ey hikmet ve beyan sahibi, 6) Ey rahmet ve rıdvan sahibi, 7) Ey kesin delil ve bürhan sahibi, 8) Ey azamet ve saltanat sahibi, 9) Ey af ve mağfiret sahibi, 10) Ey kendisinden yardım istenen şefkat sahibi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},16:{a:'يَا مَنْ هُوَ رَبُّ كُلِّ شَىْءٍ ● يَا مَنْ هُوَ اِلٰهُ كُلِّ شَىْءٍ ● يَا مَنْ هُوَ خَالِقُ كُلِّ شَىْءٍ ● يَا مَنْ هُوَ فَوْقَ كُلِّ شَىْءٍ ● يَا مَنْ هُوَ قَبْلَ كُلِّ شَىْءٍ ● يَا مَنْ هُوَ بَعْدَ كُلِّ شَىْءٍ ● يَا مَنْ هُوَ عَالِمُ كُلِّ شَىْءٍ ● يَا مَنْ هُوَ قَادِرُ كُلِّ شَىْءٍ ● يَا مَنْ هُوَ صَانِعُ كُلِّ شَىْءٍ ● يَا مَنْ هُوَ يَبْقٰى وَ يَفْنٰى كُلُّ شَىْءٍ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١٦﴾',o:'1) Yâ Men hüve Rabbü külli şey\' 2) Yâ Men hüve ilâhü külli şey\' 3) Yâ Men hüve Hâliku külli şey\' 4) Yâ Men hüve fevka külli şey\' 5) Yâ Men hüve kable külli şey\' 6) Yâ Men hüve ba\'de külli şey\' 7) Yâ Men hüve \'Alimü külli şey\' 8) Yâ Men hüve Kâdiru külli şey\' 9) Yâ Men hüve Sâni\'u külli şey\' 10) Yâ Men hüve yebkâ veyefnâ küllü şey\' 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey her şeyin Rabbi, 2) Ey her şeyin ilâhı, 3) Ey her şeyin yaratıcısı, 4) Ey her şeyin üzerinde olan, 5) Ey her şeyden önce olan, 6) Ey fani olan her şey ve biten her zamandan sonra vücudu daim ve baki kalan, 7) Ey her şeyi bilen, 8) Ey her şeye gücü yeten, 9) Ey her şeyin Sâni\'i, 10) Ey her şey fenâ bulup, Kendisi bâki kalan 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},17:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا مُؤْمِنُ ● يَا مُهَيْمِنُ ● يَا مُكَوِّنُ ● يَا مُلَقِّنُ ● يَا مُبَيِّنُ ● يَا مُهَوِّنُ ● يَا مُزَيِّنُ ● يَا مُعَظِّمُ ● يَا مُعَوِّنُ ● يَا مُلَوِّنُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١٧﴾',o:'1) Ve es\'elüke biesmâike Yâ Mu\'min 2) Yâ Muheymin 3) Yâ Mukevvin 4) Yâ Mulakkin 5) Yâ Mubeyyin 6) Yâ Muhevvin 7) Yâ Muzeyyin 8) Yâ Muazzîm 9) Yâ Muavvin 10) Yâ Mulevvin 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey kalplerde îman nûrunu yakan ve kullarına huzur ve güven veren Mü\'min, 2) Ey bütün varlıkları ilim ve kontrolü altında tutan Müheymin, 3) Ey bütün mahlûkatı yoktan meydana getiren Mükevvin, 4) Ey bütün yaratıklarına dünyadaki vazifelerini öğretip telkin eden Mülakkin, 5) Ey kulları için açıklanması gereken her şeyi beyan eden Mübeyyin, 6) Ey musîbetleri hafifleten ve zorlukları kolaylaştıran Mühevvin, 7) Ey her şeyi münasip şekilde süsleyen Müzeyyin, 8) Ey dilediğini yücelten ve kullarına büyüklüğünü gösteren Muazzım, 9) Ey muhtaçların yardımına koşan Muavvin, 10) Ey her şeyi çeşit çeşit renklerle bezeyen Mülevvin, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},18:{a:'يَا مَنْ هُوَ فِى مُلْكِهِ مُقِيمٌ ● يَا مَنْ هُوَ فِى جَلَالِهِ عَظِيمٌ ● يَا مَنْ هُوَ فِى سُلْطَانِهِ قَدِيمٌ ● يَا مَنْ هُوَ عَلٰى عَبْدِهِ رَحِيمٌ ● يَا مَنْ هُوَ بِكُلِّ شَىْءٍ عَلِيمٌ ● يَا مَنْ هُوَ لِمَنْ جَفَاهُ حَلِيمٌ ● يَا مَنْ هُوَ لِمَنْ تَرَجَّاهُ كَرِيمٌ ● يَا مَنْ هُوَ فِى مَقَادِيرِهِ حَكِيمٌ ● يَا مَنْ هُوَ فِى حُكْمِهِ لَطِيفٌ ● يَا مَنْ هُوَ فِى لُطْفِهِ قَدِيرٌ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١٨﴾',o:'1) Yâ men hüve fî mülkihî mükîm 2) Yâ men hüve fî celâlihî \'azîm 3) Yâ men hüve fî sültânihî kadîm 4) Yâ men hüve \'alâ \'abdihî rahîm 5) Yâ men hüve bikülli şey\'in \'alîm 6) Yâ men hüve limen cefâhu halîm 7) Yâ men hüve limen teraccâhü kerîm 8) Yâ men hüve fî mekâdîrihî hakim 9) Yâ men hüve fi hükmihî latîf 10) Yâ men hüve fı lütfihî kadîr 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey mülkünde dâim olan, 2) Ey celâlinde azîm olan, 3) Ey saltanatında kadîm olan, 4) Ey kullarına rahmet eden, 5) Ey her şeyi bilen, 6) Ey emirlerine uymayana halîm olan, 7) Ey kendisine ümit bağlayana kerîm olan, 8) Ey ölçülerinde hikmetli olan, 9) Ey hükmünde lütuf sahibi olan, 10) Ey lütfünde kadîr olan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},19:{a:'يَا مَنْ لَا يُرْجىٰٓ اِلَّا فَضْلُهُ ● يَا مَنْ لَا يُخَافُ اِلَّا عَدْلُهُ ● يَا مَنْ لَا يُنْتَظَرُ اِلَّا بِرُّهُ ● يَا مَنْ لَا يُسْئَلُ اِلَّا عَفْوُهُ ● يَا مَنْ لَا يَدُومُ اِلَّا مُلْكُهُ ● يَا مَنْ لَا سُلْطَانَ اِلَّا سُلْطَانُهُ ● يَا مَنْ لَا بُرْهَانَ اِلَّا بُرْهَانُهُ ● يَا مَنْ وَسِعَتْ كُلَّ شَىْءٍ رَحْمَتُهُ ● يَا مَنْ سَبَقَتْ رَحْمَتُهُ عَلٰى غَضَبِهِ ● يَا مَنْ اَحَاطَ بِكُلِّ شَىْءٍ عِلْمُهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١٩﴾',o:'1) Yâ men la yürcâ illâ fadlüh 2) Yâ men lâ yuhâfü illâ \'adlüh 3) Yâ men lâ yuntezaru illa birruh 4) Yâ men lâ yus\'elü illâ \'afvüh 5) Yâ men lâ yedûmü illâ mülküh 6) Yâ men lâ sültâne illâ sültânüh 7) Yâ men lâ bürhâne illâ bürhânüh 8) Yâ men vesiat külle şey\'in rahmetüh 9) Yâ men sebekat rahmetühû \'alâ ğadabih 10) Yâ men ehâta bi külli şey\'in \'ilmüh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey fazlından başka bir şey ümit edilmeyen, 2) Ey adâletinden başka bir şeyden korkulmayan, 3) Ey iyiliğinden başka bir şey beklenmeyen, 4) Ey affından başka bir şey istenmeyen, 5) Ey mülkünden başkası devam etmeyen 6) Ey saltanatından başka saltanat bulunmayan, 7) Ey burhanlarından başka burhan bulunmayan, 8) Ey rahmeti her şeyi kuşatmış olan, 9) Ey rahmeti gazabını geçmiş olan, 10) Ey ilmiyle her şeyi kuşatmış olan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},20:{a:'يَا فَارِجَ الْهَمِّ ● يَا كَاشِفَ الْغَمِّ ● يَا غَافِرَ الذَّنْبِ ● يَا قَابِلَ التَّوْبِ ● يَاخَالِقَ الْخَلْقِ ● يَا صَادِقَ الْوَعْدِ ● يَا رَازِقَ الطِّفْلِ ● يَا مُوفِىَ الْعَهْدِ ● يَا عَالِمَ السِّرِّ ● يَا فَالِقَ الْحَبِّ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢٠﴾',o:'1) Yâ Fârice\'l-hemm 2) Yâ Kâşife\'l-ğamm 3) Yâ Gâfire\'z-zenb 4) Yâ Kâbile\'t-tevb 5) Yâ Hâlika\'l-halk 6) Yâ Sâdika\'l-va\'d 7) Yâ Râzika\'t-tıfl 8) Yâ Mûfiye\'l-\'ahd 9) Yâ \'Alime\'s-sirr 10) Yâ Fâlika\'l-habb 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey tasayı kaldıran, 2) Ey gamı gideren, 3) Ey günahı affeden, 4) Ey tövbeyi kabul eden, 5) Ey yaratılmışların yaratıcısı, 6) Ey vaadinde sâdık olan, 7) Ey yavrulara rızık veren, 8) Ey sözünü yerine getiren, 9) Ey gizliyi bilen, 10) Ey tohumu yarıp sümbüllendiren, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},21:{a:'فَاَسْئَلُكَ بِاَسْمآَئِكَ يَا عَلِىُّ ● يَا وَفِىُّ ● يَا وَلِىُّ ● يَا غَنِىُّ ● يَا مَلِىُّ ● يَا زَكِىُّ ● يَا رَضِىُّ ● يَا بَدِىُّ ● يَا خَفِىُّ ● يَا قَوِىُّ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢١﴾',o:'1) Ve es\'elüke biesmâike yâ \'alî 2) Yâ Vefî 3) Yâ Velî 4) Yâ Ganî 5) Yâ Melîyy 6) Yâ Zekiyy 7) Yâ Radiyy 8) Yâ Bediyy 9) Yâ HafIyy 10) Yâ Kaviyy 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey her şeyiyle yüce olan Alî, 2) Ey sözünden vefâlı olan ve vaadinden dönmeyen Vefî, 3) Ey müminlerin dostu olan Velî, 4) Ey gerçek zenginlik sahibi ve hiçbir şeye muhtaç olmayan Ganî, 5) Ey sonsuz servet ve tükenmez hazineler sahibi Melî, 6) Ey her cihetten temiz ve pâk olan Zekî, 7) Ey kendisine kulluk edenlerden hoşnut olan Razî, 8) Ey eser ve ihsanlarıyla varlığı apaçık görünen Bedî, 9) Ey şiddet-i zuhûrundan gizlenen Hafî, 10) Ey güç ve kuvveti sonsuz olan Kavî, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},22:{a:'يَا مَنْ اَظْهَرَ الْجَمِيلَ ● يَا مَنْ سَتَرَ عَلَى الْقَبِيحِ ● يَا مَنْ لَا يُؤَاخِذُ بِالْجَرِيمَةِ ● يَا مَنْ لَا يَهْتِكُ السِّتْرَ ● يَا عَظِيمَ الْعَفْوِ ● يَا حَسَنَ التَّجَاوُزِ ● يَا وَاسِعَ الْمَغْفِرَةِ ● يَا بَاسِطَ الْيَدَيْنِ بِالرَّحْمَةِ ● يَا صَاحِبَ كُلِّ نَجْوٰى ● يَا مُنْتَهٰى كُلِّ شَكْوٰى ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢٢﴾',o:'1) Yâ Men azhera\'l-cemîl 2) Yâ Men setera \'ale\'l-kabîh 3) Yâ Men lâ yuâhizü bi\'l-cerîmeh 4) Yâ Men lâ yehtikü\'s-sitr 5) Yâ \'Azîme\'l-\'afv 6) Yâ Hasene\'t-tecâvüz 7) Yâ Vâsi\'a\'l-mağfireh 8) Yâ Bâsita\'l-yedeyni bi\'r-rahmeh 9) Yâ Sahibe külli necvâ 10) Yâ Muntehâ külli şekva 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey güzeli açığa çıkaran, 2) Ey çirkinin üzerini örten, 3) Ey suç sebebiyle hemen azarlamayan, 4) Ey ayıpların üzerindeki perdeyi yırtmayan, 5) Ey affı büyük olan, 6) Ey günahkârları cezalandırmaktan vazgeçmesi güzel olan, 7) Ey mağfireti geniş olan, 8) Ey rahmeti bol veren, 9) Ey bütün sessiz yalvarışların sahibi, 10) Ey bütün şikâyetler kendisinde son bulan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},23:{a:'يَا ذَا النِّعْمَةِ السَّابِغَةِ ● يَا ذَا الرَّحْمَةِ الْوَاسِعَةِ ● يَا ذَا الْحِكْمَةِ الْبَالِغَةِ ● يَا ذَا الْقُدْرَةِ الْكَامِلَةِ ● يَا ذَا الْحُجَّةِ الْقَاطِعَةِ ● يَا ذَا الْكَرَامَةِ الظَّاهِرَةِ ● يَا ذَا الصِّفَةِ الْعَالِيَةِ ● يَا ذَا الْعِزَّةِ الدَّٓائِمَةِ ● يَا ذَا الْقُوَّةِ الْمَتِينَةِ ● يَا ذَا الْمِنَّةِ السَّابِقَةِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢٣﴾',o:'1) Yâ Ze\'n-ni\'meti\'s-sâbiğah 2) Yâ Ze\'r-rahmeti\'l-vâsi\'ah 3) Yâ Ze\'l-hikmeti\'l-bâliğah 4) Yâ Ze\'l-kudreti\'l-kâmileh 5) Yâ Ze\'l-hucceti\'l-kâtı\'ah 6) Yâ Ze\'l-kerâmeti\'z-zâhirah 7) YâZe\'s-sıfati\'l-\'âliyeh 8) YâZe\'l-\'izzeti\'d-dâimeh 9) Yâ Ze\'l-kuvveti\'l-metîneh 10) Yâ Ze\'l-minneti\'s-sâbikah 11) Sübhâneke yâ lâ ilahe illâ entei-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey bol nimet sahibi, 2) Ey geniş rahmet sahibi, 3) Ey tam hikmet sahibi, 4) Ey kâmil kudret sahibi, 5) Ey kesin hüccet sahibi, 6) Ey açık ikram sahibi, 7) Ey yüce sıfat sahibi, 8) Ey dâim izzet sahibi, 9) Ey metin kuvvet sahibi, 10) Ey geçmiş minnet sahibi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},24:{a:'يَٓا اَحْكَمَ الْحَاكِمِينَ ● يَٓا اَعْدَلَ الْعَادِلِينَ ● يَٓا اَصْدَقَ الصَّادِقِينَ ● يَٓا اَظْهَرَ الظَّاهِرِينَ ● يَٓا اَطْهَرَ الطَّاهِرِينَ ● يَٓا اَحْسَنَ الْخَالِقِينَ ● يَٓا اَسْرَعَ الْحَاسِبِينَ ● يَٓا اَسْمَعَ السَّامِعِينَ ● يَٓا اَكْرَمَ الْاَكْرَمِينَ ● يَٓا اَرْحَمَ الرَّاحِمِينَ ● يَٓا اَشْفَعَ الشَّافِعِينَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢٤﴾',o:'1) Yâ Ahkeme\'l-hâkimîn 2) Yâ \'Adele\'l-\'âdilîn 3) Yâ Asdeka\'s-sâdikîn 4) Yâ Azhera\'z-zâhirîn 5) Yâ Athera\'t-tâhirîn 6) Yâ Ahsene\'l-hâlikîn 7) Yâ Esra\'a\'s-hâsibîn 8) Yâ Esme\'a\'s-sâmi\'în 9) Yâ Ekrame\'l-ekramîn 10) Yâ Erhame\'r-râhimîn 11) Yâ Eşfe\'a\'ş-şâfi\'în 12) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey hükmedenlerin en hükmedicisi, 2) Ey âdillerin en adâletlisi, 3) Ey doğruların en doğrusu, 4) Ey varlığı açık olanların en açığı, 5) Ey temiz olanların en temizi, 6) Ey yaratıcılık mertebelerinin en güzelinde olan, 7) Ey hesaba çekenlerin en süratlisi, 8) Ey işitenlerin en iyi işiticisi, 9) Ey ikram edenlerin en iyi ikram edicisi, 10) Ey merhamet edenlerin en merhametlisi, 11) Ey şefaat edenlerin en şefaat edicisi, 12) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},25:{a:'يَا بَدِيعَ السَّمٰوَاتِ ● يَا جَاعِلَ الظُّلُمَاتِ ● يَا عَالِمَ الْخَفِيَّاتِ ● يَا رَاحِمَ الْعَبَرَاتِ ● يَا سَاتِرَ الْعَوَرَاتِ ● يَا كَاشِفَ الْبَلِيَّاتِ ● يَا مُحْيِىَ الْاَمْوَاتِ ● يَا ضَاعِفَ الْحَسَنَاتِ ● يَا مُنْزِلَ الْبَرَكَاتِ ● يَا شَدِيدَ النَّقَمَاتِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢٥﴾',o:'1) Yâ Bedi\'a\'s-semâvât 2) Yâ Câ\'ile\'z-zulümât 3) Yâ \'A\'lime\'l-hafıyyât 4) Yâ Râhîme\'l-\'aberât 5) Yâ Sâtira\'l-\'averât 6) Yâ Kâşife\'l-beliyyât 7) Yâ Muhyiye\'l-emvât 8) Yâ Dâ\'ife\'l-hasenât 9) Yâ Munzile\'l-berakât 10) Yâ Şedîde\'n-nekamât 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey semâları yoktan yaratan, 2) Ey karanlıkları meydana getiren, 3) Ey gizlilikleri bilen, 4) Ey için için üzülenlere acıyan, 5) Ey utanılacak şeyleri örten, 6) Ey belâları defeden, 7) Ey ölüleri dirilten, 8) Ey sevapları kat kat yazan, 9) Ey bereketleri indiren, 10) Ey asilere hak ettikleri büyük ceza ve şiddetli azabı veren, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},26:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا مُصَوِّرُ ● يَا مُقَدِّرُ ● يَا مُطَهِّرُ ● يَا مُنَوِّرُ ● يَا مُقَدِّمُ ● يَا مُؤَخِّرُ ● يَا مُيَسِّرُ ● يَا مُنْذِرُ ● يَا مُبَشِّرُ ● يَا مُدَبِّرُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢٦﴾',o:'1) Ve es\'elüke biesmâike, yâ Musavvir 2) Yâ Mukaddir 3) Yâ Mutahhir 4) Yâ Munevvir 5) Yâ Mukaddim 6) Yâ Muahhir 7) Yâ Muyessir 8) Yâ Munzir 9) Yâ Mubeşşir 10) Yâ Mudebbir 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey her varlığa münasip şekil giydiren Musavvir, 2) Ey her şeyin plan ve programını ölçülü yapan Mukaddir, 3) Ey her şeyi maddi ve manevi kirlerden temizleyen Mutahhir, 4) Ey nûruyla her şeyi nurlandıran Münevvir, 5) Ey dilediğini öne geçiren Mukaddim, 6) Ey istediğini arkaya bırakan Muahhir, 7) Ey hayırlı işleri kolaylaştıran Müyessir, 8) Ey kullarını azâbıyla korkutan Münzir, 9) Ey kullarını Cennet ve diğer mükafatlarla müjdeleyen Mübeşşir, 10) Ey bütün kâinatı tam bir nizam içinde idare eden Müdebbir, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},27:{a:'يَا رَبَّ الْبَيْتِ الْحَرَامِ ● يَا رَبَّ الشَّهْرِ الْحَرَامِ ● يَا رَبَّ الْمَسْجِدِ الْحَرَامِ ● يَا رَبَّ الْبَلَدِ الْحَرَامِ ● يَا رَبَّ الرُّكْنِ وَ الْمَقَامِ ● يَا رَبَّ الْمَشْعَرِ الْحَرَامِ ● يَا رَبَّ الْحِلِّ وَ الْحَرَامِ ● يَا رَبَّ النُّورِ وَ الظَّلَامِ ● يَا رَبَّ التَّحِيَّةِ وَ السَّلَامِ ● يَا رَبَّ الْجَلَالِ وَ اْلاِكْرَامِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢٧﴾',o:'1) Yâ Rabbe\'l-beyti\'l-harâm 2) Yâ Rabbe\'ş-şehri\'l-harâm 3) Yâ Rabbe\'l-mescidi\'l-harâm 4) Yâ Rabbe\'l-beledi\'l-harâm 5) Yâ Rabbe\'r-rukni ve\'l-mekâm 6) Yâ Rabbe\'l-meş\'ari\'l-harâm 7) Yâ Rabbe\'l-hılli ve\'l-haram 8) Yâ Rabbe\'n-nûri.ve\'z-zalâm 9) Yâ Rabbe\'t-tahiyyeti ve\'s-selâm 10) Yâ Rabbe\'l-celâli ve\'l-ikrâm 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey Beytül Haramın Rabbi 2) Ey haram ayların sahibi, 3) Ey Mescidül Haramın Rabbi, 4) Ey haram belde olan Mekke\'nin Rabbi, 5) Ey Rükn-ü Hacerül-Esved ve Makam-ı İbrahim\'in Rabbi, 6) Ey Meş\'aril-Haramın Rabbi, 7) Ey helâl ve haramın Rabbi, 8) Ey nur ve karanlığın Rabbi, 9) Ey tahiyyât ve selâmın Rabbi, 10) Ey celâl ve ikrâmın Rabbi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},28:{a:'يَا عِمَادَ مَنْ لَا عِمَادَ لَهُ ● يَا سَنَدَ مَنْ لَا سَنَدَ لَهُ ● يَا زُخْرَ مَنْ لَا زُخْرَ لَهُ ● يَا غِيَاثَ مَنْ لَا غِيَاثَ لَهُ ● يَا حِرْزَ مَنْ لَا حِرْزَ لَهُ ● يَا فَخْرَ مَنْ لَا فَخْرَ لَهُ ● يَا عِزَّ مَنْ لَا عِزَّ لَهُ ● يَا مُعِينَ مَنْ لَا مُعِينَ لَهُ ● يَٓا اَنِيسَ مَنْ لَٓا اَنِيسَ لَهُ ● يَا غُنْيَةَ مَنْ لَا غُنْيَةَ لَهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢٨﴾',o:'1) Yâ \'İmâde men lâ \'imâde leh 2) Yâ Senede men lâ senede leh 3) Yâ Zühra men lâ zühra leh 4) Yâ Giyâşe men lâ ğiyâşe leh 5) Yâ Hırze men lâ hırze leh 6) Yâ Fahra men lâ fahra leh 7) Yâ \'İzze men lâ \'izze leh 8) Yâ Mu\'îne men lâ mu\'îne leh 9) Yâ Enîse men lâ enîse leh 10) Yâ Gunyete men lâ gunyete leh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey desteği olmayanların desteği, 2) Ey dayanağı olmayanların dayanağı, 3) Ey övünülecek bir şeyi olmayanların övüncü, 4) Ey imdâda koşacak kimsesi olmayanların imdâdı, 5) Ey korunacak yeri olmayanların koruyucusu, 6) Ey iftihar edecek kimsesi olmayanların iftihârı, 7) Ey izzeti olmayanların izzeti, 8) Ey yardımcısı olmayanların yardımcısı, 9) Ey dostu olmayanların dostu, 10) Ey zenginliği olmayanların zenginliği, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},29:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا قَٓائِمُ ● يَا دَٓائِمُ ● يَا رَاحِمُ ● يَا حَاكِمُ ● يَا عَالِمُ ● يَا عَاصِمُ ● يَا قَاسِمُ ● يَا سَالِمُ ● يَا قَابِضُ ● يَا بَاسِطُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٢٩﴾',o:'1) Ve es\'elüke biesmâike Yâ Kâim 2) Yâ Dâim 3) Yâ Rahim 4) Yâ Hâkim 5) Yâ \'Âlim 6) Yâ \'Âsim 7) Yâ Kâsim 8) Yâ Salim 9) Yâ Kâbid 10) Yâ Basit 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey varlığında başkasına muhtaç olmayan Kâim, 2) Ey varlığının sonu olmayan Dâim, 3) Ey mahlûkatına merhamet eden Râhim, 4) Ey mevcudatına hükmeden Hâkim, 5) Ey her şeyi bilen Âlim, 6) Ey yarattıklarını koruyan Âsım, 7) Ey her şeyi adâletle taksim eden Kâsım, 8) Ey ayıp ve kusur kendisine ârız olmayan Sâlim, 9) Ey istediğinin maddî ve mânevî rızkını daraltan Kâbıd, 10) Ey istediğinin maddî ve mânevî rızkını genişleten Bâsıt, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},30:{a:'يَا عَاصِمَ مَنِ اسْتَعْصَمَهُ ● يَا رَاحِمَ مَنِ اسْتَرْحَمَهُ ● يَا نَاصِرَ مَنِ اسْتَنْصَرَهُ ● يَا حَافِظَ مَنِ اسْتَحْفَظَهُ ● يَا مُكْرِمَ مَنِ اسْتَكْرَمَهُ ● يَا مُرْشِدَ مَنِ اسْتَرْشَدَهُ ● يَا مُعِينَ مَنِ اسْتَعَانَهُ ● يَا مُغِيثَ مَنِ اسْتَغَاثَهُ ● يَا صَرِيخَ مَنِ اسْتَصْرَخَهُ ● يَا غَافِرَ مَنِ اسْتَغْفَرَهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٣٠﴾',o:'1) Yâ \'Âsıme-meni\'sta\'sameh 2) Yâ Râhime meni\'sterhameh 3) Yâ Nasıra meni\'stensarah 4) Yâ Hafıza meni\'stahfezah 5) Yâ Mukrime meni\'stekrameh 6) Yâ Murşide meni\'sterşedeh 7) Yâ Mu\'îne meni\'ste\'âneh 8) Yâ Muğîse meni\'steğâseh 9) Yâ Sarîha meni\'stesrahah 10) Yâ Ğâfıra meni\'stağferah 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'rı-nâr.',m:'1) Ey kendisine sığınmak isteyenleri koruyan, 2) Ey kendisinden merhamet isteyenlere merhamet eden, 3) Ey kendisinden yardım isteyenlere yardım eden, 4) Ey korunmak isteyenleri muhafaza eden, 5) Ey kendisinden ikram isteyenlere ikram eden, 6) Ey kendisinden irşad edilmeyi isteyenleri irşad eden, 7) Ey kendisinden inâyet isteyenlere inâyet eden, 8) Ey kendisinden imdat isteyenlere imdat eden, 9) Ey feryat edenlerin feryâdına koşan, 10) Ey kendisinden mağfiret isteyenleri bağışlayan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},31:{a:'يَا كَرِيمَ الصَّفْحِ ● يَا عَظِيمَ الْمَنِّ ● يَا كَثِيرَ الْخَيْرِ ● يَا قَدِيمَ الْفَضْلِ ● يَا لَطِيفَ الصُّنْعِ ● يَا دَٓائِمَ اللُّطْفِ ● يَا نَافِسَ الْكَرْبِ ● يَا كَاشِفَ الضُّرِّ ● يَا مَالِكَ الْمُلْكِ ● يَا قَاضِيًا بِالْحَقِّ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٣١﴾',o:'1) Yâ Kerîme\'s-saftı 2) Yâ \'Azîme\'l-menn 3) Yâ Keşîra\'l-hayr 4) Yâ Kadîme\'l-fadl 5) Yâ Latîfe\'s-sun\' 6) Yâ Dâime\'l-lütf 7) Yâ Nâfise\'l-kerb 8) Yâ Kâşife\'d-durr 9) Yâ Mâlike\'l-mülk 10) Yâ Kâdiyen bi\'l-hakk 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey affı bol olan, 2) Ey iyiliği büyük olan, 3) Ey hayrı çok olan, 4) Ey fazlı kadîm olan, 5) Ey sanatı güzel olan, 6) Ey lütfü dâim olan, 7) Ey sıkıntıyı gideren, 8) Ey zararı kaldıran, 9) Ey mülkün sahibi, 10) Ey hak ile hükmeden, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},32:{a:'يَا عَزِيزًا لَا يُضَامُ ● يَا لَطِيفًا لَا يُرَامُ ● يَا رَقِيبًا لَا يَنَامُ ● يَا قَٓائِمًا لَا يَفُوتُ ● يَا حَيًّا لَا يَمُوتُ ● يَا مَلِكًا لَا يَزُولُ ● يَا بَاقِيًا لَا يَفْنٰى ● يَا عَالِمًا لَا يَجْهَلُ ● يَا صَمَدًا لَا يُطْعَمُ ● يَا قَوِيًّا لَا يُضْعَفُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٣٢﴾',o:'1) Yâ \'Azîzen lâ yudâm 2) Yâ Latîfen lâ yurâm 3) Yâ Rakîben lâ yenâm 4) Yâ Kaimen lâ yefût 5) Yâ Hayyen lâ yemût 6) Yâ Meliken lâyezûl 7) Yâ Bakiyen lâ yefnâ 8) Yâ \'Alimen lâ yechel 9) Yâ Sameden lâ yut\'âm 10) Yâ Kaviyyen lâ yud\'af 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey mağlup edilmeyen Azîz, 2) Ey kendisinden uzaklaşılmayan Lâtîf, 3) Ey uyumayan gözetleyici, 4) Ey yok olmayan Mevcûd, 5) Ey ölmeyen Hayy, 6) Ey yok olmayan Melik, 7) Ey fenâ bulmayan Bâkî, 8) Ey cehalet ârız olmayan Âlim, 9) Ey taama muhtaç olmayan Samed, 10) Ey zaafa uğratılmayan Kavî, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},33:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا وَاحِدُ ● يَا وَاجِدُ ● يَا شَاهِدُ ● يَا مَاجِدُ ● يَا رَاشِدُ ● يَا بَاعِثُ ● يَا وَارِثُ ● يَا ضَٓارُّ ● يَا نَافِعُ ● يَا هَادِى ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٣٣﴾',o:'1) Ve es\'elüke biesmâike Yâ Vâhid 2) Yâ Vâcid 3) Yâ Şâhid 4) Yâ Mâcid 5) Yâ Râşid 6) Yâ Bâis 7) Yâ Vâris 8) Yâ Dârr 9) Yâ Nâfi\' 10) Yâ Hâdî 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey isimlerinde, sıfatlarında ve fiillerinde ortağı olmayan Vâhid, 2) Ey istediğini bulan Vâcid, 3) Ey her yerde hâzır ve nâzır olan Şâhid, 4) Ey sonsuz şan ve yücelik sahibi Mâcid, 5) Ey bütün işlerini ezelî hikmetine göre neticeye ulaştıran Râşid, 6) Ey peygamberler gönderen ve ölüleri dirilten Bâis, 7) Ey her şeyin hakiki ilk ve son sahibi olan, mülk yalnız ona kalan Vâris, 8) Ey hikmeti gereği elem ve zarar verici şeyleri yaratan Dârr, 9) Ey hayır ve menfaatli şeyleri yaratan Nâfi, 10) Ey kullarına hidayet veren Hâdi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},34:{a:'يَٓا اَعْظَمُ مِنْ كُلِّ عَظِيمٍ ● يَٓا اَكْرَمُ مِنْ كُلِّ كَرِيمٍ ● يَٓا اَرْحَمُ مِنْ كُلِّ رَحِيمٍ ● يَٓا اَحْكَمُ مِنْ كُلِّ حَكِيمٍ ● يَٓا اَعْلَمُ مِنْ كُلِّ عَلِيمٍ ● يَٓا اَقْدَمُ مِنْ كُلِّ قَدِيمٍ ● يَٓا اَكْبَرُ مِنْ كُلِّ كَبِيرٍ ● يَٓا اَجَلُّ مِنْ كُلِّ جَلِيلٍ ● يَٓا اَعَزُّ مِنْ كُلِّ عَزِيزٍ ● يَٓا اَلْطَفُ مِنْ كُلِّ لَطِيفٍ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٣٤﴾',o:'1) Yâ A\'zamü min külli \'azîm 2) Yâ Ekramü min külli kerîm 3) Yâ Erhamü min külli rahîm 4) Yâ Ahkemü min külli hakîm 5) Yâ Aİemü min külli \'alîm 6) Yâ Akdemü min külli kadîm 7) Yâ Ekberu min külli kebîr 8) Yâ Ecellü min külli celîl 9) Yâ E\'azzü min külli \'azîz 10) Yâ Eltafü min külli latîf 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey bütün azîmlerden daha Azîm, 2) Ey bütün cömertlerden daha Kerîm, 3) Ey bütün merhametlilerden daha Rahîm, 4) Ey bütün hikmet sahiplerinden daha Hakîm, 5) Ey bütün âlimlerden daha Alîm, 6) Ey bütün önce yaratılanlardan daha evvel var olan Kadîm, 7) Ey bütün büyüklerden daha büyük, 8) Ey bütün yücelerden daha Celîl, 9) Ey bütün izzet sahiplerinden daha Azîz, 10) Ey bütün lütuf sahiplerinden daha Lâtif, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},35:{a:'يَا مَنْ هُوَ فِى عَهْدِهِ وَفِىٌّ ● يَا مَنْ هُوَ فِى وَفَٓائِهِ قَوِىٌّ ● يَا مَنْ هُوَ فِى قُوَّتِهِ عَلِىٌّ ● يَا مَنْ هُوَ فِى عُلُوِّهِ قَرِيبٌ ● يَا مَنْ هُوَ فِى قُرْبِهِ لَطِيفٌ ● يَا مَنْ هُوَ فِى لُطْفِهِ شَرِيفٌ ● يَا مَنْ هُوَ فِى شَرَفِهِ عَزِيزٌ ● يَا مَنْ هُوَ فِى عِزَّتِهِ عَظِيمٌ ● يَا مَنْ هُوَ فِى عَظَمَتِهِ مَجِيدٌ ● يَا مَنْ هُوَ فِى مَجْدِهِ حَمِيدٌ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٣٥﴾',o:'1) Yâ Men hüve fî \'ahdihî vefiyy 2) Yâ Men hüve fî vefaihî kaviyy 3) Yâ Men hüve fî kuvvetihi \'aliyy 4) Yâ Men hüve fî \'ulüvvihî karîb 5) Yâ Men hüve fî kurbihî latîf 6) Yâ Men hüve fî lütfıhî şerîf 7) Yâ Men hüve fî şerefîhî \'azîz 8) Yâ Men hüve fî \'izzetihî \'azîm 9) Yâ Men hüve fî \'azametihî mecîd 10) Yâ Men hüve fî mecdihî hamîd 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey ahdinde vefalı, 2) Ey vefasında kuvvetli, 3) Ey kuvvetinde yüce, 4) Ey yüceliğinde yakın, 5) Ey yakınlığında latîf, 6) Ey lütfünde şerîf, 7) Ey şerefinde azîz, 8) Ey izzetinde azîm, 9) Ey azametinde mecîd, 10) Ey yüceliğinde hamîd, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},36:{a:'يَا مَنْ هُوَ كُلُّ شَىْءٍ خَاضِعٌ لَهُ ● يَا مَنْ هُوَ كُلُّ شَىْءٍ كَٓائِنٌ لَهُ ● يَا مَنْ هُوَ كُلُّ شَىْءٍ مَوْجُودٌ لَهُ ● يَا مَنْ هُوَ كُلُّ شَىْءٍ مُنِيبٌ لَهُ ● يَا مَنْ هُوَ كُلُّ شَىْءٍ خَٓائِفٌ مِنْهُ ● يَا مَنْ هُوَ كُلُّ شَىْءٍ مُسَبِّحٌ لَهُ ● يَا مَنْ هُوَ كُلُّ شَىْءٍ قَٓائِمٌ بِهِ ● يَا مَنْ هُوَ كُلُّ شَىْءٍ خَاشِعٌ لَهُ ● يَا مَنْ هُوَ كُلُّ شَىْءٍ صَٓائِرٌ اِلَيْهِ ● يَا مَنْ هُوَ كُلُّ شَىْءٍ هَالِكٌ اِلَّا وَجْهَهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٣٦﴾',o:'1) Yâ Men hüve küllü şey\'in hâdiun leh 2) Yâ Men hüve küllü şey\'in kâinün leh 3) Yâ Men hüve küllü şey\'in mevcudun leh 4) Yâ Men hüve küllü şey\'in münîbün leh 5) Yâ Men hüve küllü şey\'in hâifün minh 6) Yâ Men hüve küllü şey\'in müsebbihun leh 7) Yâ Men hüve küllü şey\'in kâimün bih 8) Yâ Men hüve küllü şey\'in hâşiün leh 9) Yâ Men hüve küllü şey\'in sâirun ileyh 10) Yâ men hüve küllü şey\'in hâlikün illâ vecheh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey her şeyin kendisine boyun eğdiği, 2) Ey her şey kendisi için var olan, 3) Ey her şey kendisi için mevcut olan, 4) Ey her şeyin kendisine döndüğü, 5) Ey her şeyin kendisinden korktuğu, 6) Ey her şeyin kendisini tesbih ettiği, 7) Ey her şey onunla ayakta olan, 8) Ey her şeyin kendisine itaat ettiği, 9) Ey her şeyin kendisine yöneldiği, 10) Ey ona bakan yüzü müstesnâ her şeyin helâk olduğu, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},37:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا كَافِى ● يَا وَافِى ● يَا شَافِى ● يَا مُعَافِى ● يَا عَالِى ● يَا دَاعِى ● يَا رَاضِى ● يَا قَاضِى ● يَا بَاقِى ● يَا هَادِى ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٣٧﴾',o:'1) Ve es\'elüke biesmâike Yâ Kâfi 2) Yâ Vâfî 3) Yâ Şâfî 4) Yâ Mu\'âfî 5) Yâ \'Âlî 6) Yâ Dâ\'î 7) Yâ Râdî 8) Yâ Kâdî 9) Yâ Bakî 10) Yâ Hâdî 11) Sübhâneke yâ îâ ilahe illâ ente\'l-emâ-ne\'I-emâne ecirnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey kullarına yeten Kâfi, 2) Ey vaadinde duran Vâfi, 3) Ey her türlü derde devâ veren Şâfi, 4) Ey maddî ve mânevî dertlere âfiyet veren Muâfi, 5) Ey her şeyiyle yüce olan Âli, 6) Ey kullarını iyiliğe ve Cennete davet eden Dâi, 7) Ey iyi kullarından hoşnut olan Râzi, 8) Ey hikmet ve adâletle hükmeden Kâdi, 9) Ey varlığının sonu olmayan Bâkî, 10) Ey dilediğini doğru yola ulaştıran Hâdi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},38:{a:'يَا مَنْ لَامَفَرَّ اِلَّا ٓ اِلَيْهِ ● يَا مَنْ لَا مَفْزَعَ اِلَّا ٓ اِلَيْهِ ● يَا مَنْ لَا مَلْجَأَ اِلَّا ٓ اِلَيْهِ ● يَا مَنْ لَا يُتَوَكَّلُ اِلَّا عَلَيْهِ ● يَا مَنْ لَا مَقْصَدَ اِلَّا ٓ اِلَيْهِ ● يَا مَنْ لَا مَنْجَأَ اِلَّا ٓ اِلَيْهِ ● يَا مَنْ لَا يُرْغَبُ اِلَّا ٓ اِلَيْهِ ● يَا مَنْ لَا يُعْبَدُ اِلَّا ٓ اِيَّاهُ ٔ ● يَا مَنْ لَا يُسْتَعَانُ اِلَّا مِنْهُ ٔ ● يَا مَنْ لَا حَوْلَ وَ لَا قُوَّةَ اِلَّا بِهِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٣٨﴾',o:'1) Yâ Men lâ meferra illâ ileyh 2) Yâ Men lâ mefze\'a illâ ileyh 3) Yâ Men lâ melcee illâ ileyh 4) Yâ Men lâ yutevekkelü illâ \'aleyh 5) Yâ Men lâ maksade illâ ileyh 6) Yâ Men lâ mencee illâ ileyh 7) Yâ Men lâ yurğabü illâ ileyh 8) Yâ Men lâ yu\'bedü illâ iyyâh 9) Yâ Men lâ yuste\'ânü illâ minh 10) Yâ Men lâ havle velâ kuvvete illâ bih 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey kendisinden başka kaçacak yer olmayan, 2) Ey kendisinden başka sığınılacak yer olmayan, 3) Ey kendisinden başka ilticâ edilecek yer olmayan, 4) Ey kendisinden başka tevekkül edilecek kimse olmayan, 5) Ey kendisinden başka maksut olmayan, 6) Ey kendisinden başka kurtuluş yeri olmayan, 7) Ey kendisinden başkasına rağbet edilmeyen, 8) Ey kendisinden başkasına ibâdet edilmeyen, 9) Ey kendisinden başkasından yardım istenilmeyen, 10) Ey kendisinden başka güç ve kuvvet sahibi bulunmayan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},39:{a:'يَا خَيْرَ الْمَرْهُوبِينَ ● يَا خَيْرَ الْمَطْلُوبِينَ ● يَا خَيْرَ الْمَرْغُوبِينَ ● يَا خَيْرَ الْمَسْئُولِينَ ● يَا خَيْرَ الْمَقْصُودِينَ ● يَا خَيْرَ الْمَذْكُورِينَ ● يَا خَيْرَ الْمَشْكُورِينَ ● يَا خَيْرَ الْمَحْبُوبِينَ ● يَا خَيْرَ الْمُنْزِلِينَ ● يَا خَيْرَ الْمُسْتَاْنِسِينَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٣٩﴾',o:'1) Yâ Hayra\'l-merhûbîn 2) Yâ Hayra\'l-matlûbîn 3) Yâ Hayra\'l-merğûbîn 4) Yâ Hayra\'l-mes\'ûlîn 5) Yâ Hayra\'l-maksûdîn 6) Yâ Hayra\'l-mezkûrîn 7) Yâ Hayra\'l-meşkûrîn 8) Yâ Hayra\'l-mahbûbîn 9) Yâ Hayra\'l-münzilîn 10) Yâ Hayra\'l-müste\'nisîn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey kendisine kaçılanların en hayırlısı, 2) Ey matlupların en hayırlısı, 3) Ey rağbet edilenlerin en hayırlısı, 4) Ey kendisinden dilekte bulunulanların en hayırlısı, 5) Ey maksut olanların en hayırlısı, 6) Ey zikredilenlerin en hayırlısı, 7) Ey şükredilenlerin en hayırlısı, 8) Ey sevilenlerin en hayırlısı, 9) Ey indirenlerin en hayırlısı, 10) Ey kendisine ünsiyet edilenlerin en hayırlısı, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},40:{a:'يَا مَنْ هُوَ خَلَقَ فَسَوّٰى ● يَا مَنْ هُوَ قَدَّرَ فَهَدٰى ● يَا مَنْ هُوَ يَكْشِفُ الْبَلْوٰى ● يَا مَنْ هُوَ يَسْمَعُ النَّجْوٰى ● يَا مَنْ هُوَ يُنْقِذُ الْغَرْقٰى ● يَا مَنْ هُوَ يُنْجِى الْهَلْكٰى ● يَا مَنْ هُوَ يَشْفِى الْمَرْضٰى ● يَا مَنْ هُوَ اَمَاتَ وَ اَحْىٰ ● يَا مَنْ هُوَ اَضْحَكَ وَ اَبْكٰى ● يَا مَنْ هُوَ اَضَلَّ وَ اَهْدٰى ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٤٠﴾',o:'1) Yâ Men hüve halaka fesevvâ 2) Yâ Men hüve kaddera fehedâ 3) Yâ Men hüve yekşifü\'l-belvâ 4) Yâ Men hüve yesme\'u\'n-necvâ 5) Yâ Men hüve yünkizü\'l-garkâ 6) Yâ Men hüve yünci\'l-helkâ 7) Yâ Men hüve yeşfi\'l-merdâ 8) Yâ Men hüve emâte ve ahyâ 9) Yâ Men hüve edhake ve ebkâ 10) Yâ Men hüve edalle ve ehdâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey yaratıp düzene koyan, 2) Ey takdir edip hedefe götüren, 3) Ey belâyı kaldıran, 4) Ey gizli yakarışı işiten, 5) Ey batmışı kurtaran, 6) Ey helâk olana necât veren, 7) Ey hastaya şifa veren, 8) Ey öldüren ve dirilten, 9) Ey güldüren ve ağlatan, 10) Ey saptıran ve hidâyete erdiren, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},41:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا غَافِرُ ● يَا سَاتِرُ ● يَا قَاهِرُ ● يَا قَادِرُ ● يَا نَاظِرُ ● يَا فَاطِرُ ● يَا شَاكِرُ ● يَا ذَاكِرُ ● يَا نَاصِرُ ● يَا جَابِرُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٤١﴾',o:'1) Ve es\'elüke biesmâike Yâ Ğâfır 2) Yâ Sâtir 3) Yâ Kahir 4) Yâ Kadir 5) Yâ Nazır 6) Yâ Fâtır 7) Yâ Şâkir 8) Yâ Zâkir 9) Yâ Nâsır 10) Yâ Câbir 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey dilediği kullarının günahlarını bağışlayan Gâfir, 2) Ey ayıp ve kusurları örten Sâtir, 3) Ey düşmanlarını mağlup eden Kâhir, 4) Ey her şeye gücü yeten Kâdir, 5) Ey bütün mahlûkatının hallerini gören Nâzır, 6) Ey bütün mahlûkatı yoktan var eden Fâtır, 7) Ey kendine yapılan ibâdet ve şükürlere bol mükâfat veren Şâkir, 8) Ey kendisini zikredenleri yâd eden Zâkir, 9) Ey dostlarına yardım eden Nâsır, 10) Ey dilediğini zorla yaptıran Câbir, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},42:{a:'يَا مَنْ هُوَ فِى الْبَرِّ وَ الْبَحْرِ سَبِيلُهُ ● يَا مَنْ هُوَ فِى اْلاٰفَاقِ اٰيَاتُهُ ● يَا مَنْ هُوَ فِى اْلاٰيَاتِ بُرْهَانُهُ ● يَا مَنْ هُوَ فِى الْمَمَاتِ قُدْرَتُهُ ● يَا مَنْ هُوَ فِى الْقُبُورِ عِزَّتُهُ ● يَا مَنْ هُوَ فِى الْقِيَامَةِ مِلْكَتُهُ ● يَا مَنْ هُوَ فِى الْحِسَابِ هَيْبَتُهُ ● يَا مَنْ هُوَ فِى الْمِيزَانِ قَضَٓائُهُ ● يَا مَنْ هُوَ فِى الْجَنَّةِ رَحْمَتُهُ ● يَا مَنْ هُوَ فِى النَّارِ عَذَابُهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٤٢﴾',o:'1) Yâ Men hüve fi\'l-berri ve\'l-bahri sebîlüh 2) Yâ Men hüve fi\'l-âfaki âyâtüh 3) Yâ Men hüve fi\'l-âyâti bürhânüh 4) Yâ Men hüve fı\'l-memâti kudratüh 5) Yâ Men hüve fı\'l-kubûri \'izzetüh 6) Yâ Men hüve fı\'l-kıyâmeti milketüh 7) Yâ Men hüve fı\'l-hisâbi heybetüh 8) Yâ Men hüve fı\'l-mîzâni kadâüh 9) Yâ Men hüve fi\'l-cenneti rahmetüh 10) Yâ Men hüve fı\'n-nâri \'azâbüh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey karada ve denizde yolu olan, 2) Ey dış âlemde âyetleri bulunan, 3) Ey âyetlerinde delili olan, 4) Ey ölümlerde kudreti tecellî eden, 5) Ey kabirlerde izzeti olan, 6) Ey Kıyâmette saltanatı olan, 7) Ey hesapta heybeti olan, 8) Ey Mîzanda hükmü olan, 9) Ey Cennette rahmeti olan, 10) Ey ateşte azabı olan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},43:{a:'يَا مَنْ هُوَ اِلَيْهِ يَهْرَبُ الْخَٓائِفُونَ ● يَا مَنْ هُوَ اِلَيْهِ يَفْزَعُ الْمُذْنِبُونَ ● يَا مَنْ هُوَ اِلَيْهِ يَقْصِدُ الْمُنِيبُونَ ● يَا مَنْ هُوَ اِلَيْهِ يَلْجَأُ الْعَاصُونَ ● يَا مَنْ هُوَ اِلَيْهِ يَرْغَبُ الزَّاهِدُونَ ● يَا مَنْ هُوَ فِيهِ يَطْمَعُ الْخَاطِؤُنَ ● يَا مَنْ هُوَ يَسْتَاْنِسُ بِهِ الْمُرِيدُونَ ● يَا مَنْ هُوَ يَفْتَخِرُ بِهِ الْمُحْسِنُونَ ● يَا مَنْ هُوَ عَلَيْهِ يَتَوَكَّلُ الْمُتَوَكِّلُونَ ● يَا مَنْ هُوَ يَسْكُنُ بِهِ الْمُوقِنُونَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٤٣﴾',o:'1) Yâ Men hüve ileyhi yehrabü\'l-hâifûn 2) Yâ Men hüve ileyhi yefze\'u\'l-müznibûn 3) Yâ Men hüve ileyhi yaksıdü\'l-münîbûn 4) Yâ Men hüve ileyhi yelceü\'l-\'âsûn 5) Yâ Men hüve ileyhi yerğabü\'z-zâhidûn 6) Yâ Men hüve fîhi yatme\'u\'l-hâtıûn 7) Yâ Men hüve yeste\'nisü bihi\'l-mürîdûn 8) Yâ Men hüve yeftehiru bihi\'l-muhsinûn 9) Yâ men hüve \'aleyhi yetevekkelü\'l-mütevekkilun 10) Yâ men hüve yeskünü bihi\'l-mûkınûn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey korkanların kendisine kaçtığı, 2) Ey günahkârların kendisine sığındığı, 3) Ey tövbe edenlerin kendisine yöneldiği, 4) Ey âsilerin kendisine ilticâ ettiği, 5) Ey zahitlerin kendisine rağbet ettiği, 6) Ey hatâlıların kendisine ümit beslediği, 7) Ey kendisini arzulayanların onunla ünsiyet bulduğu, 8) Ey iyilik yapanların kendisiyle iftihar ettiği, 9) Ey tevekkül edenlerin kendisine güvendiği, 10) Ey kuvvetle îman edenlerin kendisiyle huzur bulduğu, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok. Emân ver bize. Bizi Cehennemden kurtar.'},44:{a:'يَٓا اَقْرَبُ مِنْ كُلِّ قَرِيبٍ ● يَٓا اَحَبُّ مِنْ كُلِّ حَبِيبٍ ● يَٓا اَعْظَمُ مِنْ كُلِّ عَظِيمٍ ● يَٓا اَعَزُّ مِنْ كُلِّ عَزِيزٍ ● يَٓا اَقْوٰى مِنْ كُلِّ قَوِىٍّ ● يَٓا اَغْنٰى مِنْ كُلِّ غَنِىٍّ ● يَٓا اَجْوَدُ مِنْ كُلِّ جَوَادٍ ● يَٓا اَرْأَفُ مِنْ كُلِّ رَؤُفٍ ● يَٓا اَرْحَمُ مِنْ كُلِّ رَحِيمْ ● يَٓا اَجَلُّ مِنْ كُلِّ جَلِيلٍ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٤٤﴾',o:'1) Yâ Ekrabu min külli karîb 2) Yâ Ehabbu miri külli habîb 3) Yâ A\'zamu min külli \'azîm 4) Yâ E\'azzu min külli \'azîz 5) Yâ Ekvâ min külli kaviyy 6) Yâ Ağnâ min külli ğaniyy 7) Yâ Ecvedu min külli cevâd 8) Yâ Er\'efu min külli raûf 9) Yâ Erhamu min külli rahîm 10) Yâ Ecellu min külli celîl 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey bütün yakınlardan daha yakın, 2) Ey bütün sevilenlerden daha sevgili, 3) Ey bütün büyüklerden daha büyük, 4) Ey bütün izzet sahiplerinden daha azîz, 5) Ey bütün kuvvetlilerden daha kavî, 6) Ey bütün zenginlerden daha zengin, 7) Ey bütün cömertlerden daha cömert, 8) Ey bütün şefkatlilerden daha raûf, 9) Ey bütün merhametlilerden daha rahîm, 10) Ey bütün yücelerden daha yüce, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},45:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا قَرِيبُ ● يَا رَقِيبُ ● يَا حَبِيبُ ● يَا مُجِيبُ ● يَا حَسِيبُ ● يَا طَبِيبُ ● يَا بَصِيرُ ● يَا خَبِيرُ ● يَا مُنِيرُ ● يَا مُبِينُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٤٥﴾',o:'1) Ve es\'elüke biesmâike Yâ Karîb 2) Yâ Rakîb 3) Yâ Habîb 4) Yâ Mucîb 5) Yâ Hasîb 6) Yâ Tabîb 7) Yâ Basîr 8) Yâ Habîr 9) Yâ Munîr 10) Yâ Mubîn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey her şeye her şeyden daha yakın olan Karîb, 2) Ey bütün mahlûkatını gözetleyen Rakîb, 3) Ey müminlerin sevgilisi olan Habîb, 4) Ey kullarının duâlarına cevap veren Mucîb, 5) Ey kullarının bütün fiillerinin hesâbını gören Hasîb, 6) Ey bütün dertlere devâ veren Tabîb, 7) Ey her şeyi bütün incelikleriyle gören Basîr, 8) Ey her şeyden haberdar olan Habîr, 9) Ey her şeyi nûruyla aydınlatan Münîr, 10) Ey kullarına gerekli her şeyi açıklayan Mübîn, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},46:{a:'يَا غَالِبًا غَيْرَ مَغْلُوبٍ ● يَا صَانِعًا غَيْرَ مَصْنُوعٍ ● يَا خَالِقًا غَيْرَ مَخْلُوقٍ ● يَا مَالِكًا غَيْرَ مَمْلُوكٍ ● يَا قَاهِرًا غَيْرَ مَقْهُورٍ ● يَا رَافِعًا غَيْرَ مَرْفُوعٍ ● يَا نَاصِرًا غَيْرَ مَنْصُورٍ ● يَا حَافِظًا غَيْرَ مَحْفُوظٍ ● يَا شَاهِدًا غَيْرَ غَٓائِبٍ ● يَا قَرِيبًا غَيْرَ بَعِيدٍ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٤٦﴾',o:'1) Yâ Ğâliben gayra mağlûb 2) Yâ Sâni\'an gayra masnu\' 3) Yâ Hâlikan gayra mahlûk 4) Yâ Mâliken gayra memlûk 5) Yâ Kâhiran gayra makhûr 6) Yâ Râfı\'an gayra merfu\' 7) Yâ Hafızan gayra mahfuz 8) Yâ Nâsiran gayra mensur 9) Yâ Sahiden gayra gâib 10) Yâ Karîben gayra ba\'îd 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey mağlûp olmayan Galip, 2) Ey yaratılmış olmayan Sanatkâr, 3) Ey mahlûk olmayan Yaratıcı, 4) Ey sahip olunamayan Mülk Sahibi, 5) Ey kendisine üstün gelinemeyen Kahir, 6) Ey yükseltilmekten münezzeh Yükseltici, 7) Ey yardım edilmeyen Yardım Edici, 8) Ey korunmayan Koruyucu, 9) Ey gaip olmayan Şahit, 10) Ey uzak olmayan yakın, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},47:{a:'يَا نُورَ النُّورِ ● يَا مُنَوِّرَ النُّورِ ● يَا مُصَوِّرَ النُّورِ ● يَا خَالِقَ النُّورِ ● يَا مُدَبِّرَ النُّورِ ● يَا مُقَدِّرَ النُّورِ ● يَا نُورًا قَبْلَ كُلِّ نُورٍ ● يَا نُورًا بَعْدَ كُلِّ نُورٍ ● يَا نُورًا فَوْقَ كُلِّ نُورٍ ● يَا نُورًا لَيْسَ مِثْلَهُ نُورٌ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٤٧﴾',o:'1) Yâ Nûra\'n-nûr 2) Yâ Munevvira\'n-nûr 3) Yâ Musavvira\'n-nûr 4) Yâ Hâlika\'n-nûr 5) Yâ Mukaddira\'n-nûr 6) Yâ Mudebbira\'n-nûr 7) Yâ Nûran kable külli nûr 8) Yâ Nûran ba\'de külli nûr 9) Yâ Nûran fevka külli nûr 10) Yâ Nûran leyse mislehû nûr 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey nurların nuru, 2) Ey nurları nurlandıran, 3) Ey nurlara sûret ve şekil veren, 4) Ey nurları yaratan, 5) Ey nurları idâre eden, 6) Ey nurları takdir eden, 7) Ey bütün nurlardan evvel olan Nur, 8) Ey bütün nurlardan sonra da var olan Nur, 9) Ey bütün nurların üstünde olan Nur, 10) Ey hiçbir nûrun Kendisine benzemediği Nur, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},48:{a:'يَا مَنْ عَطَٓاؤُهُ شَرِيفٌ ● يَا مَنْ فِعْلُهُ لَطِيفٌ ● يَا مَنْ لُطْفُهُ مُقِيمٌ ● يَا مَنْ اِحْسَانُهُ قَدِيمٌ ● يَا مَنْ قَوْلُهُ حَقٌّ ● يَا مَنْ وَعْدُهُ صِدْقٌ ● يَا مَنْ عَفْوُهُ فَضْلٌ ● يَا مَنْ عَذَابُهُ عَدْلٌ ● يَا مَنْ ذِكْرُهُ حُلْوٌ ● يَا مَنْ اُنْسُهُ لَذِيذٌ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٤٨﴾',o:'1) Yâ Men \'atâuhû şerîf 2) Yâ Men fı\'lühû latîf 3) Yâ Men lütfühû mükim 4) Yâ Men ihsânühû kadîm 5) Yâ Men kavlühü hakk 6) Yâ Men va\'dühû sıdk 7) Yâ Men \'afVühû fadl 8) Yâ Men \'azabühû \'adl 9) Yâ Men zikrühû hulv 10) Yâ men ünsühû leziz 11) Sübhâneke yâ lâ ilahe illâ ente\'l-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey bağış ve ihsânı şerefli olan, 2) Ey fiili latîf olan, 3) Ey lütfü dâim olan, 4) Ey ihsânı kadîm olan, 5) Ey sözü hak olan, 6) Ey vaadi doğru olan, 7) Ey affı fazıl olan, 8) Ey azâbı adâlet olan, 9) Ey zikri tatlı olan, 10) Ey dostluğu lezzetli olan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},49:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا مُنَوِّلُ ● يَا مُفَصِّلُ ● يَا مُبَدِّلُ ● يَا مُسَهِّلُ ● يَا مُذَلِّلُ ● يَا مُنَزِّلُ ● يَا مُحَوِّلُ ● يَا مُجَمِّلُ ● يَا مُكَمِّلُ ● يَا مُفَضِّلُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْ
