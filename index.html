}

function renderReader() {
  const h = getSelectedTur();
  const index = activeIndex;
  const entry = h.cuzler[index];
  const babData = CEVSEN_DATA[index + 1];
  applyReaderFontScale();

  document.getElementById('readerTitle').textContent = (index + 1) + '. Bâb';
  document.getElementById('readerMeta').textContent = !entry
    ? 'Henüz okunmadı'
    : (entry.completed
        ? escapeHtml(entry.name) + ' okudu ✓ (' + escapeHtml(entry.completedDate || '') + ')'
        : escapeHtml(entry.name) + ' aldı (' + escapeHtml(entry.date) + ')');

  const prevBtn = document.getElementById('readerPrevBtn');
  const nextBtn = document.getElementById('readerNextBtn');
  prevBtn.disabled = index <= 0;
  nextBtn.disabled = index >= TOTAL - 1;

  ['arabic', 'meal', 'okunus'].forEach((t) => {
    const btn = document.getElementById('readerTab_' + t);
    if (btn) btn.className = 'reader-tab-btn' + (readerTab === t ? ' active' : '');
  });

  const contentEl = document.getElementById('readerContent');
  if (!babData) {
    contentEl.innerHTML = '<p class="reader-text">İçerik bulunamadı.</p>';
  } else if (readerTab === 'arabic') {
    contentEl.innerHTML = splitArabicLines(babData.a)
      .map((line) => '<p class="reader-text reader-arabic" dir="rtl">' + escapeHtml(line) + '</p>')
      .join('');
  } else if (readerTab === 'meal') {
    contentEl.innerHTML = splitNumberedLines(babData.m)
      .map((line) => '<p class="reader-text reader-meal">' + escapeHtml(line) + '</p>')
      .join('');
  } else {
    contentEl.innerHTML = splitNumberedLines(babData.o)
      .map((line) => '<p class="reader-text reader-okunus">' + escapeHtml(line) + '</p>')
      .join('');
  }
  contentEl.scrollTop = 0;

  const footerEl = document.getElementById('readerFooter');
  if (entry && entry.completed) {
    footerEl.innerHTML = '<p class="reader-done">✓ Bu bâb tamamlandı</p>';
  } else {
    const label = index < TOTAL - 1 ? 'Okudum, sonraki bâba geç →' : 'Okudum, tamamladım ✓';
    footerEl.innerHTML = '<button class="btn btn-primary" id="readerAdvanceBtn" style="width:100%;">' + label + '</button>';
    document.getElementById('readerAdvanceBtn').addEventListener('click', () => handleAdvanceClick(index));
  }
}

function handleAdvanceClick(index) {
  const h = getSelectedTur();
  const entry = h.cuzler[index];
  const name = (entry && entry.name) || getStoredName();
  if (!name) {
    openNameModalForRead(index);
    return;
  }
  markReadAndAdvance(index, name);
}

function parseDDMMYYYY(str) {
  if (!str) return null;
  const parts = str.split('.');
  if (parts.length !== 3) return null;
  return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10), 23, 59, 59);
}

function updateCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  renderCountdownNow();
  countdownTimer = setInterval(renderCountdownNow, 60000);
}

function renderCountdownNow() {
  const h = getSelectedTur();
  const target = parseDDMMYYYY(h.targetDate);
  if (!target) {
    countdownBanner.textContent = 'Son okuma tarihi belirlenmedi — üstteki alana dokunup ekleyebilirsin.';
    countdownBanner.className = 'countdown-banner empty';
    countdownBanner.onclick = () => openDateEditor('targetDate', 'Son Okuma Tarihi');
    return;
  }
  countdownBanner.onclick = null;
  const now = new Date();
  const diffMs = target - now;
  if (diffMs <= 0) {
    countdownBanner.textContent = 'Son okuma tarihi geçti (' + h.targetDate + ')';
    countdownBanner.className = 'countdown-banner overdue';
    return;
  }
  const totalMinutes = Math.floor(diffMs / 60000);
  const days = Math.floor(totalMinutes / (60 * 24));
  const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
  const minutes = totalMinutes % 60;
  let text = 'Kalan süre: ';
  if (days > 0) text += days + ' gün ';
  text += hours + ' saat ' + minutes + ' dk';
  countdownBanner.textContent = text;
  countdownBanner.className = totalMinutes <= 3 * 24 * 60 ? 'countdown-banner soon' : 'countdown-banner';
}

function loadImageSafe(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('image failed'));
    img.src = src;
  });
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fitTextFont(ctx, text, maxWidth, startSize, family, weight) {
  let size = startSize;
  ctx.font = weight + ' ' + size + 'px ' + family;
  while (ctx.measureText(text).width > maxWidth && size > 24) {
    size -= 2;
    ctx.font = weight + ' ' + size + 'px ' + family;
  }
  return size;
}

  const completedCount = h.cuzler.filter((e) => e && e.completed).length;
  const takenCount = h.cuzler.filter(Boolean).length;
  const pct = completedCount / TOTAL;

  const W = 1080, H = 1080;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Arka plan
  ctx.fillStyle = '#F5EFE1';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#143327';
  ctx.fillRect(0, 0, W, 10);
  ctx.fillRect(0, H - 10, W, 10);

  // Logo (varsa) — dairesel
  try {
    const logo = await loadImageSafe('logo.png');
    const size = 170, cx = W / 2, cy = 155;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(logo, cx - size / 2, cy - size / 2, size, size);
    ctx.restore();
    ctx.beginPath();
    ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#D9C68F';
    ctx.stroke();
  } catch (e) { /* logo yüklenemedi, sorun değil */ }

  ctx.textAlign = 'center';

  // Üst etiket
  ctx.fillStyle = '#B08A2E';
  ctx.font = '600 30px "Work Sans", sans-serif';
  ctx.fillText('CEVŞEN LİSTESİ', W / 2, 300);

  // Tur adı
  const turName = h.hatimName || 'Cevşen';
  ctx.fillStyle = '#143327';
  const nameFont = fitTextFont(ctx, turName, W - 160, 62, "'Amiri', serif", '700');
  ctx.font = '700 ' + nameFont + "px 'Amiri', serif";
  ctx.fillText(turName, W / 2, 400);

  // Büyük sayı
  ctx.fillStyle = '#1E4D3B';
  ctx.font = "700 150px 'Amiri', serif";
  ctx.fillText(completedCount + ' / ' + TOTAL, W / 2, 610);

  ctx.fillStyle = '#5B6350';
  ctx.font = '500 34px "Work Sans", sans-serif';
  ctx.fillText('bâb tamamlandı', W / 2, 665);

  // İlerleme çubuğu
  const barW = 820, barH = 34, barX = (W - barW) / 2, barY = 730;
  ctx.fillStyle = '#ECE3CC';
  roundRectPath(ctx, barX, barY, barW, barH, barH / 2);
  ctx.fill();
  ctx.strokeStyle = '#D8CBA8';
  ctx.lineWidth = 2;
  roundRectPath(ctx, barX, barY, barW, barH, barH / 2);
  ctx.stroke();
  if (pct > 0) {
    ctx.fillStyle = '#1E4D3B';
    roundRectPath(ctx, barX, barY, Math.max(barH, barW * pct), barH, barH / 2);
    ctx.fill();
  }

  ctx.fillStyle = '#5B6350';
  ctx.font = '400 28px "Work Sans", sans-serif';
  ctx.fillText(takenCount + ' / ' + TOTAL + ' bâb alınmış', W / 2, 815);

  ctx.fillStyle = '#B08A2E';
  ctx.font = '500 26px "Work Sans", sans-serif';
  ctx.fillText('Harmonie31', W / 2, H - 60);

  canvas.toBlob(async (blob) => {
    if (!blob) { showMessage('Görsel oluşturulamadı.'); return; }
    const fileName = 'cevsen-ozet.png';
    try {
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: 'Cevşen Özet',
          text: (h.hatimName || 'Cevşen') + ' — ' + completedCount + '/' + TOTAL + ' tamamlandı 🌙'
        });
        return;
      }
    } catch (e) { /* paylaşım iptal edildi/desteklenmiyor — indirmeye düş */ }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showMessage('Görsel indirildi — bu tarayıcı direkt paylaşımı desteklemiyor. İndirilen resmi WhatsApp\'a elle ekleyip gönderebilirsin.');
  }, 'image/png');
}

function shareOnWhatsApp() {
  const h = getSelectedTur();
  if (isTurLocked(h)) { showMessage('Bu tur özel — önce kilidi açman gerekiyor.'); return; }
  const takenCount = h.cuzler.filter(Boolean).length;
  const completedCount = h.cuzler.filter((e) => e && e.completed).length;
  const notCompletedCount = TOTAL - completedCount;
  const url = window.location.href;
  const lines = [];
  lines.push('*' + (h.hatimName || 'Cevşen') + '*' + ' için bâb paylaşımı 🌙');
  lines.push('');
  lines.push('*Açılma tarihi:* ' + (h.hatimStart || 'girilmedi'));
  lines.push('*Son okuma tarihi:* ' + (h.targetDate || 'girilmedi'));
  lines.push('');
  lines.push('*' + takenCount + ' / ' + TOTAL + '* bâb alındı.');
  if (completedCount === TOTAL) {
    lines.push('*Tüm bâblar okundu* 🎉');
  } else {
    lines.push('*' + completedCount + '* bâb okundu, *' + notCompletedCount + '* bâb okunmadı.');
  }
  lines.push('');
  lines.push('Boş bir bâbı almak için linke gir:');
  lines.push(url);
  const message = lines.join('\n');
  const waUrl = 'https://wa.me/?text=' + encodeURIComponent(message);
  window.open(waUrl, '_blank');
}

async function markReadAndAdvance(index, name) {
  await refetchIfPossible();
  const h = getSelectedTur();
  let entry = h.cuzler[index];
  if (entry && entry.completed) {
    // already marked by someone else in the meantime — just move on
    render();
    if (index < TOTAL - 1) { activeIndex = index + 1; } else { activeIndex = index; }
    renderReader();
    return;
  }
  if (!entry) {
    entry = { name: name, date: todayStr(), completed: false, completedDate: null };
    h.cuzler[index] = entry;
  }
  entry.completed = true;
  entry.completedDate = todayStr();
  await saveState();
  setStoredName(name);
  render();

  const completedCount = h.cuzler.filter((e) => e && e.completed).length;
  if (completedCount === TOTAL && !h.celebrated) {
    h.celebrated = true;
    await saveState();
    activeIndex = index;
    renderReader();
    celebrateComplete(h.hatimName);
    return;
  }

  if (index < TOTAL - 1) {
    activeIndex = index + 1;
  } else {
    activeIndex = index;
  }
  renderReader();
}

function celebrateComplete(turAdi) {
  const colors = ['#1E4D3B', '#B08A2E', '#D9C68F', '#A6432D', '#F5EFE1'];
  const layer = document.createElement('div');
  layer.style.position = 'fixed';
  layer.style.inset = '0';
  layer.style.pointerEvents = 'none';
  layer.style.zIndex = '9999';
  layer.style.overflow = 'hidden';
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    const size = 6 + Math.random() * 6;
    piece.style.position = 'absolute';
    piece.style.top = '-20px';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.width = size + 'px';
    piece.style.height = size + 'px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    piece.style.opacity = '0.9';
    const duration = 2.2 + Math.random() * 1.6;
    const delay = Math.random() * 0.4;
    const drift = (Math.random() * 160 - 80) + 'px';
    piece.style.animation = 'confettiFall ' + duration + 's ease-in ' + delay + 's forwards';
    piece.style.setProperty('--drift', drift);
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 4200);
  showMessage('🎉 Tebrikler! "' + (turAdi || 'Bu Cevşen') + '" tamamlandı — 100/100 bâb okundu. Emeği geçen herkese Allah razı olsun.');
}

function resetAll() {
  showConfirm('Bu turun bâb listesi tamamen boşaltılacak (isim ve tarihler kalacak). Emin misin?', async () => {
    await refetchIfPossible();
    const h = getSelectedTur();
    h.cuzler = new Array(TOTAL).fill(null);
    h.celebrated = false;
    await saveState();
    render();
  });
}

function startNewTur() {
  showConfirm('Yeni bir Cevşen turu oluşturulacak ve ekrana o gelecek. Mevcut tur silinmez, listede kalır. Emin misin?', async () => {
    await refetchIfPossible();
    if (!state.hatims) state.hatims = [];
    const newTur = freshTur('');
    state.hatims.unshift(newTur);
    setSelectedHatimId(newTur.id);
    await saveState();
    render();
    openNewTurSetupModal(newTur.id);
  });
}

function openNewTurSetupModal(turId) {
  modalContent.innerHTML =
    '<h2>Yeni Tur</h2>' +
    '<p class="sub">Bu tura bir isim ver. İstersen özel yapmak için bir şifre de belirleyebilirsin (opsiyonel) — o zaman bu turun bâblarını sadece şifreyi bilenler açıp okuyabilir, listede 🔒 ile görünür.</p>' +
    '<input type="text" id="newTurNameInput" placeholder="Tur adı" maxlength="40" autofocus>' +
    '<input type="password" id="newTurPassInput" placeholder="Şifre (opsiyonel)" maxlength="30" autocomplete="off">' +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="newTurCancelBtn">Vazgeç</button>' +
      '<button class="btn btn-primary" id="newTurSaveBtn">Kaydet</button>' +
    '</div>';
  document.getElementById('newTurCancelBtn').addEventListener('click', closeModal);
  const nameInput = document.getElementById('newTurNameInput');
  const saveIt = async () => {
    const nameVal = nameInput.value.trim();
    const passVal = document.getElementById('newTurPassInput').value.trim();
    if (!nameVal) { showMessage('Bir tur adı yaz.'); return; }
    await refetchIfPossible();
    const hh = (state.hatims || []).find((x) => x.id === turId);
    if (!hh) { closeModal(); return; }
    hh.hatimName = nameVal;
    hh.turPassword = passVal || null;
    if (passVal) unlockTurFor(turId);
    await saveState();
    render();
    closeModal();
  };
  document.getElementById('newTurSaveBtn').addEventListener('click', saveIt);
  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveIt(); });
  overlay.classList.add('open');
  setTimeout(() => nameInput.focus(), 50);
}

function openTurList() {
  const hatims = state.hatims || [];
  let listHtml;
  if (hatims.length === 0) {
    listHtml = '<p class="sub">Henüz hiç tur yok.</p>';
  } else {
    listHtml = '<ul class="who-took-list">' +
      hatims.map((h) => {
        const completed = h.cuzler.filter((e) => e && e.completed).length;
        const isSelected = h.id === selectedHatimId;
        const deleteBtn = adminMode
          ? '<button class="hatim-delete-btn" data-del-id="' + h.id + '" title="Bu turu sil" style="background:none;border:none;font-size:15px;cursor:pointer;padding:2px 4px;flex-shrink:0;opacity:0.7;">🗑️</button>'
          : '';
        return '<li style="cursor:pointer;' + (isSelected ? ' font-weight:700;' : '') + '" data-id="' + h.id + '">' +
          '<span>' + (isSelected ? '● ' : '') + (h.turPassword ? '🔒 ' : '') + escapeHtml(h.hatimName || 'Cevşen') + '</span>' +
          '<span class="count">' + completed + ' / ' + TOTAL + ' okundu · ' + escapeHtml(h.createdDate || '') + '</span>' +
          deleteBtn +
          '</li>';
      }).join('') +
      '</ul>';
  }
  modalContent.innerHTML =
    '<h2>Cevşen Turları</h2>' +
    '<p class="sub">Görüntülemek istediğin tura dokun.' + (adminMode ? ' Silmek için 🗑️ ikonuna dokun.' : '') + '</p>' +
    listHtml +
    '<div class="modal-actions"><button class="btn btn-primary" id="turListCloseBtn">Kapat</button></div>';
  document.getElementById('turListCloseBtn').addEventListener('click', closeModal);
  modalContent.querySelectorAll('.who-took-list li').forEach((li) => {
    li.addEventListener('click', () => {
      setSelectedHatimId(li.getAttribute('data-id'));
      closeModal();
      render();
    });
  });
  modalContent.querySelectorAll('.hatim-delete-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteTur(btn.getAttribute('data-del-id'));
    });
  });
  overlay.classList.add('open');
}

function deleteTur(id) {
  const h = (state.hatims || []).find((x) => x.id === id);
  if (!h) return;
  if (state.hatims.length <= 1) {
    showMessage('Bu son tur — silinemez. Önce yeni bir tur ekleyip sonra bunu silebilirsin.');
    return;
  }
  showConfirm('"' + (h.hatimName || 'Bu tur') + '" tamamen silinecek, geri alınamaz. Emin misin?', async () => {
    await refetchIfPossible();
    state.hatims = (state.hatims || []).filter((x) => x.id !== id);
    if (selectedHatimId === id) {
      setSelectedHatimId(state.hatims[0] ? state.hatims[0].id : null);
    }
    await saveState();
    render();
    openTurList();
  });
}

function openMainMenu() {
  const adminToggleLabel = adminMode ? 'Yönetici Modunu Kapat 🔓' : 'Yönetici Modunu Aç 🔒';
  const adminToggleClass = adminMode ? 'btn-help' : 'btn-ghost';
  modalContent.innerHTML =
    '<h2>Menü</h2>' +
    '<button class="btn ' + adminToggleClass + '" id="menuAdminToggle" style="width:100%; margin-bottom:8px;">' + adminToggleLabel + '</button>' +
    '<button class="btn btn-ghost" id="menuWhoTook" style="width:100%; margin-bottom:8px;">Kim okudu?</button>' +
    '<button class="btn btn-ghost" id="menuLeaderboard" style="width:100%; margin-bottom:8px;">En Çok Katkı Sağlayanlar</button>' +
    '<button class="btn btn-ghost" id="menuChangeName" style="width:100%; margin-bottom:8px;">İsmini Değiştir</button>' +
    '<button class="btn btn-ghost" id="menuShare" style="width:100%; margin-bottom:8px;">WhatsApp\'ta paylaş</button>' +
    '<button class="btn btn-ghost" id="menuShareImage" style="width:100%; margin-bottom:8px;">📸 Özet Kartı Paylaş</button>' +
    '<button class="btn btn-ghost" id="menuQr" style="width:100%; margin-bottom:8px;">QR kod</button>' +
    '<button class="btn btn-ghost" id="menuTurList" style="width:100%; margin-bottom:8px;">Cevşen Turları</button>' +
    '<button class="btn btn-help" id="menuNewTur" style="width:100%; margin-bottom:8px;">Yeni Tur Ekle</button>' +
    '<button class="btn btn-danger" id="menuReset" style="width:100%; margin-bottom:8px;">Bu Turu Sıfırla</button>' +
    '<button class="btn btn-ghost" id="menuGoHatim" style="width:100%;">📖 Hatim Listesi\'ne Geç</button>' +
    '<div class="modal-actions" style="margin-top:12px;"><button class="btn btn-ghost" id="menuCloseBtn">Kapat</button></div>';
  document.getElementById('menuAdminToggle').addEventListener('click', () => {
    if (adminMode) { disableAdminMode(); } else { openAdminModeModal(); }
  });
  document.getElementById('menuWhoTook').addEventListener('click', openWhoTook);
  document.getElementById('menuLeaderboard').addEventListener('click', openLeaderboard);
  document.getElementById('menuChangeName').addEventListener('click', openChangeNameModal);
  document.getElementById('menuShare').addEventListener('click', () => { closeModal(); shareOnWhatsApp(); });
  document.getElementById('menuShareImage').addEventListener('click', () => { closeModal(); shareProgressImage(); });
  document.getElementById('menuQr').addEventListener('click', openQrModal);
  document.getElementById('menuTurList').addEventListener('click', openTurList);
  document.getElementById('menuNewTur').addEventListener('click', () => requireAdmin(startNewTur));
  document.getElementById('menuReset').addEventListener('click', () => requireAdmin(resetAll));
  document.getElementById('menuGoHatim').addEventListener('click', () => { window.location.href = 'https://sadikerd.github.io/hatim-listesi/'; });
  document.getElementById('menuCloseBtn').addEventListener('click', closeModal);
  overlay.classList.add('open');
}

menuBtn.addEventListener('click', openMainMenu);
viewGridBtn.addEventListener('click', () => { viewMode = 'grid'; try { localStorage.setItem('cevsenViewMode', 'grid'); } catch (e) {} render(); });
viewListBtn.addEventListener('click', () => { viewMode = 'list'; try { localStorage.setItem('cevsenViewMode', 'list'); } catch (e) {} render(); });

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});

loadState();
</script>
