اَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٤٩﴾',o:'1) Ve es\'elüke biesmâike Yâ Munevvil 2) Yâ Mufassil 3) Yâ Mubeddil 4) Yâ Musehhil 5) Yâ Muzellil 6) Yâ Munezzil 7) Yâ Muhavvil 8) Yâ Mucemmil 9) Yâ Mukemmil 10) Yâ Mufaddil 11) Sübhâneke yâ lâ ilahe illâ ente ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey kullarına nîmet ihsan eden Münevvil, 2) Ey bütün müşkülleri halleden ve hak ile bâtılın arasını ayıran Mufassıl, 3) Ey istediğini istediği şekilde değiştiren Mübeddil, 4) Ey zorlukları kolaylaştıran Müsehhil, 5) Ey istediğini zelîl kılan ve mahlûkatına boyun eğdiren Müzellil, 6) Ey kitaplar ve bereketler indiren; dilediğinin rütbesini alçaltan Münezzil, 7) Ey kâinattaki bütün işleri döndüren ve kullarını halden hâle sevk eden Muhavvil, 8) Ey her şeyi münâsip şekilde güzelleştiren Mücemmil, 9) Ey her şeyi kemâle erdiren Mükemmil, 10) Ey istediğini istediğine üstün kılan Mufaddıl, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},50:{a:'يَا مَنْ يَرٰى وَ لَا يُرٰى ● يَا مَنْ يَخْلُقُ وَ لَا يُخْلَقُ ● يَا مَنْ يَهْدِى وَ لَا يُهْدٰى ● يَا مَنْ يُحْيِى وَ لَا يُحْيٰى ● يَا مَنْ يُطْعِمُ وَ لَا يُطْعَمُ ● يَا مَنْ يُجِيرُ وَ لَا يُجَارُ ● يَا مَنْ يَقْضِى وَ لَا يُقْضٰى عَلَيْهِ ● يَا مَنْ يَحْكُمُ وَ لَا يُحْكَمُ عَلَيْهِ ● يَا مَنْ لَمْ يَلِدْ وَ لَمْ يُولَدْ ● وَ لَمْ يَكُنْ لَهُ كُفُوًا اَحَدٌ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٥٠﴾',o:'1) Yâ Men yerâ velâ yurâ 2) Yâ Men yahlüku velâ yuhlâk 3) Yâ Men yehdî velâ yuhda 4) Yâ Men yühyî velâ yuhyâ 5) Yâ Men yüt\'imü velâ yut\'am 6) Yâ Men yücîru velâ yucâr 7) Yâ Men yakdî velâ yukdâ \'aleyh 8) Yâ Men yahkümü velâ yuhkemü \'aleyh 9) Yâ Men lem yelid velem yûled 10) Ve lem yekûn lehû küfüven ehad 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey her şeyi gören, fakat kendisi görülmeyen, 2) Ey her şeyi yaratan, fakat kendisi yaratılmayan, 3) Ey her şeye yol gösteren, fakat kendisi yol gösterilmeye muhtaç olmayan, 4) Ey hayat veren, fakat kendisi hayat verilmeye muhtaç olmayan, 5) Ey her şeyi doyuran, fakat kendisi doyurulmaktan münezzeh olan, 6) Ey her şeyi koruyan, fakat kendisi korunmaya muhtaç olmayan, 7) Ey her şey hakkında karar veren, fakat kendisi hakkında hüküm verilmeyen, 8) Ey hüküm veren, fakat kendisi hakkında hüküm verilmeyen, 9) Ey doğurmayan ve doğmayan 10) Ey hiçbir şey kendisine denk olmayan 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},51:{a:'يَا نِعْمَ الْحَبِيبُ ● يَا نِعْمَ الطَّبِيبُ ● يَا نِعْمَ الْحَسِيبُ ● يَا نِعْمَ الْقَرِيبُ ● يَا نِعْمَ الرَّقِيبُ ● يَا نِعْمَ الْمُجِيبُ ● يَا نِعْمَ الْاَنِيسُ ● يَا نِعْمَ الْوَكِيلُ ● يَا نِعْمَ الْمَوْلٰى ● يَا نِعْمَ النَّصِيرُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٥١﴾',o:'1) Yâ Ni\'me\'l-habîb 2) Yâ Ni\'me\'t-tabîb 3) Yâ Ni\'me\'l-hasîb 4) Yâ Ni\'me\'l-karîb 5) Yâ Ni\'me\'r-rakîb 6) Yâ Ni\'me\'l-mucîb 7) Yâ Ni\'me\'l-enîs 8) Yâ Ni\'me\'l-vekîl 9) Yâ Ni\'me\'l-mevlâ 10) Yâ Ni\'me\'n-nasîr 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey en güzel Sevgili, 2) Ey en güzel Tabip, 3) Ey en güzel hesap gören, 4) Ey en güzel Yakın, 5) Ey en güzel Gözetleyici, 6) Ey en güzel Cevap Veren, 7) Ey en güzel Dost, 8) Ey en güzel Vekîl, 9) Ey en güzel Efendi, 10) Ey en güzel Yardımcı, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},52:{a:'يَا سُرُورَ الْعَارِفِينَ ● يَٓا اَنِيسَ الْمُرِيدِينَ ● يَا مُغِيثَ الْمُشْتَاقِينَ ● يَا حَبِيبَ التَّوَّابِينَ ● يَا رَازِقَ الْمُقِلِّينَ ● يَا رَجَٓاءَ الْمُذْنِبِينَ ● يَا كَاشِفَ الْمَكْرُوبِينَ ● يَا مُنَفِّسًا عَنِ الْمَغْمُومِينَ ● يَا مُفَرِّجًا عَنِ الْمَحْزُونِينَ ● يَٓا اِلٰهَ الْاَوَّلِينَ وَ اْلاٰخِرِينَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٥٢﴾',o:'1) Yâ Sürûra\'l-\'ârifîn 2) Yâ Enîse\'l-mürîdîn 3) Yâ Muğîse\'l-müştâkîn 4) Yâ Habîbe\'t-tevvâbîn 5) Yâ Râzika\'l-mükillîn 6) Yâ Recâe\'l-müznibîn 7) Yâ Kâşife\'l-mekrûbîn 8) Yâ Muneffisen \'ani\'l-mağmûmîn 9) Yâ Muferricen \'ani\'l-mahzûnîn 10) Yâ İlâhe\'l-evvelîne ve\'l-âhirîn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey kendisini tanıyanların sevinci, 2) Ey kendisini arzulayanların dostu, 3) Ey kendisine müştâk olanların imdâdına koşan, 4) Ey tövbekârların sevgilisi, 5) Ey ihtiyaç sahiplerine rızık veren, 6) Ey günahkârların ümidi, 7) Ey sıkıntıda olanların ferahlatıcısı, 8) Ey gamlılara nefes aldıran, 9) Ey mahzunlara kurtuluş yolu gösteren, 10) Ey evvel ve âhirlerin ilâhı, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},53:{a:'يَا رَبَّ الْجَنَّةِ وَ النَّارِ ● يَا رَبَّ النَّبِيِّينَ وَ الْاَخْيَارِ ● يَا رَبَّ الصِّدّ۪يقِينَ وَ الْاَبْرَارِ ● يَا رَبَّ الصِّغَارِ وَ الْكِبَارِ ● يَا رَبَّ الْحُبُوبِ وَ الْاَثْمَارِ ● يَا رَبَّ الْاَنْهَارِ وَ الْاَشْجَارِ ● يَا رَبَّ الصَّحَارٰى وَ الْقِفَارِ ● يَا رَبَّ الْعَبِيدِ وَ الْاَحْرَارِ ● يَا رَبَّ اْلاِعْلَانِ وَ اْلاِسْرَارِ ● يَا رَبَّ الَّيْلِ وَ النَّهَارِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٥٣﴾',o:'1) Yâ Rabbe\'l-cenneti ve\'n-nâr 2) Yâ Rabbe\'n-nebiyyîne ve\'l-ahyâr 3) Yâ Rabbe\'s-sıddîkîne ve\'l-ebrâr 4) Yâ Rabbe\'s-siğâri ve\'l-kibâr 5) Yâ Rabbe\'l-hubûbi ve\'l-eşmâr 6) Yâ Rabbe\'l-enhâri ve\'l-eşcâr 7) Yâ Rabbe\'s-sahârâ ve\'l-kıfâr 8) Yâ Rabbe\'l-\'abîdi ve\'l-ahrâr 9) Yâ Rabbe\'l-i\'lâni ve\'l-isrâr 10) Yâ Rabbe\'l-leyli ve\'n-nehâr 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey Cennet ve Cehennemin Rabbi, 2) Ey peygamberler ve hayırlıların Rabbi, 3) Ey Sıddıkların ve iyilerin Rabbi, 4) Ey küçüklerin ve büyüklerin Rabbi, 5) Ey dânelerin ve meyvelerin Rabbi, 6) Ey nehirlerin ve ağaçların Rabbi, 7) Ey sahraların ve çöllerin Rabbi, 8) Ey kölelerin ve hürlerin Rabbi, 9) Ey açığa çıkarma ve gizlemelerin Rabbi, 10) Ey gece ve gündüzün Rabbi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},54:{a:'يَا مَنْ لَحِقَ كُلِّ شَىْءٍ عِلْمُهُ ● يَا مَنْ نَفَذَ بِكُلِّ شَىْءٍ بَصَرُهُ ● يَا مَنْ بَلَغَتْ اِلٰى كُلِّ شَىْءٍ قُدْرَتُهُ ● يَا مَنْ لَا يُحْصِى الْعِبَادُ نَعْمَٓائَهُ ● يَا مَنْ لَا تَبْلُغُ الْخَلَٓائِقُ شُكْرَهُ ● يَا مَنْ لَا تُدْرِكُ الْاَفْهَامُ جَلَالَهُ ● يَا مَنْ لَا تَنَالُ الْاَوْهَامُ كُنْهَهُ ● يَا مَنِ الْعَظَمَةُ وَ الْكِبْرِيَٓاءُ رِدَٓاؤُهُ ● يَا مَنِ الْهَيْبَةُ وَ السُّلْطَانُ بَهَٓاؤُهُ ● يَا مَنْ تَعَزَّزَ بِالْعِزِّ بَقَٓاؤُهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٥٤﴾',o:'1) Yâ Men lahika külli şey\'in \'ilmüh 2) Yâ Men nefeze bi külli şey\'in besaruh 3) Yâ Men beleğat ilâ külli şey\'in kudratüh 4) Yâ Men lâ yuhsı\'l-\'ibâdü na\'mâeh 5) Yâ Men lâ teblüğu\'l-halâiku şükrah 6) Yâ Men lâ tüdrikü\'l-efhâmü celâleh 7) Yâ Men lâ tenâlü\'l-evhâmü künheh 8) Yâ Meni\'l-\'azâmetü ve\'l-kibriyâü ridâüh 9) Yâ Meni\'l-heybetü ve\'s-sültânü behâüh 10) Yâ Men te\'azzeze bi\'l-\'izzi bekâüh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey ilmi her şeye ulaşan, 2) Ey basarı her şeye nüfûz eden, 3) Ey kudreti her şeye bâliğ olan, 4) Ey nîmetleri sayılamayan, 5) Ey mahlûkatın gerçek şükrüne erişemediği, 6) Ey zihinlerin, yüceliğini idrak edemediği, 7) Ey hayallerin, hakîkatine erişemediği, 8) Ey azamet ve kibriyâ örtüsü olan, 9) Ey heybet ve saltanat güzelliği olan, 10) Ey bekası izzetle yücelenen 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},55:{a:'يَا مَنْ لَهُ الْمَثَلُ الْاَعْلٰى ● يَا مَنْ لَهُ الصِّفَاتُ الْعُلٰى ● يَا مَنْ لَهُ اْلاٰخِرَةُ وَ اْلاُولٰى ● يَا مَنْ لَهُ الْجَنَّةُ الْمَاْوٰى ● يَا مَنْ لَهُ النَّارُ وَ اللَّظٰى ● يَا مَنْ لَهُ اْلاٰيَاتُ الْكُبْرٰى ● يَا مَنْ لَهُ الْاَسْمَٓاءُ الْحُسْنٰى ● يَا مَنْ لَهُ الْحُكْمُ وَ الْقَضَٓاءُ ● يَا مَنْ لَهُ السَّمٰوَاتُ الْعُلٰى ● يَا مَنْ لَهُ الْعَرْشُ وَ الثَّرٰى ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٥٥﴾',o:'1) Yâ Men lehü\'l-meşelü\'l-a\'lâ 2) Yâ Men lehü\'l-sıfâtü\'l-\'ulâ 3) Yâ Men lehü\'l-âhiratü ve\'l-ûlâ 4) Yâ Men lehü\'l-cennetü\'l-me\'vâ 5) Yâ Men lehü\'n-nâru ve\'l-lezâ 6) Yâ Men lehü\'l-âyâtü\'l-kübrâ 7) Yâ Men lehü\'l-esmâü\'l-hüsnâ 8) Yâ Men lehü\'l-hükmü ve\'l-kadâ 9) Yâ Men lehü\'s-semâvâtü\'l-\'ulâ 10) Yâ Men lehü\'l-\'arşü ve\'s-serâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey en yüce misâller Kendisine ait olan, 2) Ey en yüce sıfatlar Kendisine ait olan, 3) Ey âhiret ve dünya Kendisine âit olan, 4) Ey Cennetül-Mevâ\'nın sahibi, 5) Ey Cehennem ve ateşin sahibi, 6) Ey en büyük âyetler sahibi, 7) Ey en güzel isimler sahibi, 8) Ey hüküm ve kazâ sahibi, 9) Ey yüce göklerin sahibi, 10) Ey arş ve yerin sahibi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},56:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا عَفُوُّ ● يَا غَفُورُ ● يَا وَدُودُ ● يَا شَكُورُ ● يَا صَبُورُ ● يَا رَؤُفُ ● يَا عَطُوفُ ● يَا قُدُّوسُ ● يَا حَىُّ ● يَا قَيُّومُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٥٦﴾',o:'1) Ve es\'elüke biesmâike Yâ\'Afüvv 2) Yâ Ğafûr 3) Yâ Vedûd 4) Yâ Şekûr 5) Yâ Sabûr 6) Yâ Rauf 7) Yâ\'Atûf 8) Yâ Kuddûs 9) Yâ Hayy 10) Yâ Kayyûm 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey kullarını çok çok affeden Afüvv, 2) Ey kullarının günahlarını bağışlayan Gafûr, 3) Ey itaatkâr kullarını çok seven Vedûd, 4) Ey rızâsı için yapılan işleri bol sevapla karşılayan Şekûr, 5) Ey âsileri hemen cezâlandırmayıp, çok sabreden Sabûr, 6) Ey kullarına çok şefkat edip esirgeyen Raûf, 7) Ey kullarına karşı pek merhametli olan Atûf, 8) Ey bütün mahlûkatı maddî ve manevî kirlerden arındıran Kuddüs, 9) Ey gerçek hayat sahibi olan Hayy, 10) Ey gökleri, yeri ve bütün mahlûkatı ayakta tutan Kayyûm, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},57:{a:'يَا مَنْ هُوَ فِى السَّمَٓاءِ عَظَمَتُهُ ● يَا مَنْ هُوَ فِى الْاَرْضِ اٰيَاتُهُ ● يَا مَنْ هُوَ فِى كُلِّ شَىْءٍ دَلَٓائِلُهُ ● يَا مَنْ هُوَ فِى الْبِحَارِ عَجَٓائِبُهُ ● يَا مَنْ يَبْدَؤُ الْخَلْقَ ثُمَّ يُعِيدُهُ ● يَا مَنْ هُوَ فِى الْجِبَالِ خَزَٓائِنُهُ ● يَا مَنْ اَحْسَنَ كُلَّ شَىْءٍ خَلَقَهُ ● يَا مَنْ اِلَيْهِ يُرْجَعُ الْاَمْرُ كُلُّهُ ● يَا مَنْ ظَهَرَ فِى كُلِّ شَىْءٍ لُطْفُهُ ● يَا مَنْ يُعَرِّفُ الْخَلَٓائِقَ قُدْرَتَهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٥٧﴾',o:'1) Yâ Men hüve fı\'s-semâi \'azametüh 2) Yâ Men hüve fi\'l-ardi âyâtüh 3) Yâ Men hüve fî külli şey\'in delâilüh 4) Yâ Men hüve fi\'l-bihâri \'acâibüh 5) Yâ Men yebdeü\'l-halka sümme yü\'îdüh 6) Yâ Men hüve fi\'l-cibâli hazâinüh 7) Yâ Men ahsene külle şey\'in halekah 8) Yâ Men ileyhi yürce\'u\'l-emrü küllüh 9) Yâ Men zahera fî külli şey\'in lütfülı 10) Yâ Men yü\'arrifü\'l-halâika kudrateh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey semâda azameti görülen, 2) Ey yerde âyetleri tecellî eden, 3) Ey her şeyde delilleri bulunan, 4) Ey denizde acâip sanatları bulunan, 5) Ey mahlûkatı ilk defa yaratıp, öldükten sonra tekrar dirilten, 6) Ey dağlarda hazineleri bulunan, 7) Ey yarattığı her şeyi en güzel yapan, 8) Ey bütün işler kendisine dönen, 9) Ey her şeyde lütfü açıkça görünen, 10) Ey mahlûkatına kudretini tanıtan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},58:{a:'يَا حَبِيبَ مَنْ لَا حَبِيبَ لَهُ ● يَا طَبِيبَ مَنْ لَا طَبِيبَ لَهُ ● يَا مُجِيبَ مَنْ لَا مُجِيبَ لَهُ ● يَا شَفِيقَ مَنْ لَا شَفِيقَ لَهُ ● يَا رَفِيقَ مَنْ لَا رَفِيقَ لَهُ ● يَا شَفِيعَ مَنْ لَا شَفِيعَ لَهُ ● يَا مُغِيثَ مَنْ لَا مُغِيثَ لَهُ ● يَا دَلِيلَ مَنْ لَا دَلِيلَ لَهُ ● يَا قَٓائِدَ مَنْ لَا قَٓائِدَ لَهُ ● يَا رَاحِمَ مَنْ لَا رَاحِمَ لَهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٥٨﴾',o:'1) Yâ Habîbe men lâ habîbe leh 2) Yâ Tabîbe men lâ tabîbe leh 3) Yâ Mucîbe men lâ mücîbe leh 4) Yâ Şefîka men lâ şefîka leh 5) Yâ Rafîka men lâ rafîka leh 6) Yâ Şefî\'a men lâ şefî\'a leh 7) Yâ Muğîse men lâ müğîse leh 8) Yâ Delîle men lâ delîle leh 9) Yâ Kaide men lâ kaide leh 10) Yâ Râhıme men lâ râhıme leh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey sevgilisi olmayanların sevgilisi, 2) Ey tabibi olmayanların tabibi, 3) Ey isteklerini dinleyip cevap verecek kimsesi olmayanların Mucîbi, 4) Ey şefkat edecek kimsesi olmayanların şefkat edicisi, 5) Ey arkadaşı olmayanların arkadaşı, 6) Ey şefaat edecek kimsesi olmayanların Şefîi, 7) Ey imdâdına koşacak kimsesi olmayanların imdat edicisi, 8) Ey yol gösterecek kimsesi olmayanların yol göstericisi, 9) Ey rehberi olmayanların rehberi, 10) Ey merhamet edecek kimsesi olmayanların merhamet edicisi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},59:{a:'يَا كَافِىَ مَنِ اسْتَكْفَاهُ ● يَا هَادِىَ مَنِ اسْتَهْدَاهُ ● يَا كَالِىَ مَنِ اسْتَكْلَاهُ ● يَا دَاعِىَ مَنِ اسْتَدْعَاهُ ● يَا شَافِىَ مَنِ اسْتَشْفَاهُ ● يَا قَاضِىَ مَنِ اسْتَقْضَاهُ ● يَا مُغْنِىَ مَنِ اسْتَغْنَاهُ ● يَا مُوفِىَ مَنِ اسْتَوْفَاهُ ● يَا مُقَوِّىَ مَنِ اسْتَقْوَاهُ ● يَا وَلِىَّ مَنِ اسْتَوْلَاهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٥٩﴾',o:'1) Yâ Kâfiye meni\'stekfâh 2) Yâ Hâdiye meni\'stehdâh 3) Yâ Kâliye meni\'steklâh 4) Yâ Dâ\'iye meni\'sted\'âh 5) Yâ Şâfıye meni\'steşfâh 6) Yâ Kâdiye meni\'stakdâh 7) Yâ Muğniye meni\'steğnâh 8) Yâ Mûfîye meni\'stevfâh 9) Yâ Mukavviye meni\'stakvâh 10) Yâ Veliyye meni\'stevlâh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Ey Kendisini her şeye bedel yeter görenlerin Kâfisi, 2) Ey Kendisinden hidâyet isteyenlerin hidâyet edicisi, 3) Ey gizlenecek yer arayanların üstünü örten, 4) Ey Kendisini çağıranları Cennetine dâvet eden, 5) Ey Kendisinden şifa isteyene şifa veren, 6) Ey Kendisinden hükmetmesini isteyenler hakkında hükmeden, 7) Ey maddi ve manevi zenginlik isteyenleri zenginleştiren, 8) Ey Kendisinden her ihtiyacını yerine getirmesini isteyenlerin ihtiyaçlarına yeterli cevap veren, 9) Ey kuvvet ve güç isteyenlere kâfi kuvvet veren, 10) Ey Kendisinden dostluk ve sahiplik isteyenlerin dost ve sahibi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},60:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَٓا اَوَّلُ ● يَٓا اٰخِرُ ● يَا ظَاهِرُ ● يَا بَاطِنُ ● يَا خَالِقُ ● يَا رَازِقُ ● يَا صَادِقُ ● يَا سَابِقُ ● يَا سَٓائِقُ ● يَا فَالِقُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ اَجِرْنَا مِنَ النَّارِ ﴿٦٠﴾',o:'1) Ve es\'elüke biesmâike Yâ Evvel 2) Yâ Âhir 3) Yâ Zahir 4) Yâ Bâtın 5) Yâ Halik 6) Yâ Râzik 7) Yâ Sâdık 8) Yâ Sabık 9) Yâ Saik 10) Yâ Fâlik 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne ecirnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey her şeyden önce olan Evvel, 2) Ey her şeyden sonra olan Âhir, 3) Ey varlığı apaçık görünen Zâhir, 4) Ey her şeyin içyüzünden haberdar olan Bâtın, 5) Ey her şeyi yoktan yaratan Hâlık, 6) Ey her şeyi münâsip bir şekilde rızıklandıran Râzık, 7) Ey her işi doğru olan ve sözünü yerine getiren Sâdık, 8) Ey varlığı her şeyden önce olan Sâbık, 9) Ey her şeyi mukadder hedefine sevk eden Sâik, 10) Ey tohum ve çekirdekleri yarıp sümbüllendiren Fâlık, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},61:{a:'يَا مَنْ يُقَلِّبُ الَّيْلَ وَ النَّهَارَ ● يَا مَنْ خَلَقَ الظُّلُمَاتِ وَ النُّورَ ● يَا مَنْ جَعَلَ الظِّلَّ وَ الْحَرُورَ ● يَا مَنْ سَخَّرَ الشَّمْسَ وَ الْقَمَرَ ● يَا مَنْ خَلَقَ الْمَوْتَ وَ الْحَيٰوةَ ● يَا مَنْ لَهُ الْخَلْقُ وَ الْاَمْرُ ● يَا مَنْ لَمْ يَتَّخِذْ صَاحِبَةً وَ لَا وَلَدًا ● يَا مَنْ لَمْ يَكُنْ لَهُ شَرِيكٌ فِى الْمُلْكِ ● يَا مَنْ لَمْ يَكُنْ لَهُ وَلِىٌّ مِنَ الذُّلِّ ● يَا مَنْ لَهُ الْحَوْلُ وَ الْقُوَّةُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٦١﴾',o:'1) Yâ Men yükallibü\'l-leyle ve\'n-nehâr 2) Yâ Men Halaka\'z-zulümâti ve\'n-nûr 3) Yâ Men ce\'ale\'z-zılle ve\'l-harur 4) Yâ Men sehhara\'s-semse ve\'l-kamer 5) Yâ Men haleka\'l-mevte ve\'l-hayah 6) Yâ Men lehü\'l-halku ve\'l-emr 7) Yâ Men lem yettehiz sâhibeten velâ veledâ 8) Yâ Men lem yekûn lehû şerikim fi\'l-mülk 9) Yâ Men lem yekûn lehû veliyyün mine\'z-züll 10) Yâ men lehü\'l-havlü ve\'l-kuvveh 11) Sübhâneke yâ lâ ilahe illâ enteİ-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey gece ve gündüzü peş peşe değiştiren, 2) Ey karanlıkları ve nûru yaratan, 3) Ey gölgeleri ve harâreti meydana getiren, 4) Ey güneş ve aya boyun eğdiren, 5) Ey ölümü ve hayatı yaratan, 6) Ey yaratmak ve emretmek Kendisine âit olan, 7) Ey eş ve evlât edinmeyen, 8) Ey mülkünde hiçbir şerîki olmayan, 9) Ey zilletten münezzeh olduğu için dosta ihtiyacı olmayan, 10) Ey havl ve kuvvet kendisine âit olan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},62:{a:'يَا مَنْ يَعْلَمُ مُرَادَ الْمُرِيدِينَ ● يَا مَنْ يَمْلِكُ حَوَٓائِجَ السَّٓائِلِينَ ● يَا مَنْ يَسْمَعُ اَنِينَ الْوَالِهِينَ ● يَا مَنْ يَرٰى بُكَٓاءَ الْخَٓائِفِينَ ● يَا مَنْ يَعْلَمُ ضَمِيرَ الصَّامِتِينَ ● يَا مَنْ يَرٰى نَدَمَ النَّادِمِينَ ● يَا مَنْ يَقْبَلُ عُذْرَ التَّٓائِبِينَ ● يَا مَنْ لَا يُصْلِحُ عَمَلَ الْمُفْسِدِينَ ● يَا مَنْ لَا يُضِيعُ اَجْرَ الْمُحْسِنِينَ ● يَا مَنْ لَا يَبْعُدُ عَنْ قُلُوبِ الْعَارِفِينَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٦٢﴾',o:'1) Yâ Men ya\'lemü mürâde\'l-mürîdîn 2) Yâ Men yemlikü havaice\'s-sâilîn 3) Yâ Men yesme\'u enîne\'l-valihîn 4) Yâ Men yerâ bükâe\'l-hâifîn 5) Yâ Men ya\'lemu damîra\'s-sâmitîn 6) Yâ Men yerâ nedeme\'n-nâdimîn 7) Yâ Men yakbelü \'uzre\'t-tâibîn 8) Yâ Men lâ yuslihu \'amele\'l-müfsidîn 9) Yâ Men lâ yudî\'u ecra\'l-muhsinîn 10) Yâ Men lâ yeb\'udü an kulûbi\'l-\'arifîn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey Kendisini arzulayanların murâdını bilen, 2) Ey Kendisinden dilekte bulunanların ihtiyaç duyduklarına sahip olan, 3) Ey üzüntüsünden kendinden geçenlerin inlemelerini işiten, 4) Ey Kendisinden korkarak ağlayanların ağlayışını gören, 5) Ey suskunların içinden geçenleri bilen, 6) Ey günahlarından pişmanlık duyanların nedâmetini gören, 7) Ey tövbekârların özrünü kabul eden, 8) Ey fesatçıların işini düzeltmeyen, 9) Ey iyilik yapanların mükâfatını zâyi etmeyen, 10) Ey Kendisini tanıyanların kalplerinden uzaklaşmayan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},63:{a:'يَا دَٓائِمَ الْبَقَٓاءِ ● يَا غَافِرَ الْخَطَٓاءِ ● يَا سَامِعَ الدُّعَٓاءِ ● يَا وَاسِعَ الْعَطَٓاءِ ● يَا رَافِعَ السَّمَٓاءِ ● يَا كَاشِفَ الْبَلَٓاءِ ● يَاعَظِيمَ الثَّنَٓاءِ ● يَا قَدِيمَ السَّنَٓاءِ ● يَا كَثِيرَ الْوَفَٓاءِ ● يَا شَرِيفَ الْجَزَٓاءِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٦٣﴾',o:'1) Yâ Dâime\'l-bekâ 2) Yâ Ğafira\'l-hatâ 3) Yâ Sâmi\'e\'d-düâ 4) Yâ Vâsi\'a\'l-\'atâ 5) Yâ Râfı\'a\'s-semâ 6) Yâ Kâşife\'l-belâ 7) Yâ \'Azîme\'s-senâ 8) Yâ Kadîme\'s-senâ 9) Yâ Keşira\'l-vefa 10) Yâ Şerîfe\'l-cezâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey bekası dâim olan, 2) Ey hatâları bağışlayan, 3) Ey duâları işiten, 4) Ey ihsânı geniş olan, 5) Ey gökleri yükselten, 6) Ey belâları defeden, 7) Ey medih ve senâsı büyük olan, 8) Ey varlığının parıltısı kadîm olan, 9) Ey vefâsı çok olan, 10) Ey mükâfatı şerefli olan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},64:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا غَفَّارُ ● يَا سَتَّارُ ● يَا قَهَّارُ ● يَا جَبَّارُ ● يَا صَبَّارُ ● يَا رَزَّاقُ ● يَا فَتَّاحُ ● يَا عَلَّا مُ ● يَا وَهَّابُ ● يَا تَوَّابُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٦٤﴾',o:'1) Ve es\'elüke biesmâike Yâ Ğaffâr 2) Yâ Settâr 3) Yâ Kahhâr 4) Yâ Cebbar 5) Yâ Sabbâr 6) Yâ Razzâk 7) Yâ Fettâh 8) Yâ \'Allâm 9) Yâ Vehhâb 10) Yâ Tevvâb 11) Sübhâneke yâ lâ ilahe illâ ente\'l ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey çok affeden Gaffâr, 2) Ey bütün ayıpları örten Settâr, 3) Ey her şeye galip gelen ve bütün düşmanlarını kahreden Kahhâr, 4) Ey istediğini zorla yaptıran Cebbâr, 5) Ey çok sabreden ve kullarına sabır gücü veren Sabbâr, 6) Ey bütün rızka muhtaç olanları rızıklandıran Rezzâk, 7) Ey her şeyi hikmetle açan Fettâh, 8) Ey her şeyi çok iyi bilen Allâm, 9) Ey bol bol hediyeler veren Vehhâb, 10) Ey bütün tövbeleri kabul eden Tevvâb, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},65:{a:'يَا مَنْ خَلَقَنِى وَ سَوَّانِى ● يَا مَنْ رَزَقَنِى وَ رَبَّانِى ● يَا مَنْ اَطْعَمَنِى وَ سَقَانِى ● يَا مَنْ قَرَّبَنِى وَ اَدْنَانِى ● يَا مَنْ عَصَمَنِى وَ كَفَانِى ● يَا مَنْ حَفِظَنِى وَ كَلَانِى ● يَا مَنْ وَفَّقَنِى وَ هَدَانِى ● يَا مَنْ اَعَزَّنِى وَ اَغْنَانِى ● يَا مَنْ اَمَاتَنِى وَ اَحْيَانِى ● يَا مَنْ اٰنَسَنِى وَ اٰوَانِى ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٦٥﴾',o:'1) Yâ Men halekanî ve sevvânî 2) Yâ Men razekanî ve rabbânî 3) Yâ Men et\'amenî ve sekânî 4) Yâ Men karrabenî ve ednânî 5) Yâ Men \'asamenî ve kefânî 6) Yâ Men hafızanî ve kelânî 7) Yâ Men veffekanî ve hedânî 8) Yâ Men e\'azzenî ve ağnânî 9) Yâ Men emâtenî ve ahyânî 10) Yâ Men ânesenî ve âvânî 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey beni yaratıp âzâlarımı düzene koyan, 2) Ey bana rızık veren ve terbiye eden, 3) Ey beni yedirip içiren, 4) Ey beni kendisine yaklaştırıp yakın kılan, 5) Ey beni günah tehlikelerinden koruyup bana kâfi gelen, 6) Ey beni muhafaza edip ayıplarımı örten, 7) Ey bana tevfîk edip hidâyet eden, 8) Ey beni azîz kılıp ihtiyaçlarımı gideren, 9) Ey beni öldürüp dirilten, 10) Ey bana ünsiyet verip rızıklandıran, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},66:{a:'يَا مَنْ يُحِقُّ الْحَقَّ بِكَلِمَاتِهِ ● يَا مَنْ لَا مُعَقِّبَ لِحُكْمِهِ ● يَا مَنْ لَا رَٓادَّ لِقَضَٓائِهِ ● يَا مَنْ يَحُولُ بَيْنَ الْمَرْءِ وَ قَلْبِهِ ● يَا مَنْ يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ ● يَا مَنْ لَا تَنْفَعُ الشَّفَاعَةُ اِلَّا بِاِذْنِهِ ● يَا مَنِ السَّمٰوَاتُ مَطْوِيَّاتٌ بِيَمِينِهِ ● يَا مَنْ هُوَ اَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ ● يَا مَنْ يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَ الْمَلَٓئِكَةُ مِنْ خِيفَتِهِ ● يَا مَنْ يُرْسِلُ الرِّيَاحَ بُشْرًا بَيْنَ يَدَىْ رَحْمَتِهِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٦٦﴾',o:'1) Yâ Men yühikku\'l-hakka bikelimâtih 2) Yâ Men lâ mü\'akkibe lihukmih 3) Yâ Men lâ radde likadâih 4) Yâ Men yehûlü beyne\'l-mer\'i ve kalbih 5) Yâ Men yakbelü\'t-tevbete an \'ibâdih 6) Yâ Men lâ tenfe\'u\'ş-şefa\'atü illâ biiznih 7) Yâ Meni\'s-semâvâtü matviyyâtün biyemînih 8) Yâ Men hüve a\'lemü bi men dalle \'an sebîlih 9) Yâ Men yüsebbihu\'r-ra\'dü bihâmdi-hi ve\'l-melâiketü min hîfetih 10) Yâ Men yürsilü\'r-riyâha büşran beyne yedey rahmetih 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey kelimeleriyle hakkın hak olduğunu gösteren, 2) Ey hükmünü geri bıraktıracak kimse olmayan, 3) Ey kazâsını geri çevirecek kimse olmayan, 4) Ey kişiye kalbinden daha yakın olan, 5) Ey kullarından tövbeyi kabul eden, 6) Ey izni olmadan hiçbir şefaat fayda vermeyen, 7) Ey bütün gökler kudretiyle dürülmüş olan, 8) Ey yolundan sapanları en iyi bilen, 9) Ey gök gürültüsünün hamd ederek, meleklerin de korkusuyla Kendisini tesbih ettiği, 10) Ey rahmetinin önünde rüzgârları müjdeci gönderen, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},67:{a:'يَا مَنْ جَعَلَ الْاَرْضَ مِهَادًا ● يَا مَنْ جَعَلَ الْجِبَالَ اَوْتَادًا ● يَا مَنْ جَعَلَ الشَّمْسَ سِرَاجًا ● يَا مَنْ جَعَلَ الْقَمَرَ نُورًا ● يَا مَنْ جَعَلَ الَّيْلَ لِبَاسًا ● يَا مَنْ جَعَلَ النَّهَارَ مَعَاشًا ● يَا مَنْ جَعَلَ النَّوْمَ سُبَاتًا ● يَا مَنْ جَعَلَ السَّمَٓاءَ بِنَٓاءً ● يَا مَنْ جَعَلَ الْاَشْيَٓاءَ اَزْوَاجًا ● يَا مَنْ جَعَلَ النَّارَ مِرْصَادًا ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٦٧﴾',o:'1) Yâ Men ce\'ale\'l-arda mihâdâ 2) Yâ Men ce\'ale\'l-cibâle evtâdâ 3) Yâ Men ce\'ale\'l-şemse sirâcâ 4) Yâ Men ce\'ale\'l-kamera nûrâ 5) Yâ Men ce\'ale\'l-leyle libâsa 6) Yâ Men ce\'ale\'n-nehâra me\'âşâ 7) Yâ Men ce\'ale\'n-nevme sübâtâ 8) Yâ Men ce\'ale\'s-semâe binâa 9) Yâ Men ce\'ale\'l-eşyâe ezvâcâ 10) Yâ Men ce\'ale\'n-nâra mirsâdâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey yeri beşik yapan, 2) Ey dağları direk yapan, 3) Ey güneşi kandil kılan, 4) Ey ay\'ı nur kılan, 5) Ey geceyi örtü yapan, 6) Ey gündüzü maîşet zamanı yapan, 7) Ey uykuyu huzur ve sükûn vasıtası kılan, 8) Ey semâyı bina kılan, 9) Ey eşyayı çift çift yaratan, 10) Ey ateşi gözcü kılan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},68:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا شَفِيعُ ● يَا سَمِيعُ ● يَا رَفِيعُ ● يَا مَنِيعُ ● يَا بَدِيعُ ● يَا سَرِيعُ ● يَا بَشِيرُ ● يَا نَذِيرُ ● يَا قَدِيرُ ● يَا مُقْتَدِرُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٦٨﴾',o:'1) Ve es\'elüke biesmâike Yâ Şefî\' 2) Yâ Semî\' 3) Yâ Rafı\' 4) Yâ Meni\' 5) Yâ Bedi\' 6) Yâ Serî\' 7) Yâ Beşîr 8) Yâ Nezîr 9) Yâ Kadîr 10) Yâ Muktedir 11) Sübhâneke yâ lâ ilahe illâ ente\'l-em ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey gerçek şefaat sahibi Şefî, 2) Ey gizli açık her sesi işiten Semî, 3) Ey istediğini yükselten Rafî, 4) Ey istediğini engelleyen Menî, 5) Ey kâinatı en güzel bir şekilde yoktan yaratan Bedî, 6) Ey hesâbı en süratli bir şekilde gören Serî, 7) Ey sevdiklerini Cennet ve çeşitli mükâfatlarla müjdeleyen Beşîr, 8) Ey kullarını itaate sevk etmek için azâbıyla korkutan Nezîr, 9) Ey sonsuz kudret sahibi olan Kadîr, 10) Ey her şeye gücü yeten Muktedir, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},69:{a:'يَا حَىُّ قَبْلَ كُلِّ حَىٍّ ● يَا حَىُّ بَعْدَ كُلِّ حَىٍّ ● يَا حَىُّ الَّذِى لَا يُشْبِهُهُ شَىْءٌ ● يَا حَىُّ الَّذِى لَيْسَ كَمِثْلِهِ حَىٌّ ● يَا حَىُّ الَّذِى لَا يُشَارِكُهُ حَىٌّ ● يَا حَىُّ الَّذِى لَا يَحْتَاجُ اِلٰى حَىٍّ ● يَا حَىُّ الَّذِى يُمِيتُ كُلَّ حَىٍّ ● يَا حَىُّ الَّذِى يَرْزُقُ كُلَّ حَىٍّ ● يَا حَىُّ الَّذِى يُحْيِى الْمَوْتٰى ● يَا حَىُّ الَّذِى لَا يَمُوتُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٦٩﴾',o:'1) Yâ Hayyü kable külli hayy 2) Yâ Hayyü ba\'de külli hayy 3) Yâ Hayyü\'llezî lâ yuşbihühû şey\' 4) Yâ Hayyü\'llezî leyse kemislihî hayy 5) Yâ Hayyü\'llezî lâ yuşârikühû hayy 6) Yâ Hayyü\'llezî lâ yahtâcü ilâ hayy 7) Yâ Hayyü\'llezî yümîtü külle hayy 8) Yâ Hayyü\'llezî yerzüku külle hayy 9) Yâ Hayyü\'llezî yühyi\'l-mevtâ 10) Yâ Hayyü\'llezî lâ yemût 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey bütün dirilerden önce var olan gerçek hayat sahibi, 2) Ey bütün dirilerden sonra bâkî kalacak gerçek hayat sahibi, 3) Ey hiçbir şeyin Kendisine benzemediği gerçek hayat sahibi, 4) Ey hiçbir dirinin misli gibi olmadığı gerçek hayat sahibi, 5) Ey hiçbir dirinin Kendisine ortak olmadığı gerçek hayat sahibi, 6) Ey hiçbir diriye muhtaç olmayan gerçek hayat sahibi, 7) Ey bütün dirileri öldüren gerçek hayat sahibi, 8) Ey bütün dirileri rızıklandıran gerçek hayat sahibi, 9) Ey ölüleri dirilten gerçek hayat sahibi, 10) Ey hiç ölmeyecek olan gerçek hayat sahibi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},70:{a:'يَا مَنْ لَهُ ذِكْرٌ لَا يُنْسٰى ● يَا مَنْ لَهُ نُورٌ لَا يُطْفٰى ● يَا مَنْ لَهُ ثَنَٓاءٌ لَا يُحْصٰى ● يَا مَنْ لَهُ نُعُوتٌ لَا تُغَيَّرُ ● يَا مَنْ لَهُ نِعَمٌ لَا تُعَدُّ ● يَا مَنْ لَهُ مُلْكٌ لَا يَزُولُ ● يَا مَنْ لَهُ جَلَالٌ لَا يُكَيَّفُ ● يَا مَنْ لَهُ قَضَٓاءٌ لَا يُرَدُّ ● يَا مَنْ لَهُ صِفَاتٌ لَا تُبَدَّلُ ● يَا مَنْ لَهُ كَمَالٌ لَا يُدْرَكُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٧٠﴾',o:'1) Yâ Men lehû zikrun lâ yunsâ 2) Yâ Men lehû nurun lâ yutfâ 3) Yâ Men lehû şenâün lâ yuhsâ 4) Yâ Men lehû nü\'ûtün lâ tüğayyer 5) Yâ Men lehû ni\'amün lâ tü\'add 6) Yâ Men lehû mülkün lâ yezûl 7) Yâ Men lehû celâlün lâ yukeyyef 8) Yâ Men lehû kadâün lâ yuradd 9) Yâ Men lehû sıfâtün lâ tübeddel 10) Yâ Men lehû kemâlün lâ yudrak 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey unutulmayan ve unutturulmayan zikrin sahibi, 2) Ey söndürülemeyen nûrun sahibi, 3) Ey had ve hesâba gelmeyen medih ve senâ sahibi, 4) Ey hiçbir şekilde değiştirilemeyen vasıflar sahibi, 5) Ey sayılamayan nîmetler sahibi, 6) Ey zevâl bulmayan saltanat sahibi, 7) Ey gerçek keyfiyeti anlaşılamayan celâl sahibi, 8) Ey reddedilemeyen hüküm sahibi, 9) Ey tebdil edilemeyen sıfatlar sahibi, 10) Ey tam idrak edilemeyen kemâl sahibi, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},71:{a:'يَا رَبَّ الْعَالَمِينَ ● يَا مَالِكَ يَوْمِ الدّ۪ينِ ● يَا مَنْ يُحِبُّ الصَّابِرِينَ ● يَا مَنْ يُحِبُّ التَّوَّابِينَ ● يَا مَنْ يُحِبُّ الْمُتَطَهِّرِينَ ● يَا مَنْ يُحِبُّ الْمُحْسِنِينَ ● يَا مَنْ هُوَ خَيْرُ النَّاصِرِينَ ● يَا مَنْ هُوَ خَيْرُ الْفَاصِلِينَ ● يَا مَنْ هُوَ خَيْرُ الشَّاكِرِينَ ● يَا مَنْ هُوَ اَعْلَمُ بِالْمُفْسِدِينَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٧١﴾',o:'1) YâRabbe\'I-\'âlemîn 2) Yâ Mâlike yevmi\'d-dîn 3) Yâ Men yühibbü\'s-sâbirîn 4) Yâ Men yuhibbü\'t-tevvâbîn 5) Yâ Men yuhibbü\'l-mütetahhirîn 6) Yâ Men yuhibbü\'l-muhsinîn 7) Yâ Men hüve hayru\'n-nâsirîn 8) Yâ Men hüve hayru\'l-fasilîn 9) Yâ Men hüve hayru\'ş-şâkirîn 10) Yâ men hüve a\'lemü bi\'l-müfsidîn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey âlemlerin Rabbi, 2) Ey amellerin karşılıklarının verildiği Kıyamet Gününün sahibi, 3) Ey sabredenleri seven, 4) Ey tövbe edenleri seven, 5) Ey maddi ve manevi kirlerden temizlenenleri seven, 6) Ey Allah\'ı görür gibi ibadet edenleri ve iyilik yapanları seven, 7) Ey yardım edenlerin en hayırlısı, 8) Ey müşkül meseleleri halledip hükme bağlayanların en hayırlısı, 9) Ey iyi amellere bol karşılık verenlerin en hayırlısı, 10) Ey ifsat edenleri en iyi bilen, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},72:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا مُبْدِىُٔ ● يَا مُعِيدُ ● يَا حَفِيظُ ● يَا مُحِيطُ ● يَا حَمِيدُ ● يَا مَجِيدُ ● يَا مُقِيتُ ● يَا مُغِيثُ ● يَا مُعِزُّ ● يَا مُذِلُّ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٧٢﴾',o:'1) Ve es\'elüke biesmâike Yâ Mubdi 2) Yâ Mu\'îd 3) Yâ Hafız 4) Yâ Muhît 5) Yâ Hamîd 6) Yâ Mecîd 7) Yâ Mukît 8) Yâ Muğîs 9) Yâ Mu\'îzz 10) Yâ Muzill 11) Sübhâneke yâ lâ ilahe illâ ente\'l-e ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey mahlûkatı öldükten sonra yeniden dirilten Muîd, 2) Ey her şeyi muhafaza eden Hafîz, 3) Ey her şeyi ilim ve kudretiyle kuşatan Muhît, 4) Ey hamd ve senâya en çok layık olan ve çok övülen Hamîd, 5) Ey azamet, şeref ve hâkimiyeti sonsuz Mecîd, 6) Ey her türlü mahlûkata münasip rızık veren Mukît, 7) Ey darda kalan çaresizlerin imdadına koşan Mugîs, 8) Ey istediğine izzet veren ve şereflendiren Muizz, 9) Ey istediğini zelil kılan Müzill, 10) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},73:{a:'يَا مَنْ هُوَ اَحَدٌ بِلَا ضِدٍّ ● يَا مَنْ هُوَ فَرْدٌ بِلَا نِدٍّ ● يَا مَنْ هُوَ صَمَدٌ بِلَا عَيْبٍ ● يَا مَنْ هُوَ وِتْرٌ بِلَا شَفْعٍ ● يَا مَنْ هُوَ رَبٌّ بِلَا وَزِيرٍ ● يَا مَنْ هُوَ غَنِىٌّ بِلَا فَقْرٍ ● يَا مَنْ هُوَ سُلْطَانٌ بِلَا عَزْلٍ ● يَا مَنْ هُوَ مَلِيكٌ بِلَا عَجْزٍ ● يَا مَنْ هُوَ مَوْجُودٌ بِلَا مِثْلٍ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٧٣﴾',o:'1) Yâ Men hüve Ehadün bilâ didd 2) Yâ Men hüve Ferdün bilâ nidd 3) Yâ Men hüve Samedün bilâ \'ayb 4) Yâ Men hüve Vitrun bilâ şef 5) Yâ Men hüve Rabbün bilâ vezîr 6) Yâ Men hüve Ğaniyyün bilâ fakr 7) Yâ Men hüve Sültânün bilâ \'azl 8) Yâ Men hüve Melîkün bilâ \'acz 9) Yâ Men hüve Mevcudun bilâ misl 10) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey zıddı olmayan Ehad, 2) Ey dengi bulunmayan Ferd, 3) Ey kusur ve ihtiyaçtan münezzeh olan Samed, 4) Ey çifti bulunmayan Vitr, 5) Ey veziri bulunmayan Rab, 6) Ey fakirliği bulunmayan Ganî, 7) Ey azledilemeyen Sultan, 8) Ey acizden münezzeh olan Melîk, 9) Ey benzeri olmayan Mevcûd, 10) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},74:{a:'يَا مَنْ هُوَ ذِكْرُهُ شَرَفٌ لِلذَّاكِرِينَ ● يَا مَنْ هُوَ شُكْرُهُ فَوْزٌ لِلشَّاكِرِينَ ● يَا مَنْ هُوَ حَمْدُهُ فَخْرٌ لِلْحَامِدِينَ ● يَا مَنْ هُوَ طَاعَتُهُ نَجَاةٌ لِلْمُطِيعِينَ ● يَا مَنْ هُوَ بَابُهُ مَفْتوُحٌ لِلطَّالِبِينَ ● يَا مَنْ هُوَ سَبِيلُهُ وَاضِحٌ لِلْمُؤْمِنِينَ ● يَا مَنْ هُوَ اٰيَاتُهُ بُرْهَانٌ لِلنَّاظِرِينَ ● يَا مَنْ هُوَ كِتَابُهُ تَذْكِرَةٌ لِلْمُوقِنِينَ ● يَا مَنْ هُوَ عَفْوُهُ مَلْجَأٌ لِلْمُذْنِبِينَ ● يَا مَنْ هُوَ رَحْمَتُهُ قَرِيبٌ لِلْمُحْسِنِينَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٧٤﴾',o:'1) Yâ Men hüve zikruhû şerafün li\'z-zâkirîn 2) Yâ Men hüve şükruhû fevzün li\'ş-şâkirîn 3) Yâ Men hüve hamdühû fahrun li\'l-hâmidîn 4) Yâ Men hüve tâ\'atühû necâtün li\'l-mütî\'în 5) Yâ Men hüve bâbühü meftûhun li\'t-tâlibîn 6) Yâ Men hüve sebilühû vâdihun li\'l-mü\'minîn 7) Yâ men hüve âyâtühû bürhânün li\'n-nâzirîn 8) Yâ men hüve kitâbühû tezkiratün li\'l-mûkınîn 9) Yâ men hüve \'afvühü melceün li\'l-müznibîn 10) Yâ men hüve rahmetühû karîbûn li\'l-muhsinîn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey zikri Kendisini zikredenlere büyük şeref olan, 2) Ey şükrü Kendisine şükredenlere büyük kurtuluş olan, 3) Ey hamdı Kendisini övenlere büyük iftihar vesilesi olan, 4) Ey tâati, Kendisine itaat edenlere necât olan, 5) Ey kapısı, Kendisini arayanlara açık olan, 6) Ey yolu müminlere zâhir ve belli olan, 7) Ey âyetleri bakanlar için kesin delil olan, 8) Ey kitabı kuvvetli îman sahipleri için öğüt olan, 9) Ey affı günahkarlar için sığınak olan, 10) Ey rahmeti muhsinler için yakın olan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},75:{a:'يَا مَنْ تَبَارَكَ اسْمُهُ ● يَا مَنْ تَعَالٰى جَدُّهُ ● يَا مَنْ جَلَّ ثَنَٓاؤُهُ ● يَا مَنْ لَٓا اِلٰهَ غَيْرُهُ ● يَا مَنْ تَقَدَّسَتْ اَسْمَٓاؤُهُ ● يَا مَنْ يَدُومُ بَقَٓاؤُهُ ● يَا مَنِ الْعَظَمَةُ بَهَٓاؤُهُ ● يَا مَنِ الْكِبْرِيَٓاءُ رِدَٓاؤُهُ ● يَا مَنْ لَا يُحْصٰى اٰلَٓاؤُهُ ● يَا مَنْ لَا يُعَدُّ نَعْمَٓاؤُهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٧٥﴾',o:'1) Yâ Men tebâreke\'smüh 2) Yâ Men te\'âlâ ceddüh 3) Yâ Men celle senâüh 4) Yâ Men lâ ilahe ğayruh 5) Yâ Men tekaddeset esmâüh 6) Yâ Men yedûmü bekâüh 7) Yâ Meni\'l-\'azametü behâüh 8) Yâ Meni\'l-kibriyâü ridâüh 9) Yâ Men lâ yuhsâ âlâüh 10) Yâ Men lâ yu\'addü na\'mâüh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey ismi yüce ve mübarek olan, 2) Ey şan ve makamı yüksek olan, 3) Ey senâ ve övgüsü büyük olan, 4) Ey kendisinden başka ilâh olmayan, 5) Ey isimleri mukaddes olan, 6) Ey bekâsı devam eden, 7) Ey azameti, bahâ ve kadri olan, 8) Ey büyüklük perdesi olan, 9) Ey gizli nimetleri grup grup bile sayılamayan, 10) Ey ihsan ve nimeti hesap ve sayıya gelmeyen, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},76:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا مُعِينُ ● يَا مُبِينُ ● يَٓا اَمِينُ ● يَا مَكِينُ ● يَا مَتِينُ ● يَا شَدِيدُ ● يَا شَهِيدُ ● يَا رَشِيدُ ● يَا حَمِيدُ ● يَا مَجِيدُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٧٦﴾',o:'1) Ve es\'elüke biesmâike Yâ Mu\'în 2) Yâ Mubîn 3) Yâ Emîn 4) Yâ Mekîn 5) Yâ Metîn 6) Yâ Şedîd 7) Yâ Şehîd 8) Yâ Raşîd 9) Yâ Hamîd 10) Yâ Mecîd 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-neİ-emâne neccinâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey kullarına yardım eden Muîn, 2) Ey açıklanması gereken her şeyi beyan eden Mübîn, 3) Ey kullarına emniyet ve huzur veren Emîn, 4) Ey saltanatı muhkem, nüfuz ve iktidar sahibi Mekîn, 5) Ey hiçbir şey hükmünü sarsmayan ve Kendisine güvenilen Metîn, 6) Ey azap ve ikâbı şiddetli olan Şedîd, 7) Ey kullarının her yaptığını gören Şehîd, 8) Ey bütün işlerini ezelî takdirine göre en güzel bir şekilde neticeye ulaştıran Raşîd, 9) Ey en çok övülen ve en çok övgüye layık olan Hamîd, 10) Ey sonsuz şeref sahibi Mecîd, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},77:{a:'يَا ذَا الْعَرْشِ الْمَجِيدِ ● يَا ذَا الْقَوْلِ السَّدِيدِ ● يَا ذَا الْفَضْلِ الرَّشِيدِ ● يَا ذَا الْبَطْشِ الشَّدِيدِ ● يَا ذَا الْوَعْدِ وَ الْوَعِيدِ ● يَا قَرِيبًا غَيْرَ بَعِيدٍ ● يَا مَنْ هُوَ الْوَلِىُّ الْحَمِيدُ ● يَا مَنْ هُوَ عَلٰى كُلِّ شَىْءٍ شَهِيدٌ ● يَا مَنْ هُوَ لَيْسَ بِظَلَّا مٍ لِلْعَبِيدِ ● يَا مَنْ هُوَ اَقْرَبُ اِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٧٧﴾',o:'1) Yâ Ze\'l-arşi\'l-mecîd 2) Yâ Ze\'l-kavli\'s-sedîd 3) Yâ Ze\'l-fadli\'r-raşîd 4) Yâ Ze\'l-batşi\'ş-şedîd 5) Yâ Ze\'l-va\'di ve\'l-va\'îd 6) Yâ Karîben gayra ba\'îd 7) Yâ Men hüve\'l-veliyyü\'l-hamîd 8) Yâ Men hüve \'alâ külli şey\'in şehîd 9) Yâ Men hüve leyse bizallâmîn li\'l-\'abîd 10) Yâ men hüve akrabü ileyhi min habli\'l-verîd 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey yüce Arşın sahibi, 2) Ey dosdoğru sözün sahibi, 3) Ey yerli yerince yapılan fazıl ve kerem sahibi, 4) Ey kıskıvrak yakalayan şiddetli azap sahibi, 5) Ey vaad ve tehdit sahibi, 6) Ey uzak olmayan yakın, 7) Ey en fazla övgüye lâyık olan dost, 8) Ey her şeyi müşahedesi altında tutan, 9) Ey kullarına hiçbir şekilde zulmedici olmayan, 10) Ey kuluna şah damarından daha yakın olan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},78:{a:'يَا مَنْ لَا شَرِيكَ لَهُ وَ لَا وَزِيرَ ● يَا مَنْ لَا شَبِيهَ لَهُ وَ لَا نَظِيرَ ● يَا خَالِقَ الشَّمْسِ وَ الْقَمَرِ الْمُنِيرِ ● يَا مُغْنِىَ الْبَٓائِسِ الْفَقِيرِ ● يَا رَازِقَ الطِّفْلِ الصَّغِيرِ ● يَا رَاحِمَ الشَّيْخِ الْكَبِيرِ ● يَا عِصْمَةَ الْخَٓائِفِ الْمُسْتَجِيرِ ● يَا مَنْ هُوَ بِعِبَادِهِ بَصِيرٌ ● يَا مَنْ هُوَ بِحَوَايِجِ الْعِبَادِ خَبِيرٌ ● يَا مَنْ هُوَ عَلٰى كُلِّ شَىْءٍ قَدِيرٌ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٧٨﴾',o:'1) Yâ Men lâ şerîke lehû velâ vezîr 2) Yâ Men lâ şebîhe lehû velâ nezîr 3) Yâ Hâlika\'ş-şemsi ve\'l-kameri\'l-münîr 4) Yâ Muğniye\'l-bâisi\'l-fakîr 5) Yâ Râzika\'t-tıfli\'s-sağîr 6) Yâ Râhime\'ş-şeyhi\'l-kebir 7) Yâ \'Ismete\'l-hâifi\'l-müstecîr 8) Yâ Men hüve bi\'ibâdihî basîr 9) Yâ Men hüve bihavâyici\'l-\'ibâdi habîr 10) Yâ Men hüve \'alâ külli şey\'in kadîr 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey hiçbir ortak ve veziri olmayan, 2) Ey hiçbir benzeri ve dengi olmayan, 3) Ey güneş ve nurlu ayın yaratıcısı, 4) Ey şiddetli sıkıntıya düşmüş fakirleri zenginleştiren, 5) Ey küçük yavrulara rızık veren, 6) Ey düşkün ihtiyarlara merhamet eden, 7) Ey korku içinde kurtuluş isteyenlerin sığınağı, 8) Ey kullarının her halini gören, 9) Ey kullarının ihtiyaçlarından haberdar olan, 10) Ey her şeye gücü yeten, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},79:{a:'يَا ذَا الْجُودِ وَ النِّعَمِ ● يَا ذَا الْفَضْلِ وَ الْكَرَمِ ● يَا ذَا الْبَاْسِ وَ النِّقَمِ ● يَا خَالِقَ اللَّوْحِ وَ الْقَلَمِ ● يَا بَارِئَ الذَّرِّ وَ النَّسَمِ ● يَا مُلْهِمَ الْعَرَبِ وَ الْعَجَمِ ● يَا كَاشِفَ الضُّرِّ وَ الْاَلَمِ ● يَا عَالِمَ السِّرِّ وَ الْهِمَمِ ● يَا مَنْ لَهُ الْبَيْتُ وَ الْحَرَمُ ● يَا مَنْ يَخْلُقُ الْاَشْيَٓاءَ مِنَ الْعَدَمِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٧٩﴾',o:'1) Yâ Ze\'l-cûdi ve\'n-ni\'âm 2) Yâ Ze\'l-fadli ve\'l-keram 3) Yâ Ze\'l-be\'si ve\'n-nikam 4) Yâ Hâlika\'l-levhi ve\'l-kalem 5) Yâ Bârie\'z-zerri ve\'n-nesem 6) Yâ Mulhime\'l-\'arabi ve\'l-\'acem 7) Yâ Kâşife\'drdurri ve\'l-elem 8) Yâ \'Alime\'s-sirri ve\'l-himem 9) Yâ Men lehü\'l-beytü ve\'l-haram 10) Yâ Men yahlüku\'l-eşyâe mine\'l-\'adem 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey cömertlik ve nimetler sahibi, 2) Ey fazıl ve kerem sahibi, 3) Ey şiddetli belâ ve çetin azaplar sahibi, 4) Ey Levh-i Mahfûz ve Kalemi yaratan, 5) Ey zerreyi, hoş rüzgârları ve nefesleri yaratan, 6) Ey bütün kullarına ilhamda bulunan, 7) Ey zarar ve elemi gideren, 8) Ey gizli sır ve kaygıları bilen, 9) Ey Kâbe-i Muazzama ve Harem-i Şerîfin sahibi, 10) Ey eşyayı yoktan yaratan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},80:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا عَادِلُ ● يَا قَابِلُ ● يَا فَاضِلُ ● يَا فَاعِلُ ● يَا كَافِلُ ● يَا جَاعِلُ ● يَا كَامِلُ ● يَا فَاطِرُ ● يَا طَالِبُ ● يَا مَطْلُوبُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٨٠﴾',o:'1) Ve es\'elüke biesmâike Yâ \'Adil 2) Yâ Kabil 3) Yâ Fâdil 4) YâFâ\'il 5) Yâ Kâfıl 6) Yâ Câ\'il 7) Yâ Kâmil 8) Yâ Fâtır 9) Yâ Tâlib 10) Yâ Matlûb 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey gerçek adalet sahibi Âdil, 2) Ey rızâsı için yapılan işleri kabul eden Kâbil, 3) Ey her şeyden üstün ve yüce olan Fâdıl, 4) Ey her işin hakiki yapıcısı olan Fâil, 5) Ey yaratıkların her işini üzerine alan Kâfil, 6) Ey her şeyi meydana getiren Câil, 7) Ey her bakımdan eksiksiz olan Kâmil, 8) Ey mahlûkatı yokluk karanlıklarından varlık nûruna çıkaran Fâtır, 9) Ey kulları için hayır murat eden ve onları dergâhına çağıran Tâlib, 10) Ey kullarının, rızasına ermek ve cemalini görmek için can attığı Matlûb, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},81:{a:'يَا مَنْ اَنْعَمَ بِحَوْلِهِ ● يَا مَنْ اَكْرَمَ بِطَوْلِهِ ● يَا مَنْ عَادَ بِلُطْفِهِ ● يَا مَنْ تَعَزَّزَ بِقُدْرَتِهِ ● يَا مَنْ قَدَّرَ بِحِكْمَتِهِ ● يَا مَنْ حَكَمَ بِتَدْبِيرِهِ ● يَا مَنْ دَبَّرَ بِعِلْمِهِ ● يَا مَنْ تَجَاوَزَ بِحِلْمِهِ ● يَا مَنْ دَنَا فِى عُلُوِّهِ ● يَا مَنْ عَلاٰ فِى دُنُوِّهِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٨١﴾',o:'1) Yâ Men en\'ame bihavlih 2) Yâ Men ekrame bitavlih 3) Yâ Men \'âde bilütfıh 4) Yâ Men te\'azzeze bikudratih 5) Yâ Men kaddera bihikmetih 6) Yâ Men hakeme bitedbîrih 7) Yâ Men debbera bi\'ilmih 8) Yâ Men tecâveze bihılmih 9) Yâ Men denâ fî \'ulüvvih 10) Yâ Men \'alâ fî dünüvvih 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey güç ve havliyle nimet veren, 2) Ey geniş ve bol imkânlarıyla ikram eden, 3) Ey tekrar tekrar lütufta bulunan, 4) Ey kudretiyle her yerde izzetini gösteren, 5) Ey her şeyi hikmetiyle ölçüp biçen, 6) Ey tedbîriyle hükmeden, 7) Ey ilmiyle her şeyi idare eden, 8) Ey hilim ve yumuşaklığıyla kullarını cezalandırmaktan vazgeçen, 9) Ey yüceliğiyle beraber kullarına yakın olan, 10) Ey yakınlığında yüceliği tezâhür eden, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},82:{a:'يَا مَنْ يَخْلُقُ مَا يَشَٓاءُ ● يَا مَنْ يَفْعَلُ مَا يَشَٓاءُ ● يَا مَنْ يَهْدِى مَنْ يَشَٓاءُ ● يَا مَنْ يُضِلُّ مَنْ يَشَٓاءُ ● يَا مَنْ يَغْفِرُ لِمَنْ يَشَٓاءُ ● يَا مَنْ يُعَذِّبُ مَنْ يَشَٓاءُ ● يَا مَنْ يَتُوبُ عَلٰى مَنْ يَشَٓاءُ ● يَا مَنْ يُصَوِّرُ فِى الْاَرْحَامِ كَيْفَ يَشَٓاءُ ● يَا مَنْ يَزِيدُ فِى الْخَلْقِ مَا يَشَٓاءُ ● يَا مَنْ يَخْتَصُّ بِرَحْمَتِهِ مَنْ يَشَٓاءُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٨٢﴾',o:'1) Yâ Men yahlüku ma yeşâ 2) Yâ Men yef\'alü ma yeşâ 3) Yâ Men yehdi men yeşâ 4) Yâ Men yudillü men yeşâ 5) Yâ Men yağfiru limen yeşâ 6) Yâ Men yü\'azzibü men yeşâ 7) Ya Men yetûbü alâ men yeşâ 8) Yâ Men yüsavviru fı\'l-erhâmi keyfe yeşâ 9) Yâ Men yezîdü fi\'l-halki mâ yeşâ 10) Yâ Men yahtassu bi rahmetihî men yeşâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey dilediğini yaratan, 2) Ey dilediğini yapan, 3) Ey dilediğine hidayet eden, 4) Ey dilediğini saptıran, 5) Ey dilediğini bağışlayan, 6) Ey dilediğine azap eden, 7) Ey dilediğinin tövbesini kabul eden, 8) Ey anne rahimlerindeki yavruları dilediği gibi şekillendiren, 9) Ey yaratıklarında dilediği şeyi ziyade kılan, 10) Ey rahmetini dilediğine tahsis eden, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},83:{a:'يَا مَنْ لَمْ يَتَّخِذْ صَاحِبَةً وَ لَا وَلَدًا ● يَا مَنْ لَا يُشْرِكُ فِى حُكْمِهِٓ اَحَدًا ● يَا مَنْ جَعَلَ لِكُلِّ شَىْءٍ قَدْرًا ● يَا مَنْ لَمْ يَزَلْ رَحِيمًا ● يَا مَنْ جَاعِلَ الْمَلٰٓئِكَةِ رُسُلاً ● يَا مَنْ جَعَلَ فِى السَّمَٓاءِ بُرُوجًا ● يَا مَنْ جَعَلَ الْاَرْضَ قَرَارًا ● يَا مَنْ جَعَلَ مِنَ الْمَٓاءِ بَشَرًا ● يَا مَنْ اَحْصٰى كُلَّ شَىْءٍ عَدَدًا ● يَا مَنْ اَحَاطَ بِكُلِّ شَىْءٍ عِلْمًا ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٨٣﴾',o:'1) Yâ Men lem yettehiz sahibeten velâ veledâ 2) Yâ Men la yüşrikü fî hukmihî ehadâ 3) Yâ Men ce\'ale li külli şey\'in kadrâ 4) Yâ Men lem yezel rahîmâ 5) Yâ Câ\'ile\'l-melâiketi rusülâ 6) Yâ Men ce\'ale fı\'s-semâi bürûcâ 7) Yâ Men ce\'ale\'l-arda karâra 8) Yâ Men ce\'ale mine\'l-mâi beşerâ 9) Yâ Men ahsa külle şey\'in \'adedâ 10) Yâ Men ehâta bi külli şey\'in \'ilmâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey hiçbir eş ve evlat edinmeyen, 2) Ey kimseyi hükmüne ortak kılmayan, 3) Ey her şeye bir plan ve miktar tayin eden, 4) Ey şefkat ve merhameti zeval bulmayıp devam eden, 5) Ey melekleri elçi kılan, 6) Ey semâda burçlar meydana getiren, 7) Ey yeryüzünü kararlı ve barınmaya müsait kılan, 8) Ey insanı bir damla sudan yaratan, 9) Ey her şeyi sayarak hesabını yapan, 10) Ey her şeyi ilmiyle kuşatan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},84:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا فَرْدُ ● يَا وِتْرُ ● يَٓا اَحَدُ ● يَا صَمَدُ ● يَٓا اَمْجَدُ ● يَٓا اَعَزُّ ● يَٓا اَجَلُّ ● يَٓا اَحَقُّ ● يَٓا اَبَرُّ ● يَٓا اَبَدُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٨٤﴾',o:'1) Ve es\'elüke biesmâike Yâ Ferd 2) Yâ Vitr 3) Yâ Ehad 4) Yâ Samed 5) Yâ Emced 6) Yâ E\'azz 7) Yâ Eceli 8) Yâ Ehakk 9) Yâ Eberr 10) Yâ Ebed 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-nel-emâne neccinâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey eşi ve benzeri olmayan Ferd, 2) Ey zât, sıfat ve fiillerinde çifti olmayan Vitr, 3) Ey her bir şeyde birliğini gösteren Ehad, 4) Ey hiçbir şeye muhtaç olmayan ve her şeyin kendisine muhtaç olduğu Samed, 5) Ey şan, şeref ve yüceliği en büyük olan Emced, 6) Ey izzet ve galibiyeti mukayeseye gelmeyen Eazz, 7) Ey sonsuz azamet ve celâl sahibi Ecell, 8) Ey bütün gerçeklerden daha gerçek ve ibâdete en çok lâyık olan Ehakk, 9) Ey herkesten fazla iyilik yapan Eberr, 10) Ey varlığının sonu olmayan Ebed, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},85:{a:'يَا مَعْرُوفَ مَنْ عَرَفَهُ ● يَا مَعْبُودَ مَنْ عَبَدَهُ ● يَا مَشْكُورَ مَنْ شَكَرَهُ ● يَا مَذْكُورَ مَنْ ذَكَرَهُ ● يَا مَحْمُودَ مَنْ حَمِدَهُ ● يَا مَوْجُودَ مَنْ طَلَبَهُ ● يَا مَوْصُوفَ مَنْ وَحَّدَهُ ● يَا مَحْبُوبَ مَنْ اَحَبَّهُ ● يَا مَرْغُوبَ مَنْ اَرَادَهُ ● يَا مَقْصُودَ مَنْ اَنَابَ اِلَيْهِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٨٥﴾',o:'1) Yâ Ma\'rûfe men \'arafeh 2) Yâ Ma\'bûde men \'abedeh 3) Yâ Meşkûre men şekerah 4) Yâ Mezkûre men zekerah 5) Yâ Mahmude men hamideh 6) Yâ Mevcûde men talebeh 7) Yâ Mevsûfe men vahhadeh 8) Yâ Mahbûbe men ehabbeh 9) Yâ Merğûbe men erâdeh 10) Yâ Maksûde men enâbe ileyh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey Kendisini tanımak isteyenlerin mârufu, 2) Ey Kendisine ibâdet edenlerin mâbudu, 3) Ey Kendisine şükredenlerin meşkûru, 4) Ey Kendisini zikredenlerin mezkûru, 5) Ey Kendisini övenlerin mahmûdu, 6) Ey Kendisini arayanlar için mevcut olan, 7) Ey Kendisini bir tanıyanların mevsûfu, 8) Ey Kendisini sevenlerin sevgilisi, 9) Ey Kendisini arzulayanların merğubu, 10) Ey dergâhına dönenlerin maksudu, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},86:{a:'يَا مَنْ لَا مُلْكَ اِلَّا مُلْكَهُ ● يَا مَنْ لَا يُحْصِى الْعِبَادُ ثَنَٓائَهُ ● يَا مَنْ لَا تَصِفُ الْخَلَٓائِقُ جَلَالَهُ ● يَا مَنْ لَا يُدْرِكُ الْاَبْصَارُ كَمَالَهُ ● يَا مَنْ لَا يَبْلُغُ الْاَفْهَامُ صِفَاتَهُ ● يَا مَنْ لَا يَنَالُ الْاَفْكَارُ كِبْرِيَٓائَهُ ● يَا مَنْ لَا يُحْسِنُ اْلاِنْسَانُ نُعُوتَهُ ● يَا مَنْ لَا يَرُدُّ الْعِبَادُ قَضَٓائَهُ ● يَا مَنْ ظَهَرَ فِى كُلِّ شَىْءٍ اٰيَاتُهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٨٦﴾',o:'1) Yâ Men lâ mülke illâ mülküh 2) Yâ Men lâ yuhsi\'l-\'ibadü senaeh 3) Yâ Men lâ tesıfü\'l-halâiku celâleh 4) Yâ Men lâ yudrikü\'l-ebsâru kemâleh 5) Yâ Men lâ yeblüğu\'l-efhâmü sıfâtih 6) Yâ Men lâ yenâlü\'l-efkâru kibriyâeh 7) Yâ Men lâ yuhsinü\'l-insânü nü\'ûteh 8) Yâ Men lâ yeruddü\'l-\'ibâdü kadâeh 9) Yâ Men zahera fî külli şey\'in âyâtüh 10) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey saltanatından başka gerçek saltanat olmayan, 2) Ey kulların senâsını saymakla bitiremediği, 3) Ey mahlûkatın celâlini vasfedemediği, 4) Ey gözlerin kemâlini idrak ve ihâta edemediği, 5) Ey zekâların sıfatlarına ulaşmakta acze düştüğü, 6) Ey fikirlerin, kibriyasının hakikatine ulaşamadığı, 7) Ey insanların, sıfatlarını güzelce tavsif edemediği, 8) Ey kulların, hükmünü geri çeviremediği, 9) Ey her şeyde Kendisini tanıtan deliller açıkça görülen, 10) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},87:{a:'يَا حَبِيبَ الْبَكَّٓائِينَ ● يَا سَنَدَ الْمُتَوَكِّلِينَ ● يَا هَادِىَ الْمُضِلِّينَ ● يَا وَلِىَّ الْمُؤْمِنِينَ ● يَٓا اَنِيسَ الذَّاكِرِينَ ● يَٓا اَقْدَرَ الْقَادِرِينَ ● يَٓا اَبْصَرَ النَّاظِرِينَ ● يَٓا اَعْلَمَ الْعَالِمِينَ ● يَا مَفْزَعَ الْمَلْهُوفِينَ ● يَٓا اَنْصَرَ النَّاصِرِينَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٨٧﴾',o:'1) Yâ Habîbe\'l-bekkâîn 2) Yâ Senede\'l-mütevekkilîn 3) Yâ Hâdiye\'l-mudillîn 4) Yâ Veliyye\'l-mü\'minîn 5) Yâ Enîse\'s-zâkirîn 6) Yâ Akdera\'l-kâdirîn 7) Yâ Ebsara\'n-nâzırîn 8) Yâ Aleme\'l-\'âlimîn 9) Yâ Mefze\'a\'l-melhûfîn 10) Yâ Ensara\'n-nâsirîn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey günahları için ve kendisine olan aşk ve muhabbetten dolayı ağlayanların sevgilisi, 2) Ey kendisine tevekkül edenlerin dayanağı, 3) Ey hak yoldan sapanları hidayete erdiren, 4) Ey müminlerin dost ve sahibi, 5) Ey kendisini zikredenlerin can yoldaşı, 6) Ey bütün güçlülerden daha güçlü, 7) Ey bütün bakanlardan daha iyi gören, 8) Ey bütün ilim sahiplerinden daha âlim, 9) Ey kederli bîçarelerin kaçıp sığındığı, 10) Ey bütün yardım edenlerden daha çok yardım eden, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},88:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا مُكْرِمُ ● يَا مُعَظِّمُ ● يَا مُنَعِّمُ ● يَا مُعْطِى ● يَا مُغْنِى ● يَا مُحْيِى ● يَا مُبْدِىُٔ ● يَا مُرْضِى ● يَا مُنْجِى ● يَا مُحْسِنُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٨٨﴾',o:'1) Ve es\'elüke biesmâike Yâ Mukrim 2) Yâ Mu\'azzim 3) Yâ Muna\'im 4) Ya Mü\'tî 5) Yâ Muğnî 6) Yâ Muhyî 7) Yâ Mubdî 8) Yâ Murdî 9) Yâ Muncî 10) Yâ Muhsin 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey gerçek ikram sahibi Mükrim, 2) Ey dilediğini büyüten ve eserleriyle büyüklüğünü gösteren Muazzım, 3) Ey mahlûkatını çeşit çeşit nimetlere gark eden Müna\'ım, 4) Ey mahlûkatına lâzım olan her şeyi veren Mu\'ti, 5) Ey mahlûkatının ihtiyacını giderip zengin kılan Muğnî, 6) Ey canlılara hayat veren Muhyî, 7) Ey mahlûkatı maddesiz ve örneksiz ilk defa yaratan Mübdî, 8) Ey mahlûkatını nimetleriyle hoşnut kılan Murzî, 9) Ey mahlûkatı her türlü tehlikeden kurtaran Müncî, 10) Ey bol bol iyilikte bulunan Muhsîn, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},89:{a:'يَا كَافِىَ كُلِّ شَىْءٍ ● يَا قَٓائِمًا عَلٰى كُلِّ شَىْءٍ ● يَا مَنْ لَا يُشْبِهُهُ شَىْءٌ ● يَا مَنْ لَا يَزِيدُ فِى مُلْكِهِ شَىْءٌ ● يَا مَنْ لَا يَنْقُصُ مِنْ خَزَٓائِنِهِ شَىْءٌ ● يَا مَنْ لَا يَخْفٰى عَلَيْهِ شَىْءٌ ● يَا مَنْ لَيْسَ كَمِثْلِهِ شَىْءٌ ● يَا مَنْ بِيَدِهِ مَقَالِيدُ كُلِّ شَىْءٍ ● يَا مَنْ وَسِعَتْ رَحْمَتُهُ كُلَّ شَىْءٍ ● يَا مَنْ يَبْقٰى وَ يَفْنٰى كُلُّ شَىْءٍ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ نَجِّنَا مِنَ النَّارِ ﴿٨٩﴾',o:'1) Yâ Kâfiye külli şey 2) Yâ Kaimen \'alâ külli şey 3) Yâ Men lâ yuşbihühû şey 4) Yâ Men lâ yezîdü fî mülkihî şey 5) Yâ Men lâ yenkusu min hazainihî şey 6) Yâ Men lâ yahfâ \'aleyhi şey 7) Yâ Men leyse kemişlihî şey 8) Yâ Men biyedihî mekâlîdü külli şey 9) Yâ Men vesi\'at rahmetühû külle şey 10) Yâ Men yebkâ ve yefnâ küllü şey 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey her şeye kâfi, 2) Ey her şeyi idare eden kaim, 3) Ey hiçbir şey Kendisine benzemeyen, 4) Ey mülkünde, irâdesi dışında hiçbir şey artmayan, 5) Ey hazînelerinden hiçbir şey eksik olmayan, 6) Ey hiçbir şey Kendisine gizli bulunmayan, 7) Ey misli ve benzeri hiçbir şey bulunmayan, 8) Ey her şeyin anahtarı elinde olan, 9) Ey rahmeti her şeyi kuşatan, 10) Ey her şey fâni olduğu halde Kendisi bâkî kalan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},90:{a:'يَا مَنْ لَا يَعْلَمُ الْغَيْبَ اِلَّا هُوَ ● يَا مَنْ لَا يَصْرِفُ السُّٓوءَ اِلَّا هُوَ ● يَا مَنْ لَا يُدَبِّرُ الْاَمْرَ اِلَّا هُوَ ● يَا مَنْ لَا يَغْفِرُ الذُّنُوبَ اِلَّا هُوَ ● يَا مَنْ لَا يُقَلِّبُ الْقَلْبَ اِلَّا هُوَ ● يَا مَنْ لَا يَخْلُقُ الْخَلْقَ اِلَّا هُوَ ● يَا مَنْ لَا يُتِمُّ النِّعْمَةَ اِلَّا هُوَ ● يَا مَنْ لَا يُنَزِّلُ الْغَيْثَ اِلَّا هُوَ ● يَا مَنْ لَا يُحْيِى الْمَوْتٰى اِلَّا هُوَ ● يَا مَنْ لَا يُغْنِى عَلَى التَّحْقِيقِ اِلَّا هُوَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩٠﴾',o:'1) Yâ Men lâ ya\'lemü\'l-ğaybe illâ hû 2) Yâ Men lâ yasrifü\'s-sûe illâ hû 3) Yâ Men lâ yudebbiru\'l-emra illâ hû 4) Yâ Men lâ yağfiru\'z-zünûbe illâ hû 5) Yâ Men lâ yukallibü\'l-kalbe illâ hû 6) Yâ Men lâ yahlüku\'l-halka illâ hû 7) Yâ Men lâ yutimmü\'n-ni\'mete illâ hû 8) Yâ Men lâ yunezzilü\'l-ğayşe illâ hû 9) Yâ Men lâ yuhyi\'l-mevtâ illâ hû 10) Yâ Men lâ yuğni \'ale\'t-tahkîki illâ hû 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne neccinâ mine\'n-nâr.',m:'1) Ey gaybı Kendisinden başka kimse bilemeyen, 2) Ey kullarından kötülüğü Kendisinden başka kimse defedemeyen, 3) Ey işleri Kendisinden başka kimse idâre edemeyen, 4) Ey günahları Kendisinden başka kimse mağfiret edemeyen, 5) Ey kalpleri Kendisinden başkası değiştiremeyen, 6) Ey mahlûkatı Kendisinden başkası yaratamayan, 7) Ey nîmetleri Kendisinden başkası tamamlayamayan, 8) Ey yağmuru Kendisinden başkası yağdıramayan, 9) Ey ölüleri kendisinden başkası diriltemeyen, 10) Ey kullarını kendisinden başkası gerçek zengin kılamayan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},91:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا كَاشِفُ ● يَا فَارِجُ ● يَا فَاتِحُ ● يَا نَاصِرُ ● يَا ضَامِنُ ● يَٓا اٰمِرُ ● يَا نَاهِى ● يَا رَجَا ● يَا مُرْتَجَا ● يَا عَظِيمَ الرَّجَا ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩١﴾',o:'1) Ve es\'elüke biesmâike Yâ Kâşif 2) Yâ Fâric 3) Yâ Fâtih 4) Yâ Nâsir 5) Yâ Dâmin 6) Yâ Âmir 7) Yâ Nâhî 8) Yâ Racâ 9) Yâ Murtecâ 10) Yâ \'Azîme\'r-racâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey belâları kaldıran ve güzellikleri açığa çıkaran Kâşif, 2) Ey keder ve tasadan kurtarıp ferahlatan Fâric, 3) Ey her mevcuda münâsip bir sûret açan ve fetihler müyesser kılan Fâtih, 4) Ey kullarına yardım eden Nâsır, 5) Ey yaratıkların her türlü ihtiyacını üzerine alan Dâmin, 6) Ey her şeye fıtratının gayesini emreden Âmir, 7) Ey her türlü kötülükten sakındıran Nâhî, 8) Ey kullarının ümidi olan Recâ, 9) Ey kullarının ümit beslediği Mürtecâ, 10) Ey kendisine büyük ümitler beslenen Azîmür-Recâ, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},92:{a:'يَا مُعِينَ الضُّعَفَٓاءِ ● يَا كَنْزَ الْفُقَرَٓاءِ ● يَا صَاحِبَ الْغُرَبَٓاءِ ● يَا نَاصِرَ الْاَوْلِيَٓاءِ ● يَا قَاهِرَ الْاَعْدَٓاءِ ● يَا رَافِعَ السَّمَٓاءِ ● يَا كَاشِفَ الْبَلَٓاءِ ● يَٓا اَنِيسَ الْاَوْلِيَٓاءِ ● يَا حَبِيبَ الْاَتْقِيَٓاءِ ● يَٓا اِلٰهَ الْاَغْنِيَٓاءِ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩٢﴾',o:'1) Yâ Mu\'îne\'d-du\'afâ 2) Yâ Kenze\'l-fukarâ 3) Yâ Sâhibe\'l-ğurabâ 4) Yâ Nâsira\'l-evliyâ 5) Yâ Kâhira\'l-a\'dâ 6) Yâ Râfia\'s-semâ 7) Yâ Kâşife\'l-belâ 8) Yâ Enîse\'l-evliyâ 9) Yâ Habîbe\'l-etkıyâ 10) Yâ İlâhe\'l-ağniyâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey zayıfların yardımcısı, 2) Ey fakirlerin hazînesi, 3) Ey gariplerin sahibi, 4) Ey dostların yardımcısı, 5) Ey düşmanların kahredicisi, 6) Ey gökleri yükselten, 7) Ey belâları kaldıran, 8) Ey dostların can yoldaşı, 9) Ey takvâ sahiplerinin sevgilisi, 10) Ey zenginlerin mabudu, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},93:{a:'يَٓا اَوَّلَ كُلِّ شَىْءٍ وَ اٰخِرَهُ ● يَٓا اِلٰهَ كُلِّ شَىْءٍ وَ صَانِعَهُ ● يَا رَازِقَ كُلِّ شَىْءٍ وَ خَالِقَهُ ● يَا فَاطِرَ كُلِّ شَىْءٍ وَ مَلِيكَهُ ● يَا قَابِضَ كُلِّ شَىْءٍ وَ بَاسِطَهُ ● يَا مُبْدِىَٔ كُلِّ شَىْءٍ وَ مُعِيدَهُ ● يَا مُسَبِّبَ كُلِّ شَىْءٍ وَ مُقَدِّرَهُ ● يَا مُرَبِّىَ كُلِّ شَىْءٍ وَ مُدَبِّرَهُ ● يَا مُكَوِّرَ كُلِّ شَىْءٍ وَ مُحَوِّلَهُ ● يَا مُحْيِىَ كُلِّ شَىْءٍ وَ مُمِيتَهُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩٣﴾',o:'1) Yâ Evvele külli şey\'in ve âhirah 2) Yâ İlahe külli şey\'in ve sâni\'ah 3) Yâ Râzika külli şey\'in ve hâlikah 4) Yâ Fâtira külli şey\'in ve melîkeh 5) Yâ Kâbida külli şey\'in ve bâsiteh 6) Yâ Mubdie külli şey\'in ve nıü\'îdeh 7) Yâ Musebbibe külli şey\'in ve mükaddirah 8) Yâ Murabbiye külli şey\'in ve müdebbirah 9) Yâ Mukevvira külli şey\'in ve muhavvileh 10) Yâ Muhyiye külli şey\'in ve mümîteh 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey her şeyin evveli ve âhiri, 2) Ey her şeyin ilâhı ve sanatkârı, 3) Ey her şeyin râzıkı ve hâlıkı, 4) Ey her şeyin yaratıcısı ve sultânı, 5) Ey her şeyi daraltan ve genişleten, 6) Ey her şeyi ilk defa yaratan ve öldükten sonra tekrar iâde eden, 7) Ey her şeye gerekli sebepleri yaratan ve bir ölçü takdir eden, 8) Ey her şeyi terbiye ve idâre eden, 9) Ey her şeyi döndüren ve değiştiren, 10) Ey her şeyi dirilten ve öldüren, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},94:{a:'يَا خَيْرَ ذَاكِرٍ وَ مَذْكُورٍ ● يَا خَيْرَ شَاكِرٍ وَ مَشْكُورٍ ● يَا خَيْرَ شَاهِدٍ وَ مَشْهُودٍ ● يَا خَيْرَ حَامِدٍ وَ مَحْمُودٍ ● يَا خَيْرَ دَاعٍ وَ مَدْعُوٍّ ● يَا خَيْرَ مُجِيبٍ وَ مُجَابٍ ● يَا خَيْرَ مُونِسٍ وَ اَنِيسٍ ● يَا خَيْرَ صَاحِبٍ وَ جَلِيسٍ ● يَا خَيْرَ مَقْصُودٍ وَ مَطْلُوبٍ ● يَا خَيْرَ حَبِيبٍ وَ مَحْبُوبٍ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩٤﴾',o:'1) Yâ Hayra zâkirîn ve mezkûr 2) Yâ Hayra şâkirîn ve meşkûr 3) Yâ Hayra şahidin ve meşhûd 4) Yâ Hayra hâmidin ve mahmûd 5) Yâ Hayra dâ\'in ve med\'uvv 6) Yâ Hayra mücîbin ve mücâb 7) Yâ Hayra munisin ve enîs 8) Yâ Hayra sahibin ve celîs 9) Yâ Hayra maksûdin ve matlûb 10) Yâ Hayra habîbin ve mahbûb 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey yâd edenlerin ve yâd edilenlerin en hayırlısı, 2) Ey şükrü kabul edenlerin ve şükredilenlerin en hayırlısı, 3) Ey övülenlerin ve övenlerin en hayırlısı, 4) Ey görenlerin ve görülenlerin en hayırlısı, 5) Ey çağıranların ve çağrılanların en hayırlısı, 6) Ey cevap verenlerin ve cevap verilenlerin en hayırlısı, 7) Ey ünsiyet verenlerin ve Kendisiyle ünsiyet edilenlerin en hayırlısı, 8) Ey bütün dostların ve meclis arkadaşlarının en hayırlısı, 9) Ey bütün maksut ve matlupların en hayırlısı, 10) Ey sevenlerin ve sevilenlerin en hayırlısı, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},95:{a:'يَا مَنْ هُوَ لِمَنْ دَعَاهُ مُجِيبٌ ● يَا مَنْ هُوَ لِمَنْ اَطَاعَهُ حَبِيبٌ ● يَا مَنْ هُوَ لِمَنْ اَحَبَّهُ قَرِيبٌ ● يَا مَنْ هُوَ بِمَنْ اَرَادَهُ عَلِيمٌ ● يَا مَنْ هُوَ لِمَنْ رَجَاهُ كَرِيمٌ ● يَا مَنْ هُوَ بِمَنْ عَصَاهُ حَلِيمٌ ● يَا مَنْ هُوَ فِى حِلْمِهِ حَكِيمٌ ● يَا مَنْ هُوَ فِى حُكْمِهِ عَظِيمٌ ● يَا مَنْ هُوَ فِى عَظَمَتِهِ رَحِيمٌ ● يَا مَنْ هُوَ فِٓى اِحْسَانِهِ قَدِيمٌ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩٥﴾',o:'1) Yâ Men hüve limen de\'âhü mücîb 2) Yâ Men hüve limen etâ\'ahû habîb 3) Yâ Men hüve limen ehabbehû karîb 4) Yâ Men hüve bimen erâdehû \'alîm 5) Yâ Men hüve limen recâhü kerîm 6) Yâ Men hüve bimen \'asâhü halîm 7) Yâ Men hüve fî hilmihî hakîm 8) Yâ Men hüve fî hükmihî \'azîm 9) Yâ Men hüve fî \'azametihî rahîm 10) Yâ Men hüve fî ihsânihî kadîm 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey kendisini çağıranlara cevap veren, 2) Ey kendisine itaat edenleri seven, 3) Ey kendisini sevenlere yakın olan, 4) Ey kendisini arzulayanları çok iyi bilen, 5) Ey kendisine ümit besleyenlere iyilik eden, 6) Ey kendisine isyan edenlere yumuşak davranıp hemen cezalandırmayan, 7) Ey yumuşaklığında hikmetli davranan, 8) Ey hükmünde büyük olan, 9) Ey azametinde merhametli olan, 10) Ey ihsânında kadîm olan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},96:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا مُسَبِّبُ ● يَا مُقَرِّبُ ● يَا مُعَقِّبُ ● يَا مُقَلِّبُ ● يَا مُقَدِّرُ ● يَا مُرَتِّبُ ● يَا مُرَغِّبُ ● يَا مُذَكِّرُ ● يَا مُكَوِّنُ ● يَا مُتَكَبِّرُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩٦﴾',o:'1) Ve es\'elüke biesmâike Yâ Musebbib 2) Yâ Mukarrib 3) Yâ Mu\'akkib 4) Yâ Mukallib 5) Yâ Mukaddir 6) Yâ Murattib 7) Yâ Murağğib 8) Yâ Muzekkir 9) Yâ Mukevvîn 10) Yâ Mutekebbir 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey sebepleri takdir eden Müsebbib, 2) Ey itaatkâr kullarını kendisine yaklaştıran Mukarrib, 3) Ey eşyayı hikmetle peş peşe getiren Muakkib, 4) Ey kullarının kalplerini halden hale değiştiren Mukallib, 5) Ey her şeye bir miktar tespit eden Mukaddir, 6) Ey her şeyi düzene koyan Mürettib, 7) Ey kullarını iyiliğe teşvik eden Murağğib, 8) Ey kullarına öğüt veren Müzekkir, 9) Ey mahlûkatı var eden Mükevvin, 10) Ey sonsuz büyüklük ve azamet sahibi Mütekebbir, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},97:{a:'يَا مَنْ لَا يُشْغِلُهُ سَمْعٌ عَنْ سَمْعٍ ● يَا مَنْ لَا يَمْنَعُهُ فِعْلٌ عَنْ فِعْلٍ ● يَا مَنْ لَا يُلْهِيهِ قَوْلٌ عَنْ قَوْلٍ ● يَا مَنْ لَا يُغَلِّطُهُ سُؤَالٌ عَنْ سُؤَالٍ ● يَا مَنْ لَا يُبْرِمُهُ اِلْحَاحُ الْمُلِحّ۪ينَ ● يَا مَنْ شَرَحَ بِاْلاِسْلَامِ صُدُورَ الْمُؤْمِنِينَ ● يَا مَنْ اَطَابَ بِذِكْرِهِ قُلُوبَ الْمُخْبِتِينَ ● يَا مَنْ لَا يَغِيبُ عَنْ قُلُوبِ الْمُشْتَاقِينَ ● يَا مَنْ هُوَ غَايَةُ مُرَادِ الْمُرِيدِينَ ● يَا مَنْ لَا يَخْفٰى عَلَيْهِ شَىْءٌ فِى الْعَالَمِينَ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩٧﴾',o:'1) Yâ Men lâ yuşğilühû sem\'un an sem\' 2) Yâ Men lâ yemne\'uhû fı\'lün an fi\'l 3) Yâ Men lâ yulhîhi kavlün an kavi 4) Yâ Men lâ yuğallituhû süâlün \'an suâl 5) Yâ Men lâ yubrimühû ilhâhu\'Umulihhîn 6) Yâ Men şeraha bi\'l-islâmi sudûra\'l-mü\'minîn 7) Yâ Men etâbe bi zikrihî kulûbe\'l-muhbitîn 8) Yâ Men la yeğibü \'an kulûbi\'l-müştâkın 9) Yâ Men hüve gâyetü mürâdi\'l-mürîdîn 10) Yâ Men la yahfâ \'aleyhi şey\'ün fı\'l-\'âlemîn 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey bir işitme, kendisini diğer bir işitmeden alıkoymayan, 2) Ey kendisi için bir iş diğer bir işe mâni olmayan, 3) Ey bir söz, kendisini diğer bir sözden oyalamayan, 4) Ey kullarının bir isteği diğerine cevap vermekte kendisini karışıklığa sevk etmeyen, 5) Ey ısrarla istekte bulunanların ısrarı kendisini usandırmayan, 6) Ey müminlerin kalplerini İslâm\'la genişleten, 7) Ey zikriyle mütevâzi ve huşû sahiplerinin kalplerini hoş eden, 8) Ey kendisine iştiyak duyanların kalplerinden kaybolmayan, 9) Ey kendisini arzulayanların son arzusu, 10) Ey âlemde hiçbir şey kendisine gizli olmayan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},98:{a:'يَا مَنْ هُوَ عِلْمُهُ سَابِقٌ ● يَا مَنْ هُوَ وَعْدُهُ صَادِقٌ ● يَا مَنْ هُوَ لُطْفُهُ ظَاهِرٌ ● يَا مَنْ هُوَ اَمْرُهُ غَالِبٌ ● يَا مَنْ هُوَ كِتَابُهُ مُحْكَمٌ ● يَا مَنْ هُوَ قَضَٓاؤُهُ كَٓائِنٌ ● يَا مَنْ هُوَ قُرْاٰنُهُ مَجِيدٌ ● يَا مَنْ هُوَ مُلْكُهُ قَدِيمٌ ● يَا مَنْ هُوَ فَضْلُهُ مُقِيمٌ ● يَا مَنْ هُوَ عَرْشُهُ عَظِيمٌ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩٨﴾',o:'1) Yâ Men hüve \'ilmühû sabık 2) Yâ Men hüve va\'dühû sâdık 3) Yâ Men hüve lütfühû zahir 4) Yâ Men hüve emruhû ğâlib 5) Yâ Men hüve kitâbühû muhkem 6) Yâ Men hüve kadâühû kâin 7) Yâ Men hüve kur\'anühû mecîd 8) Yâ Men hüve mülkühû kadîm 9) Yâ Men hüve fadlühû mukîm 10) Yâ Men hüve \'arşühû \'azîm 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey her şeyi var olmadan bilen, 2) Ey vaadi doğru olan, 3) Ey lütfü açık olan, 4) Ey emri üstün ve galip olan, 5) Ey kitabı sağlam olan, 6) Ey kaza ve hükmü var olan, 7) Ey Kur\'ân\'ı yüce olan, 8) Ey saltanatı kadîm olan, 9) Ey fazıl ve keremi dâim olan, 10) Ey Arşı büyük olan, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},99:{a:'يَا رَبَّ الْاَرْبَابِ ● يَا مُفَتِّحَ الْاَبْوَابِ ● يَا مُسَبِّبَ الْاَسْبَابِ ● يَا مُعْطِىَ الثَّوَابِ ● يَا مُلْهِمَ الصَّوَابِ ● يَا مُنْشِىَٔ السَّحَابِ ● يَا شَدِيدَ الْعِقَابِ ● يَا سَرِيعَ الْحِسَابِ ● يَا مَنْ لَهُ اْلاِيَابُ ● يَا غَفُورُ يَا تَوَّابُ ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿٩٩﴾',o:'1) Yâ Rabbe\'l-erbâb 2) Yâ Mufettiha\'l-ebvâb 3) Yâ Musebbibe\'l-esbâb 4) Yâ Mu\'tiye\'s sevâb 5) Yâ Mulhime\'s-savâb 6) Yâ Munşie\'s-sehâb 7) Yâ Şedîde\'l-\'ikâb 8) Yâ Seri\'a\'l-hisâb 9) Yâ Men lehü\'l-iyâb 10) Yâ Gafuru yâ Tevvâb 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Ey rablık iddia edenlerin ve bütün terbiyecilerin Rabbi, 2) Ey bütün kapıları açan, 3) Ey sebepler tasarrufunda bulunan, 4) Ey sevapları veren, 5) Ey doğruları ilham eden, 6) Ey bulutları yoktan yaratan, 7) Ey azap ve ikabı şiddetli olan, 8) Ey hesabı süratli gören, 9) Ey dönüş kendisine olan, 10) Ey bağışlayan ve tövbeleri kabul eden, 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'},100:{a:'وَ اَسْئَلُكَ بِاَسْمَٓائِكَ يَا رَبَّنَا ● يَا اِلٰهَنَا ● يَا سَيِّدَنَا ● يَا مَوْلٰينَا ● يَا نَاصِرَنَا ● يَا حَافِظَنَا ● يَا قَادِرَنَا ● يَا رَازِقَنَا ● يَا دَلِيلَنَا ● يَا مُغِيثَنَا ● سُبْحَانَكَ يَا لَٓا اِلٰهَ اِلَّا ٓ اَنْتَ الْاَمَانَ الْاَمَانَ خَلِّصْنَا مِنَ النَّارِ ﴿١٠٠﴾',o:'1) Ve es\'elüke biesmâike Yâ Rabbena 2) Yâ İlâhenâ 3) Yâ Seyyidenâ 4) Yâ Mevlânâ 5) Yâ Nâsıranâ 6) Yâ Hafızana 7) Yâ Kâdiranâ 8) Yâ Râzikanâ 9) Yâ Delîlenâ 10) Yâ Muğisenâ 11) Sübhâneke yâ lâ ilahe illâ ente\'l-emâ-ne\'l-emâne hallisnâ mine\'n-nâr.',m:'1) Allah\'ım! Senden şu isimlerinin hakkı için istiyor ve yalvarıyorum: Ey Rabbimiz 2) Ey İlâhımız 3) Ey Seyyidimiz 4) Ey Mevlâmız 5) Ey Yardımcımız 6) Ey Koruyucumuz 7) Ey Kâdirimiz 8) Ey Râzıkımız 9) Ey Delilimiz 10) Ey Medetkârımız 11) Bütün kusurlardan münezzehsin, Senden başka ilâh yok! Emân ver bize. Bizi Cehennemden kurtar.'}};

// state = { hatims: [ { id, hatimName, hatimStart, targetDate, description, createdDate, celebrated,

let state = null;
function getStoredSelectedHatimId() {
  try { return localStorage.getItem('cevsenSelectedHatimId') || null; } catch (e) { return null; }
}

function setSelectedHatimId(id) {
  selectedHatimId = id;
  try {
    if (id) localStorage.setItem('cevsenSelectedHatimId', id);
    else localStorage.removeItem('cevsenSelectedHatimId');
  } catch (e) { /* sorun değil */ }
}

let selectedHatimId = getStoredSelectedHatimId();

// Kilidi açtığın turlar 15 dakika boyunca hatırlanır (tarayıcında, localStorage'da) — süre dolunca tekrar şifre sorulur.
const UNLOCK_MINUTES = 15;

function loadUnlockedTurs() {
  try {
    const raw = JSON.parse(localStorage.getItem('cevsenUnlockedTurs') || '{}');
    const now = Date.now();
    const valid = {};
    Object.keys(raw).forEach((id) => { if (raw[id] > now) valid[id] = raw[id]; });
    return valid;
  } catch (e) { return {}; }
}

function saveUnlockedTurs() {
  try { localStorage.setItem('cevsenUnlockedTurs', JSON.stringify(unlockedTurs)); } catch (e) { /* sorun değil */ }
}

let unlockedTurs = loadUnlockedTurs(); // { turId: bitişZamanı(ms) }

function unlockTurFor(turId) {
  unlockedTurs[turId] = Date.now() + UNLOCK_MINUTES * 60 * 1000;
  saveUnlockedTurs();
}

function isTurUnlocked(turId) {
  const exp = unlockedTurs[turId];
  return !!(exp && exp > Date.now());
}

function isTurLocked(h) {
  return !!(h && h.turPassword && !isTurUnlocked(h.id) && !adminMode);
}
let activeIndex = null;

const viewGridBtn = document.getElementById('viewGridBtn');
const viewListBtn = document.getElementById('viewListBtn');
const overlay = document.getElementById('overlay');
const modalContent = document.getElementById('modalContent');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const footNote = document.getElementById('footNote');

const roundItem = document.getElementById('roundItem');
const startValue = document.getElementById('startValue');
const startItem = document.getElementById('startItem');

const targetDateItem = document.getElementById('targetDateItem');

let storageOk = true;
let adminMode = false;
let viewMode = (function () {
  try { return localStorage.getItem('cevsenViewMode') || 'grid'; } catch (e) { return 'grid'; }
})();
let countdownTimer = null;
const MASTER_PIN = '1001'; // yönetici şifresi — dilersen değiştir

function todayStr() {
  const d = new Date();
  return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
}

function genId() {
  return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

// İsim sadece bir kere sorulsun — bu tarayıcıda saklanır, sonraki her bâpta otomatik kullanılır.
function getStoredName() {
  try { return localStorage.getItem('cevsenUserName') || null; } catch (e) { return null; }
}

function setStoredName(name) {
  try { localStorage.setItem('cevsenUserName', name); } catch (e) { /* gizli sekme vb. olabilir, sorun değil */ }
}

function freshTur(name) {
  return {
    id: genId(),
    hatimName: name || '1. Cevşen',
    hatimStart: null,
    targetDate: null,
    description: 'Boş bir bâba dokunup ismini yaz, senin olsun.',
    createdDate: todayStr(),
    celebrated: false,
    turPassword: null,
    cuzler: new Array(TOTAL).fill(null)
  };
}

function freshState() {
  return { hatims: [freshTur('1. Cevşen')] };
}

function migrateIfNeeded(raw) {
  if (raw && Array.isArray(raw.hatims)) return raw;
  return freshState();
}

function sanitizeState(s) {
  if (!s || !Array.isArray(s.hatims) || s.hatims.length === 0) {
    return { hatims: [freshTur('1. Cevşen')] };
  }
  s.hatims.forEach((h) => {
    if (!h.id) h.id = genId();
    if (typeof h.hatimName !== 'string') h.hatimName = '';
    if (!Array.isArray(h.cuzler) || h.cuzler.length !== TOTAL) {
      const old = Array.isArray(h.cuzler) ? h.cuzler : [];
      const fixed = new Array(TOTAL).fill(null);
      for (let i = 0; i < Math.min(old.length, TOTAL); i++) fixed[i] = old[i] || null;
      h.cuzler = fixed;
    }
  });
  return s;
}

function getSelectedTur() {
  if (!state) return null;
  if (!state.hatims || state.hatims.length === 0) {
    state.hatims = [freshTur('1. Cevşen')];
  }
  let h = state.hatims.find((x) => x.id === selectedHatimId);
  if (!h) {
    h = state.hatims[0];
    setSelectedHatimId(h.id);
  }
  return h;
}

async function loadState() {
  if (!firebaseReady) {
    storageOk = false;
    state = freshState();
    render();
    progressLabel.textContent = 'Firebase ayarları eksik — script içindeki firebaseConfig kısmını doldurman gerekiyor.';
    return;
  }
  try {
    const snap = await getDoc(stateDocRef());
    if (snap.exists()) {
      state = sanitizeState(migrateIfNeeded(snap.data()));
      await saveState();
    } else {
      state = freshState();
      await setDoc(stateDocRef(), state);
    }
  } catch (e) {
    storageOk = false;
    state = freshState();
    progressLabel.textContent = 'Firebase\'e bağlanılamadı — ayarları ve Firestore kurallarını kontrol et.';
  }
  try {
    render();
  } catch (e) {
    progressLabel.textContent = 'Bir hata oluştu: ' + e.message + ' — sayfayı yenile.';
  }

  if (firebaseReady) {
    try {
      onSnapshot(stateDocRef(), (snap) => {
        if (!snap.exists()) return;
        if (overlay.classList.contains('open')) return;
        state = sanitizeState(migrateIfNeeded(snap.data()));
        try { render(); } catch (e) { /* sonraki güncellemede düzelir */ }
      });
    } catch (e) { /* canlı senkronizasyon başlatılamadı, sorun değil */ }
  }
}

async function saveState() {
  if (!storageOk || !firebaseReady) return;
  try {
    await setDoc(stateDocRef(), state);
  } catch (e) {
    storageOk = false;
    footNote.textContent = 'Değişiklik kaydedilemedi — bağlantı sorunu olabilir, sayfayı yenile.';
  }
}

async function refetchIfPossible() {
  if (!storageOk || !firebaseReady) return;
  try {
    const snap = await getDoc(stateDocRef());
    if (snap.exists()) {
      state = sanitizeState(migrateIfNeeded(snap.data()));
    }
  } catch (e) { /* keep local state if refetch fails */ }
}

function hideLoadingScreen() {
  const loadingScreen = document.getElementById('loadingScreen');
  if (loadingScreen) loadingScreen.classList.add('hide');
}

function render() {
  const h = getSelectedTur();
  if (!h) {
    progressLabel.textContent = 'Veri yüklenemedi — sayfayı yenile.';
    hideLoadingScreen();
    return;
  }
  const locked = isTurLocked(h);
  const cuzler = h.cuzler;
  const takenCount = cuzler.filter(Boolean).length;
  const completedCount = cuzler.filter((e) => e && e.completed).length;
  progressFill.style.width = (takenCount / TOTAL * 100) + '%';
  progressLabel.textContent = takenCount + ' / ' + TOTAL + ' bâb alındı, ' + completedCount + ' okundu';
  footNote.textContent = adminMode
    ? '🔓 Yönetici modu açık — ismi/tarihleri/açıklamayı değiştirebilir, herhangi bir bâbı boşaltabilirsin.'
    : (h.turPassword ? '🔒 Bu tur özel — şifreyi bilenler bâbları açabilir.' : 'Bu liste herkese açık — burada kim neyi aldığını görebilir.');
  roundValue.textContent = h.hatimName || 'Girilmedi';
  startValue.textContent = h.hatimStart || 'Girilmedi';
  targetDateValue.textContent = h.targetDate || 'Girilmedi';
  descriptionText.textContent = h.description || 'Boş bir bâba dokunup ismini yaz, senin olsun.';
  menuBtn.textContent = adminMode ? '☰ Menü 🔓' : '☰ Menü';
  updateCountdown();

  gridEl.className = 'grid' + (viewMode === 'list' ? ' list-mode' : '') + (locked ? ' blurred' : '');
  viewGridBtn.className = 'view-toggle-btn' + (viewMode === 'grid' ? ' active' : '');

  for (let i = 0; i < TOTAL; i++) {
    const entry = cuzler[i];

    let cls = 'available';
    let statusText = 'Boş';
    if (entry) {
      cls = entry.completed ? 'completed' : 'pending';
      statusText = escapeHtml(entry.name) + (entry.completed ? ' ✓' : '');

    tile.className = 'tile ' + cls;
    tile.innerHTML =

      '<span class="status">' + statusText + '</span>';

    lockOverlay.innerHTML =
      '<div class="tur-lock-card">' +

    const saved = parseFloat(localStorage.getItem('cevsenFontScale'));

  } catch (e) { return 1; }
})();

function changeReaderFont(delta) {
  readerFontScale = Math.min(1.6, Math.max(0.8, Math.round((readerFontScale + delta) * 10) / 10));
  try { localStorage.setItem('cevsenFontScale', String(readerFontScale)); } catch (e) { /* sorun değil */ }
  applyReaderFontScale();
}

function applyReaderFontScale() {
  const contentEl = document.getElementById('readerContent');
  if (contentEl) contentEl.style.setProperty('--font-scale', readerFontScale);
}

let readerHistoryPushed = false;

let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* desteklenmiyor olabilir, sorun değil */ }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && document.getElementById('readerScreen').classList.contains('open')) {

});

    readerHistoryPushed = true;
  }
}

function closeReader() {
  document.getElementById('readerScreen').classList.remove('open');

  releaseWakeLock();
  if (readerHistoryPushed) {

  }
}

function splitArabicLines(text) {
  return text.split('●').map((s) => s.trim()).filter(Boolean);

function splitNumberedLines(text) {
